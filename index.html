<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS NP Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d; --surface: #161616; --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
    --text: #f0efe8; --text2: #888780; --text3: #555450;
    --accent: #c8f542;
    --font-sans: 'DM Sans', sans-serif; --font-mono: 'DM Mono', monospace;
    --radius: 8px; --radius-lg: 12px;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

  /* GATE */
  #gate { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  .gate-box { width: 320px; display: flex; flex-direction: column; gap: 20px; }
  .gate-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; }
  .gate-title { font-size: 22px; font-weight: 500; color: var(--text); line-height: 1.2; }
  .gate-version { font-family: var(--font-mono); font-size: 10px; color: var(--text3); margin-top: 6px; letter-spacing: .06em; }
  .gate-input-wrap { position: relative; }
  .gate-input { width: 100%; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px 44px 12px 16px; color: var(--text); font-family: var(--font-mono); font-size: 14px; outline: none; transition: border-color .2s; }
  .gate-input:focus { border-color: var(--accent); }
  .gate-input::placeholder { color: var(--text3); }
  .gate-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text3); font-size: 15px; line-height: 1; padding: 0; }
  .gate-btn { background: var(--accent); color: #0d0d0d; border: none; border-radius: var(--radius); padding: 12px 20px; font-family: var(--font-sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; width: 100%; }
  .gate-btn:hover { opacity: .88; }
  .gate-error { font-size: 12px; color: #f06b6b; font-family: var(--font-mono); display: none; }
  .gate-error.show { display: block; }

  /* APP */
  #app { display: none; min-height: 100vh; }
  #app.visible { display: block; }
  .topbar { border-bottom: 1px solid var(--border); padding: 0 32px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; background: rgba(13,13,13,0.92); backdrop-filter: blur(8px); }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-name { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--text2); }
  .topbar-sep { color: var(--text3); }
  .topbar-title { font-size: 13px; font-weight: 500; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .last-updated { font-family: var(--font-mono); font-size: 11px; color: var(--text3); }
  .version-badge { font-family: var(--font-mono); font-size: 10px; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; letter-spacing: .04em; }
  .refresh-btn { background: none; border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text2); font-size: 12px; padding: 5px 12px; cursor: pointer; font-family: var(--font-sans); transition: all .15s; }
  .refresh-btn:hover { color: var(--text); background: var(--surface); }
  .logout-btn { background: none; border: none; color: var(--text3); font-size: 12px; cursor: pointer; font-family: var(--font-mono); letter-spacing: .04em; padding: 0; transition: color .15s; }
  .logout-btn:hover { color: var(--text2); }
  .main { max-width: 1100px; margin: 0 auto; padding: 36px 32px 64px; }
  .page-header { margin-bottom: 40px; }
  .page-title { font-size: 28px; font-weight: 300; letter-spacing: -.02em; }
  .page-title strong { font-weight: 500; }
  .page-subtitle { font-size: 13px; color: var(--text3); margin-top: 4px; font-family: var(--font-mono); }
  .tabs { display: flex; gap: 4px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
  .tab { font-size: 13px; font-weight: 400; padding: 8px 18px 10px; background: none; border: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; font-family: var(--font-sans); }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

  /* METRIC CARDS */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; }
  .metric-label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); font-family: var(--font-mono); margin-bottom: 6px; }
  .metric-val { font-size: 22px; font-weight: 500; color: var(--text); letter-spacing: -.02em; font-family: var(--font-mono); }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: var(--font-mono); }
  .metric-sub.pos { color: #5ce0a8; }
  .metric-sub.neg { color: #f06b6b; }

  /* LINE CHART */
  .chart-wrap { position: relative; width: 100%; height: 340px; }
  .chart-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--text3); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 18px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); cursor: pointer; padding: 3px 0; transition: color .15s; user-select: none; }
  .legend-item:hover { color: var(--text2); }
  .legend-item.hidden { opacity: .3; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .chart-tooltip { position: absolute; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 12px 16px; font-size: 12px; pointer-events: none; z-index: 20; min-width: 200px; display: none; }
  .tt-month { font-family: var(--font-mono); font-size: 11px; color: var(--text3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; }
  .tt-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 2px 0; color: var(--text2); }
  .tt-row-label { display: flex; align-items: center; gap: 6px; }
  .tt-dot { width: 6px; height: 6px; border-radius: 1px; flex-shrink: 0; }
  .tt-val { font-family: var(--font-mono); color: var(--text); }
  .tt-total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; font-weight: 500; color: var(--text); }

  /* DONUT SECTION */
  .donut-section { margin-top: 48px; }
  .donut-section-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .donut-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .donut-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 20px 18px; }
  .donut-card-title { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 16px; }
  .donut-card-body { display: flex; align-items: center; gap: 18px; }
  .donut-canvas-wrap { position: relative; width: 128px; height: 128px; flex-shrink: 0; }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .donut-center-pct { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.2; }
  .donut-center-val { font-family: var(--font-mono); font-size: 9px; color: var(--text3); margin-top: 3px; text-align: center; max-width: 80px; }
  .donut-center-name { font-family: var(--font-mono); font-size: 8px; color: var(--text3); margin-top: 1px; text-align: center; max-width: 82px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .donut-leg { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .donut-leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); }
  .donut-leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .donut-leg-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
  .donut-leg-pct { font-family: var(--font-mono); font-size: 10px; flex-shrink: 0; }
  .donut-empty { font-family: var(--font-mono); font-size: 11px; color: var(--text3); text-align: center; padding: 32px 0; }

  /* STATUS */
  .status-bar { margin-top: 32px; padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text3); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #5ce0a8; flex-shrink: 0; }
  .status-dot.loading { background: #f0b429; animation: pulse 1s infinite; }
  .status-dot.error { background: #f06b6b; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
  .error-box { background: rgba(240,107,107,0.06); border: 1px solid rgba(240,107,107,0.2); border-radius: var(--radius); padding: 16px; font-family: var(--font-mono); font-size: 12px; color: #f06b6b; display: none; margin-bottom: 20px; }
  .error-box.show { display: block; }

  @media (max-width: 640px) {
    .topbar { padding: 0 16px; } .main { padding: 24px 16px 48px; }
    .tab { padding: 8px 12px 10px; font-size: 12px; } .metric-val { font-size: 18px; }
    .donut-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- GATE -->
<div id="gate">
  <div class="gate-box">
    <div>
      <p class="gate-label">Protected</p>
      <h1 class="gate-title">VS NP<br>Dashboard</h1>
      <p class="gate-version">v1.4</p>
    </div>
    <div>
      <div class="gate-input-wrap">
        <input class="gate-input" type="password" id="pwd-input" placeholder="Enter password" autocomplete="current-password">
        <button class="gate-toggle" id="pwd-toggle" type="button">&#128065;</button>
      </div>
      <p class="gate-error" id="gate-error">Incorrect password</p>
    </div>
    <button class="gate-btn" id="gate-submit">Unlock &rarr;</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <nav class="topbar">
    <div class="topbar-left">
      <span class="topbar-name">VS NP</span>
      <span class="topbar-sep">&middot;</span>
      <span class="topbar-title">Net Worth Dashboard</span>
    </div>
    <div class="topbar-right">
      <span class="version-badge">v1.4</span>
      <span class="last-updated" id="last-updated">&mdash;</span>
      <button class="refresh-btn" id="refresh-btn">&#8635; Refresh</button>
      <button class="logout-btn" id="logout-btn">lock</button>
    </div>
  </nav>

  <main class="main">
    <div class="page-header">
      <h1 class="page-title">Net Worth <strong>Overview</strong></h1>
      <p class="page-subtitle" id="data-range">Loading data&hellip;</p>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="ink">Ink</button>
      <button class="tab" data-tab="fang">Fang</button>
      <button class="tab" data-tab="household">Household</button>
    </div>

    <div id="metric-grid" class="metric-grid"></div>
    <div class="error-box" id="error-box"></div>

    <div style="position:relative;">
      <div class="chart-wrap">
        <canvas id="main-chart"></canvas>
        <div class="chart-loading" id="chart-loading">Loading&hellip;</div>
      </div>
      <div class="chart-tooltip" id="chart-tooltip"></div>
    </div>
    <div class="legend" id="legend"></div>

    <!-- DONUT SECTION -->
    <div class="donut-section" id="donut-section" style="display:none;">
      <p class="donut-section-title">Asset Allocation Breakdown</p>
      <div class="donut-grid" id="donut-grid"></div>
    </div>

    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Fetching data from Google Sheets&hellip;</span>
    </div>
  </main>
</div>

<script>
// ════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════
const VERSION  = 'v1.4';
const PASSWORD = 'vsnp2026';

const BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSU57IeIZ_tnLFAgZNYUf9dThcFaEm8suslumtMaOVdUPAksG1XicXIFcmVDHWqdPDt9PKP-TgY8-Is/pub?gid=';
const csv  = gid => BASE + gid + '&single=true&output=csv';

const INK_CSV_URL  = csv(0);
const FANG_CSV_URL = csv(576373003);

const INK_CONFIG = {
  monthLabelRow: 0,
  componentRows: [3,4,5,6,7,8],
  dataStartCol: 1,
  componentNames: ['Cash','Dividend portfolio','Growth portfolio','Tax-saving portfolio','Crypto','Provident fund'],
  colors: ['#4da8f5','#5ce0a8','#a78bfa','#f0b429','#f472b6','#fb923c'],
};
const FANG_CONFIG = {
  monthLabelRow: 0,
  componentRows: [3,4,5,6,7],
  dataStartCol: 1,
  componentNames: ['Cash portfolio','Mutual fund','Thai stocks','US stocks','Provident fund'],
  colors: ['#4da8f5','#5ce0a8','#a78bfa','#f0b429','#fb923c'],
};

// Donut configs — nameCol & valueCol are 0-based; rowStart/rowEnd are 0-based row indices
const INK_DONUTS = [
  { title:'Growth portfolio',     url:csv(353664994),  nameCol:1, valueCol:2, rowStart:23, rowEnd:39 },
  { title:'Dividend portfolio',   url:csv(1618449229), nameCol:1, valueCol:2, rowStart:23, rowEnd:39 },
  { title:'Provident fund',       url:csv(381603952),  nameCol:1, valueCol:2, rowStart:23, rowEnd:39 },
  { title:'Tax-saving portfolio', url:csv(1424875369), nameCol:1, valueCol:2, rowStart:23, rowEnd:39 },
  { title:'Crypto',               url:csv(1578394134), nameCol:1, valueCol:2, rowStart:23, rowEnd:39 },
  { title:'Cash',                 url:csv(1773567471), nameCol:1, valueCol:2, rowStart:23, rowEnd:39 },
];
const FANG_DONUTS = [
  { title:'Cash portfolio',       url:csv(825635991),  nameCol:1, valueCol:2, rowStart:33, rowEnd:69 },
  { title:'Mutual fund',          url:csv(1253576610), nameCol:1, valueCol:2, rowStart:33, rowEnd:69 },
  { title:'Thai stock portfolio', url:csv(748123998),  nameCol:1, valueCol:2, rowStart:33, rowEnd:69 },
  { title:'US stock portfolio',   url:csv(672939154),  nameCol:1, valueCol:2, rowStart:33, rowEnd:69 },
  { title:'Provident fund',       url:csv(753946380),  nameCol:1, valueCol:2, rowStart:33, rowEnd:69 },
];

const PALETTE = [
  '#4da8f5','#5ce0a8','#a78bfa','#f0b429','#f472b6','#fb923c',
  '#34d399','#60a5fa','#f87171','#fbbf24','#c084fc','#38bdf8',
  '#a3e635','#e879f9','#4ade80','#fb7185','#818cf8','#facc15',
  '#2dd4bf','#f97316','#84cc16','#e11d48',
];

// ════════════════════════════════════════════════════
// AUTH
// ════════════════════════════════════════════════════
const SK = 'vsnp_auth';
function checkAuth() { return sessionStorage.getItem(SK) === 'true'; }
function unlock() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  sessionStorage.setItem(SK, 'true');
  init();
}
document.getElementById('gate-submit').addEventListener('click', () => {
  if (document.getElementById('pwd-input').value === PASSWORD) { unlock(); }
  else {
    const e = document.getElementById('gate-error');
    e.classList.add('show');
    document.getElementById('pwd-input').value = '';
    setTimeout(() => e.classList.remove('show'), 2500);
  }
});
document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('gate-submit').click(); });
let pwdVis = false;
document.getElementById('pwd-toggle').addEventListener('click', () => {
  pwdVis = !pwdVis;
  document.getElementById('pwd-input').type = pwdVis ? 'text' : 'password';
});
document.getElementById('logout-btn').addEventListener('click', () => { sessionStorage.removeItem(SK); location.reload(); });
if (checkAuth()) unlock();

// ════════════════════════════════════════════════════
// CSV PARSING
// ════════════════════════════════════════════════════
function parseCSV(text) {
  return text.split('\n').map(line => {
    const cols=[]; let cur='', inQ=false;
    for (let i=0;i<line.length;i++) {
      const c=line[i];
      if (c==='"') { inQ=!inQ; }
      else if (c===',' && !inQ) { cols.push(cur.trim()); cur=''; }
      else cur+=c;
    }
    cols.push(cur.trim());
    return cols;
  });
}

function numVal(s) {
  if (!s) return 0;
  const n = parseFloat(String(s).replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? 0 : n;
}

async function fetchCSV(url) {
  const res = await fetch(url + '&_=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + url);
  return parseCSV(await res.text());
}

// Detect currency from raw cell string
function detectCurrency(raw) {
  const s = String(raw||'');
  if (s.includes('$')) return 'USD';
  return 'THB';
}

function fmtCurrency(val, currency) {
  if (currency === 'USD') return '$' + val.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return '\u0e3f' + Math.round(val).toLocaleString('th-TH');
}

// ════════════════════════════════════════════════════
// MASTER TRACKER EXTRACT
// ════════════════════════════════════════════════════
function extractData(rows, config) {
  const labelRow = rows[config.monthLabelRow] || [];
  const months = [];
  let emptyStreak = 0;
  for (let c=config.dataStartCol; c<500; c++) {
    const lbl = (labelRow[c]||'').trim();
    if (!lbl) { emptyStreak++; if (emptyStreak>10) break; continue; }
    emptyStreak = 0;
    const ll = lbl.toLowerCase();
    if (/^\d{4}/.test(lbl)||ll.includes('market value')||ll.includes('actual')||
        ll.includes('budget')||ll.includes('target')||ll.includes('projected')||
        ll.includes('goal')||ll.includes('percentage')) continue;
    if (!config.componentRows.some(ri => numVal((rows[ri]||[])[c]) > 0)) continue;
    months.push({ col:c, label:lbl });
  }
  if (!months.length) return { months:[], components:[], totals:[], firstLabel:'', lastLabel:'' };

  const components = config.componentRows.map((ri,idx) => ({
    name:  config.componentNames[idx],
    color: config.colors[idx],
    values: months.map(m => numVal((rows[ri]||[])[m.col]))
  }));
  const totals = months.map(m => config.componentRows.reduce((s,ri) => s + numVal((rows[ri]||[])[m.col]), 0));
  const labels = months.map(m => m.label);
  return { months:labels, components, totals, firstLabel:labels[0], lastLabel:labels[labels.length-1] };
}

// ════════════════════════════════════════════════════
// DONUT EXTRACT
// ════════════════════════════════════════════════════
function extractDonut(rows, config) {
  const assets = [];
  for (let r=config.rowStart; r<=Math.min(config.rowEnd, rows.length-1); r++) {
    const row  = rows[r] || [];
    const rawN = (row[config.nameCol]  || '').trim();
    const rawV = (row[config.valueCol] || '').trim();
    if (!rawN || !rawV) continue;
    const val = numVal(rawV);
    if (val <= 0) continue;
    assets.push({ name:rawN, value:val, currency:detectCurrency(rawV) });
  }
  const total = assets.reduce((s,a) => s+a.value, 0);
  return assets.map(a => ({ ...a, pct: total>0 ? a.value/total*100 : 0 }));
}

// ════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════
let inkData=null, fangData=null;
let inkDonuts=[], fangDonuts=[];
let donutInstances={};

// ════════════════════════════════════════════════════
// LOAD
// ════════════════════════════════════════════════════
async function loadData() {
  setStatus('loading','Fetching from Google Sheets\u2026');
  document.getElementById('chart-loading').style.display = 'flex';
  document.getElementById('error-box').classList.remove('show');
  try {
    const [inkRows, fangRows] = await Promise.all([fetchCSV(INK_CSV_URL), fetchCSV(FANG_CSV_URL)]);
    inkData  = extractData(inkRows,  INK_CONFIG);
    fangData = extractData(fangRows, FANG_CONFIG);
    if (!inkData.months.length || !fangData.months.length)
      throw new Error('No data found \u2014 check sheet is published');

    // Fetch all donut CSVs in parallel
    const [inkDRows, fangDRows] = await Promise.all([
      Promise.all(INK_DONUTS.map(d  => fetchCSV(d.url))),
      Promise.all(FANG_DONUTS.map(d => fetchCSV(d.url))),
    ]);
    inkDonuts  = INK_DONUTS.map((d,i)  => ({ title:d.title, assets:extractDonut(inkDRows[i],  d) }));
    fangDonuts = FANG_DONUTS.map((d,i) => ({ title:d.title, assets:extractDonut(fangDRows[i], d) }));

    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    setStatus('ok', 'Live \u00b7 Google Sheets \u00b7 ' + VERSION + ' \u00b7 Auto-updates on refresh');
    document.getElementById('chart-loading').style.display = 'none';
    return true;
  } catch(e) {
    setStatus('error','Failed: ' + e.message);
    const eb = document.getElementById('error-box');
    eb.textContent = 'Error: ' + e.message;
    eb.classList.add('show');
    document.getElementById('chart-loading').style.display = 'none';
    return false;
  }
}

function setStatus(state, msg) {
  document.getElementById('status-dot').className = 'status-dot' + (state==='loading'?' loading':state==='error'?' error':'');
  document.getElementById('status-text').textContent = msg;
}

// ════════════════════════════════════════════════════
// FORMAT HELPERS
// ════════════════════════════════════════════════════
function fmtM(v) {
  const a = Math.abs(v);
  if (a>=1e6) return '\u0e3f'+(v/1e6).toFixed(2)+'M';
  if (a>=1e3) return '\u0e3f'+(v/1e3).toFixed(0)+'K';
  return '\u0e3f'+Math.round(v).toLocaleString();
}
function fmtPct(a,b) {
  if (!b||b===0) return '\u2014';
  const d=(a-b)/b*100;
  return (d>=0?'+':'')+d.toFixed(1)+'%';
}
function hexA(hex,a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ════════════════════════════════════════════════════
// METRICS
// ════════════════════════════════════════════════════
function renderMetrics(tab) {
  function pCards(d) {
    const last=d.totals[d.totals.length-1], prev=d.totals[d.totals.length-2]??last, first=d.totals[0];
    const mom=fmtPct(last,prev), peak=Math.max(...d.totals);
    return [
      {label:'Current net worth', val:fmtM(last),          sub:mom+' MoM',                      cls:parseFloat(mom)>=0?'pos':'neg'},
      {label:'All-time growth',   val:fmtPct(last,first),  sub:'Since '+d.firstLabel,            cls:''},
      {label:'Peak',              val:fmtM(peak),          sub:d.months[d.totals.indexOf(peak)], cls:''},
      {label:'Months tracked',    val:d.months.length,     sub:d.firstLabel+' \u2192 '+d.lastLabel, cls:''},
    ];
  }
  let cards;
  if (tab==='ink')  cards=pCards(inkData);
  else if (tab==='fang') cards=pCards(fangData);
  else {
    const iL=inkData.totals[inkData.totals.length-1], fL=fangData.totals[fangData.totals.length-1], tot=iL+fL;
    const mom=fmtPct(tot,(inkData.totals[inkData.totals.length-2]??iL)+(fangData.totals[fangData.totals.length-2]??fL));
    cards=[
      {label:'Household net worth', val:fmtM(tot),                      sub:mom+' MoM',          cls:parseFloat(mom)>=0?'pos':'neg'},
      {label:"Ink's share",         val:(iL/tot*100).toFixed(0)+'%',    sub:fmtM(iL),            cls:''},
      {label:"Fang's share",        val:(fL/tot*100).toFixed(0)+'%',    sub:fmtM(fL),            cls:''},
      {label:'Data since',          val:inkData.firstLabel,             sub:'Ink started first', cls:''},
    ];
  }
  document.getElementById('metric-grid').innerHTML = cards.map(c =>
    `<div class="metric-card"><p class="metric-label">${c.label}</p><p class="metric-val">${c.val}</p><p class="metric-sub ${c.cls}">${c.sub}</p></div>`
  ).join('');
}

function renderDataRange(tab) {
  const el = document.getElementById('data-range');
  if (tab==='ink')       el.textContent=`${inkData.firstLabel} \u2192 ${inkData.lastLabel} \u00b7 ${inkData.months.length} months`;
  else if (tab==='fang') el.textContent=`${fangData.firstLabel} \u2192 ${fangData.lastLabel} \u00b7 ${fangData.months.length} months`;
  else                   el.textContent=`Ink from ${inkData.firstLabel} \u00b7 Fang from ${fangData.firstLabel}`;
}

// ════════════════════════════════════════════════════
// LINE CHART
// ════════════════════════════════════════════════════
let chartInst = null;
let hiddenSeries = new Set();

function buildDatasets(tab) {
  if (tab==='ink'||tab==='fang') {
    const d = tab==='ink' ? inkData : fangData;
    const ds = d.components.filter(c=>!hiddenSeries.has(c.name)).map(c=>({
      label:c.name, data:c.values, borderColor:c.color, backgroundColor:hexA(c.color,0.15),
      borderWidth:1.5, fill:'origin', tension:0.4, pointRadius:2, pointHoverRadius:5,
      pointBackgroundColor:c.color, stack:'stack'
    }));
    ds.push({ label:'__total__', data:d.totals, borderColor:'rgba(255,255,255,0.35)', backgroundColor:'transparent', borderWidth:1.5, borderDash:[4,3], fill:false, tension:0.4, pointRadius:0, pointHoverRadius:4, stack:undefined });
    return { labels:d.months, datasets:ds };
  } else {
    const im=inkData.months, fs=im.indexOf(fangData.months[0]);
    const combined = inkData.totals.map((v,i)=>{ const fi=fs!==-1?i-fs:-1; return v+(fi>=0&&fi<fangData.totals.length?fangData.totals[fi]:0); });
    const fAl = im.map((_,i)=>{ const fi=fs!==-1?i-fs:-1; return fi>=0&&fi<fangData.totals.length?fangData.totals[fi]:null; });
    return { labels:im, datasets:[
      {label:'Ink',  data:inkData.totals, borderColor:'#4da8f5', backgroundColor:hexA('#4da8f5',0.08), borderWidth:2, fill:false, tension:0.4, pointRadius:2, pointHoverRadius:5, pointBackgroundColor:'#4da8f5'},
      {label:'Fang', data:fAl, borderColor:'#5ce0a8', backgroundColor:hexA('#5ce0a8',0.08), borderWidth:2, fill:false, tension:0.4, pointRadius:2, pointHoverRadius:5, pointBackgroundColor:'#5ce0a8', spanGaps:false},
      {label:'Household total', data:combined, borderColor:'#c8f542', backgroundColor:hexA('#c8f542',0.06), borderWidth:2, borderDash:[5,3], fill:false, tension:0.4, pointRadius:0, pointHoverRadius:5, pointBackgroundColor:'#c8f542'}
    ]};
  }
}

function renderChart(tab) {
  if (chartInst) { chartInst.destroy(); chartInst=null; }
  const {labels,datasets} = buildDatasets(tab);
  chartInst = new Chart(document.getElementById('main-chart').getContext('2d'), {
    type:'line', data:{labels,datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false}, tooltip:{enabled:false, external:extTooltip}},
      scales:{
        x:{grid:{color:'rgba(255,255,255,0.04)',drawBorder:false}, ticks:{color:'#555450',font:{family:"'DM Mono',monospace",size:10},maxRotation:45,autoSkip:true,maxTicksLimit:14}, border:{color:'rgba(255,255,255,0.06)'}},
        y:{grid:{color:'rgba(255,255,255,0.04)',drawBorder:false}, ticks:{color:'#555450',font:{family:"'DM Mono',monospace",size:10},callback:v=>fmtM(v)}, border:{color:'rgba(255,255,255,0.06)'}, beginAtZero:true}
      }
    }
  });
}

function extTooltip(ctx) {
  const tt=document.getElementById('chart-tooltip');
  if (ctx.tooltip.opacity===0){tt.style.display='none';return;}
  const t=ctx.tooltip;
  const vis=t.dataPoints.filter(p=>p.dataset.label!=='__total__'&&p.raw!==null);
  const totPt=t.dataPoints.find(p=>p.dataset.label==='__total__');
  const hhPt=t.dataPoints.find(p=>p.dataset.label==='Household total');
  let html=`<div class="tt-month">${t.title[0]||''}</div>`;
  vis.forEach(p=>{html+=`<div class="tt-row"><span class="tt-row-label"><span class="tt-dot" style="background:${p.dataset.borderColor}"></span>${p.dataset.label}</span><span class="tt-val">${fmtM(p.raw)}</span></div>`;});
  if (totPt) html+=`<div class="tt-row tt-total"><span>Total</span><span class="tt-val">${fmtM(totPt.raw)}</span></div>`;
  else if (hhPt&&hhPt.raw!==null) html+=`<div class="tt-row tt-total"><span>Household</span><span class="tt-val">${fmtM(hhPt.raw)}</span></div>`;
  tt.innerHTML=html; tt.style.display='block';
  const wr=tt.parentElement.getBoundingClientRect();
  let l=t.caretX+18; if(l+220>wr.width)l=t.caretX-230;
  tt.style.left=Math.max(0,l)+'px'; tt.style.top=Math.max(0,t.caretY-20)+'px';
}

// ════════════════════════════════════════════════════
// LEGEND
// ════════════════════════════════════════════════════
function renderLegend(tab) {
  const leg=document.getElementById('legend');
  if (tab==='household') {
    leg.innerHTML=[{n:'Ink',c:'#4da8f5'},{n:'Fang',c:'#5ce0a8'},{n:'Household total',c:'#c8f542'}]
      .map(i=>`<span class="legend-item"><span class="legend-dot" style="background:${i.c}"></span>${i.n}</span>`).join('');
    return;
  }
  const d=tab==='ink'?inkData:fangData;
  leg.innerHTML=d.components.map(c=>`<span class="legend-item ${hiddenSeries.has(c.name)?'hidden':''}" onclick="toggleS('${c.name}')"><span class="legend-dot" style="background:${c.color}"></span>${c.name}</span>`).join('');
}
function toggleS(name) {
  if(hiddenSeries.has(name))hiddenSeries.delete(name);else hiddenSeries.add(name);
  renderLegend(currentTab);renderChart(currentTab);
}

// ════════════════════════════════════════════════════
// DONUT CHARTS
// ════════════════════════════════════════════════════
function renderDonuts(tab) {
  const section=document.getElementById('donut-section');
  const grid=document.getElementById('donut-grid');

  // Destroy existing chart instances
  Object.values(donutInstances).forEach(c=>c.destroy());
  donutInstances={};

  if (tab==='household') { section.style.display='none'; return; }
  section.style.display='block';

  const list = tab==='ink' ? inkDonuts : fangDonuts;

  grid.innerHTML = list.map((d,idx) => {
    if (!d.assets.length) return `<div class="donut-card"><p class="donut-card-title">${d.title}</p><p class="donut-empty">No data</p></div>`;
    const legItems = d.assets.map((a,ai)=>`
      <div class="donut-leg-item">
        <span class="donut-leg-dot" style="background:${PALETTE[ai%PALETTE.length]}"></span>
        <span class="donut-leg-name" title="${a.name}">${a.name}</span>
        <span class="donut-leg-pct">${a.pct.toFixed(1)}%</span>
      </div>`).join('');
    return `
      <div class="donut-card">
        <p class="donut-card-title">${d.title}</p>
        <div class="donut-card-body">
          <div class="donut-canvas-wrap">
            <canvas id="dc-${tab}-${idx}" width="128" height="128"></canvas>
            <div class="donut-center" id="dctr-${tab}-${idx}">
              <span class="donut-center-pct">—</span>
              <span class="donut-center-val">hover</span>
              <span class="donut-center-name">&nbsp;</span>
            </div>
          </div>
          <div class="donut-leg">${legItems}</div>
        </div>
      </div>`;
  }).join('');

  // Build charts after DOM is ready
  requestAnimationFrame(() => {
    list.forEach((d, idx) => {
      if (!d.assets.length) return;
      const canvas = document.getElementById(`dc-${tab}-${idx}`);
      const center = document.getElementById(`dctr-${tab}-${idx}`);
      if (!canvas || !center) return;

      const colors = d.assets.map((_,ai) => PALETTE[ai % PALETTE.length]);

      const chart = new Chart(canvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: d.assets.map(a=>a.name),
          datasets: [{
            data: d.assets.map(a=>a.pct),
            backgroundColor: colors,
            borderColor: '#161616',
            borderWidth: 2,
            hoverOffset: 8,
          }]
        },
        options: {
          responsive: false,
          cutout: '70%',
          animation: { duration: 400 },
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          onHover: (_evt, elements) => {
            const pctEl  = center.querySelector('.donut-center-pct');
            const valEl  = center.querySelector('.donut-center-val');
            const nameEl = center.querySelector('.donut-center-name');
            if (elements.length > 0) {
              const i = elements[0].index;
              const a = d.assets[i];
              pctEl.textContent  = a.pct.toFixed(1) + '%';
              valEl.textContent  = fmtCurrency(a.value, a.currency);
              nameEl.textContent = a.name;
            } else {
              pctEl.textContent  = '—';
              valEl.textContent  = 'hover';
              nameEl.textContent = '\u00a0';
            }
          }
        }
      });
      donutInstances[`dc-${tab}-${idx}`] = chart;
    });
  });
}

// ════════════════════════════════════════════════════
// TABS & RENDER
// ════════════════════════════════════════════════════
let currentTab = 'ink';
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    hiddenSeries.clear();
    renderAll(currentTab);
  });
});

function renderAll(tab) {
  renderMetrics(tab);
  renderDataRange(tab);
  renderLegend(tab);
  renderChart(tab);
  renderDonuts(tab);
}

document.getElementById('refresh-btn').addEventListener('click', async () => {
  const ok = await loadData();
  if (ok) renderAll(currentTab);
});

async function init() {
  const ok = await loadData();
  if (ok) renderAll('ink');
}
</script>
