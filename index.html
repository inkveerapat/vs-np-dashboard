<!--
  FANTASY 90 — CHANGELOG
  Bump APP_VERSION (in the CONFIG section of the script block) whenever you
  ship a change, and add a line here so it's easy to see what shipped when.

  v2.5.0 — Charts on touch devices now tell scrolling and scrubbing apart:
           a vertical swipe passes through as a normal page scroll (and
           suppresses the tooltip for that gesture, so it doesn't hang
           around while you're just scrolling past), while a horizontal
           drag blocks page scroll, tracks the tooltip live as you slide,
           and commits whichever gameweek it's showing the moment you lift
           your finger — much easier than aiming a single tap at one of 38
           narrow columns. A clean tap with no real movement still works
           exactly as before. Applies to all 3 charts.
  v2.4.1 — Fixed the Total Points and Balance section titles wrapping one
           word per line. The leader chip next to each title ("🏆 Name ·
           Npt") refused to shrink, so on longer names it squeezed the
           title into an unreadably narrow column instead. The title now
           keeps a sensible minimum width, and the chip drops to its own
           line below when there isn't room for both side by side.
  v2.4.0 — Removed hover-to-preview on player rows (desktop mouse movement
           was constantly re-triggering it while just moving across the
           list). Tap/click is now the only way to select a player on every
           platform, matching mobile — tap to select, tap again (or the
           strip's ✕) to clear.
  v2.3.0 — Fixed the pinned player getting visually overshadowed by the rank
           leader's marker on all 3 charts. The big glowing ring is now
           purely "whoever you tapped" — if someone's pinned, only their
           marker gets big, full stop, regardless of rank. The small rank/
           crown/money badge is unchanged, so you can still see who's #1 at
           a glance even while a different player is spotlighted.
  v2.2.0 — Simplified the Gameweek Points chart to match the other two:
           every line is now always the player's own color at a uniform
           width, full stop — no more "highlighted this week" vs "muted"
           line/tooltip-swatch distinction to keep in sync per gameweek.
           "Positive balance this week" is conveyed only by the endpoint
           ring and rank badge (which already correctly update per whichever
           gameweek you're inspecting).
  v2.1.1 — The previous fix only updated the endpoint ring; the Gameweek
           Points chart's actual line color/width (and its tooltip color
           swatch) was still baked to the latest gameweek's winners at chart
           creation and never revisited. Both now recompute together for
           whichever gameweek you're inspecting, so a past GW's tooltip
           shows that week's winners highlighted, not the current week's.
  v2.1.0 — Fixed the endpoint ring/badge on all 3 charts always reflecting
           the latest gameweek's leader, even while inspecting a past
           gameweek below. It now recomputes for whichever week you've
           tapped into, matching the leaderboard rows underneath (ties are
           still handled — every player tied for the lead gets the badge).
  v2.0.1 — Fixed inconsistent-looking bold/weight in chart tooltips: canvas
           text doesn't wait for @font-face to finish loading, so a chart
           drawn too early could silently fall back to the system font for
           good, even after IBM Plex Mono arrived. Charts now wait for both
           font weights to be confirmed loaded before drawing anything.
  v2.0.0 — Tooltip rows on all 3 charts now always sort highest-to-lowest for
           whichever gameweek you're pointing at (previously they were in a
           fixed dataset order that only happened to look sorted for the
           latest gameweek). Added a light haptic tick as you drag across a
           chart and cross into a new gameweek — note this only works on
           Android Chrome; iOS Safari doesn't expose haptics to web pages at
           all (not even installed PWAs), so iPhones won't feel anything
           here regardless of how this is built.
  v1.9.1 — Fixed a color mismatch: on the Total Points and Balance charts,
           the leader's line/avatar ring was being swapped to gold, so it no
           longer matched their own color in the leaderboard. Every player's
           line, avatar ring, and leaderboard swatch now always use the same
           personal color everywhere — "leader" is conveyed by a thicker
           line and the 👑/💰 badge instead of a color swap. Also added a
           hint that tapping a manager traces their line on the chart
           (the feature already worked, it just wasn't sign-posted).
  v1.9.0 — Replaced plain color dots with animal mascots (🦊🐷🐺🐢🐻🦓🐯🦅🐶🐙🦁,
           one per manager, paired to their existing line color) everywhere a
           player is identified: leaderboard rows, the player-detail strip,
           leader chips, and — the fun part — the endpoint of each line on
           all 3 charts, so it now genuinely looks like animals racing
           toward the finish flag. Line colors are unchanged (still needed
           to trace a line across all 38 gameweeks); avatars replace single-
           point markers only.
  v1.8.0 — Redesigned the info row as wrapping stat chips (pool, entry,
           prizes, gameweeks remaining) instead of plain wrapped text — each
           stat is now a self-contained pill, so nothing depends on emoji
           width for alignment and everything reads level.
  v1.7.1 — Moved the info row out of the sticky header. It now scrolls away
           with the page like normal content instead of staying pinned/
           overlaying things underneath it as you scroll. Only the title bar
           and gameweek pill stay stuck to the top.
  v1.7.0 — Removed the scrolling ticker animation (looping CSS animations can
           silently freeze on iOS after the screen locks/unlocks, and don't
           resume without a reload) — same info now shown as a static wrapped
           row instead. Also fixed the real cause of "refresh doesn't update
           the site": the service worker was caching index.html and only
           re-checks for updates when its own file's bytes change, so an
           index.html-only deploy never got picked up. sw.js is now a
           one-time cleanup script that clears all caches and unregisters
           itself — pages are fetched fresh from the network from here on,
           same as a normal site.
  v1.6.0 — Added player highlighting on all 3 charts: hover a row on desktop
           for a preview, or tap a row on mobile/desktop to pin it. The
           selected player's line brightens, every other line fades, and a
           scrollable strip appears below the chart showing their value for
           every gameweek so far (tap the row again, or the ✕ on the strip,
           to clear).
  v1.5.0 — Fixed the standalone-app icon not showing: the home-screen icon
           (iOS only reads its own <link rel="apple-touch-icon">, never the
           manifest) and the favicon are now embedded directly in the page as
           inline data, and manifest.json's icons are embedded too — so home-
           screen icons no longer depend on the icons/ folder having uploaded
           correctly. Service worker also now caches each app-shell file
           independently, so one missing file can't silently break the whole
           offline cache.
  v1.4.1 — Fixed a leader-badge bug: the crown/money-bag badge was detected by
           comparing line color to the highlight gold, so any player whose own
           assigned color happened to be that same gold got a false badge.
           Now tracked with an explicit flag instead of a color match.
  v1.4.0 — Removed the "Add to home screen" install banner (suspected cause
           of a white-space/scroll issue on some phones). You can still
           manually add it to your home screen via the browser's own share
           menu — see the walkthrough in chat.
  v1.3.0 — Clearer messaging when the sheet's own live-score formula errors out
           (shows "SHEET SYNC ERROR" instead of a misleading "SEASON NOT
           STARTED"). Added a background safety-net fix for a white-space
           rendering gap some mobile browsers showed below the footer.
  v1.2.0 — Leaderboards are now clickable history: tap any past gameweek on a
           chart to see the standings as of that week (gold marker line shows
           what's selected; "Jump to latest" resets it). Gameweek Points list
           now sorts by GW points (rank badge still keyed to weekly balance).
  v1.1.0 — Added on-page version number (footer) + this changelog block.
  v1.0.1 — Fixed Chart.js CDN link (4.4.4 doesn't exist on cdnjs; pinned to 4.4.1).
  v1.0.0 — Initial build: 3 racetrack charts, scoreboard header, PWA install support.
-->

<style>
:root{
  --pitch-0:#051e13;
  --pitch-1:#0a3520;
  --pitch-2:#0f4a2c;
  --pitch-3:#155c37;
  --line-white:rgba(255,255,255,.14);
  --cream:#f2f7f1;
  --gold:#ffc145;
  --gold-dk:#c48a18;
  --silver:#c9d2da;
  --bronze:#d98c4a;
  --turf:#4fe3a1;
  --danger:#ff5b5b;
  --muted:#7fa08f;
  --card:#0d3823;
  --card-2:#0a2f1d;
  --radius:18px;
  --disp:'Teko',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{background:var(--pitch-0);min-height:100%;}
body{
  background:
    radial-gradient(1200px 800px at 50% -10%, var(--pitch-2), var(--pitch-0) 65%);
  color:var(--cream);
  font-family:var(--body);
  min-height:100vh;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}

/* ---------- Top scoreboard ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(180deg,rgba(5,20,13,.97),rgba(5,20,13,.88) 70%,rgba(5,20,13,0));
  backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:baseline;gap:8px;}
.brand h1{
  font-family:'Teko',sans-serif;
  font-weight:700;
  font-size:34px;
  letter-spacing:.5px;
  margin:0;
  line-height:.85;
  background:linear-gradient(180deg,#fff,var(--gold) 120%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand .tag{font-size:10px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;font-weight:600;}
.refresh-btn{
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  color:var(--cream);display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;flex:none;
}
.refresh-btn.spinning svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.gwstrip{
  margin-top:10px;
  display:flex;align-items:center;gap:10px;
  background:rgba(0,0,0,.22);
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  padding:6px 6px 6px 14px;
}
.gwstrip .lbl{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-weight:700;white-space:nowrap;}
.gwstrip .num{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--cream);white-space:nowrap;}
.pill{
  margin-left:auto;
  font-size:11px;font-weight:700;letter-spacing:.5px;
  padding:6px 12px;border-radius:999px;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.pill.completed{background:rgba(79,227,161,.14);color:var(--turf);border:1px solid rgba(79,227,161,.35);}
.pill.inprogress{background:rgba(255,193,69,.15);color:var(--gold);border:1px solid rgba(255,193,69,.4);animation:pulse 1.8s ease-in-out infinite;}
.pill.notstarted{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid rgba(255,255,255,.1);}
.pill.error{background:rgba(255,91,91,.14);color:var(--danger);border:1px solid rgba(255,91,91,.35);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.ticker-wrap{
  margin:10px 16px 4px;
  display:flex;flex-wrap:wrap;gap:7px;
}
.chip-stat{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 10px;border-radius:999px;
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  white-space:nowrap;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:var(--cream);
}
.chip-stat.accent-gold{background:rgba(255,193,69,.12);border-color:rgba(255,193,69,.32);color:var(--gold);}
.chip-stat.accent-turf{background:rgba(79,227,161,.12);border-color:rgba(79,227,161,.32);color:var(--turf);}
.chip-stat.accent-danger{
  background:rgba(255,91,91,.12);border-color:rgba(255,91,91,.35);color:var(--danger);
  width:100%;white-space:normal;
}
@media (prefers-reduced-motion:reduce){
  .pill.inprogress{animation:none;}
}

/* ---------- layout ---------- */
main{padding:16px;max-width:760px;margin:0 auto;}
.section{margin-bottom:26px;}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;margin-bottom:8px;gap:6px 8px;}
.sec-head > div:first-child{flex:1 1 200px;min-width:0;}
.sec-head h2{
  font-family:'Teko',sans-serif;font-weight:600;font-size:24px;letter-spacing:.3px;
  margin:0;display:flex;align-items:center;gap:8px;color:var(--cream);
}
.sec-head .emoji{font-size:20px;}
.sec-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.leader-chip{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;
  background:rgba(255,193,69,.1);border:1px solid rgba(255,193,69,.3);
  border-radius:999px;padding:5px 10px 5px 6px;
  font-size:11.5px;font-weight:700;color:var(--gold);white-space:nowrap;
}
.avatar-badge{
  width:22px;height:22px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;
  background:rgba(255,255,255,.06);
}
.row .avatar-badge{box-shadow:inset 0 0 0 1.5px var(--ring, rgba(255,255,255,.3));}
.strip-head .avatar-badge{width:20px;height:20px;font-size:12px;box-shadow:inset 0 0 0 1.5px var(--ring, rgba(255,255,255,.3));}
.leader-chip .avatar-badge{width:18px;height:18px;font-size:11px;}

.card{
  background:linear-gradient(180deg,var(--card),var(--card-2));
  border:1px solid rgba(255,255,255,.07);
  border-radius:var(--radius);
  padding:14px 10px 8px;
  box-shadow:0 10px 30px -14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;
}
.card.hero{
  border-color:rgba(255,193,69,.28);
  box-shadow:0 14px 40px -16px rgba(255,193,69,.18), 0 10px 30px -14px rgba(0,0,0,.6);
}
.chart-wrap{position:relative;height:230px;}
.hero .chart-wrap{height:270px;}

/* leaderboard */
.board{margin-top:10px;display:flex;flex-direction:column;gap:5px;}
.row{
  display:flex;align-items:center;gap:9px;
  padding:7px 9px;border-radius:10px;
  background:rgba(255,255,255,.03);
  font-size:12.5px;
}
.row.top1{background:linear-gradient(90deg,rgba(255,193,69,.16),rgba(255,193,69,.03));border:1px solid rgba(255,193,69,.28);}
.row.top2{background:linear-gradient(90deg,rgba(201,210,218,.13),rgba(201,210,218,.02));border:1px solid rgba(201,210,218,.22);}
.row.top3{background:linear-gradient(90deg,rgba(217,140,74,.13),rgba(217,140,74,.02));border:1px solid rgba(217,140,74,.22);}
.rank{
  font-family:var(--mono);font-weight:700;font-size:11px;
  width:20px;height:20px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);color:var(--muted);
}
.row.top1 .rank{background:var(--gold);color:#1a1200;}
.row.top2 .rank{background:var(--silver);color:#1a1200;}
.row.top3 .rank{background:var(--bronze);color:#1a1200;}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.row .val{font-family:var(--mono);font-weight:700;font-size:13px;flex:none;}
.row .val.pos{color:var(--turf);}
.row .val.neg{color:var(--danger);}
.row .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none;width:30px;text-align:right;}
.board-more{
  text-align:center;font-size:11px;color:var(--muted);padding:6px;cursor:pointer;
  border-top:1px dashed rgba(255,255,255,.08);margin-top:2px;
}
.gw-note{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;color:var(--muted);padding:8px 2px 4px;
}
.gw-note .tag{
  font-family:var(--mono);font-weight:700;color:var(--gold);letter-spacing:.3px;
}
.gw-note .jump{
  background:rgba(255,193,69,.12);border:1px solid rgba(255,193,69,.35);color:var(--gold);
  border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:4px;
}
.gw-note .hint{color:var(--muted);}

.player-strip{
  overflow:hidden;max-height:0;opacity:0;
  transition:max-height .25s ease, opacity .2s ease, margin .25s ease;
}
.player-strip.open{max-height:120px;opacity:1;margin-top:10px;}
.strip-head{
  display:flex;align-items:center;gap:7px;padding:0 2px 6px;
}
.strip-head .strip-name{font-weight:700;font-size:12.5px;color:var(--cream);}
.strip-head .strip-hint{margin-left:auto;font-size:10px;color:var(--muted);}
.strip-head .strip-clear{
  background:rgba(255,255,255,.08);border:none;color:var(--muted);
  border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.strip-scroll{
  display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;
  scrollbar-width:none;
}
.strip-scroll::-webkit-scrollbar{display:none;}
.strip-scroll .chip{
  flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);
  border-radius:10px;padding:6px 10px;min-width:52px;
}
.chip-gw{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.3px;}
.chip-val{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--cream);}
.chip-val.pos{color:var(--turf);}
.chip-val.neg{color:var(--danger);}

.row{cursor:pointer;}
.row.row-active{
  background:rgba(255,255,255,.09);
  box-shadow:inset 0 0 0 1px rgba(255,193,69,.35);
}

footer{
  max-width:760px;margin:10px auto 0;padding:14px 20px 6px;
  text-align:center;color:var(--muted);font-size:10.5px;line-height:1.7;
}
footer .rules{
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-bottom:10px;
  font-family:var(--mono);font-size:11px;color:var(--muted);
}
footer .rules b{color:var(--gold);}
.loading-screen{
  position:fixed;inset:0;z-index:100;background:var(--pitch-0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .4s ease;
}
.loading-screen.hide{opacity:0;pointer-events:none;}
.loading-screen .ball{
  width:46px;height:46px;border-radius:50%;
  border:3px solid rgba(255,255,255,.12);border-top-color:var(--gold);
  animation:spin .8s linear infinite;
}
.loading-screen p{color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase;font-family:var(--mono);}
.err-box{
  margin:16px;padding:16px;border-radius:14px;background:rgba(255,91,91,.08);
  border:1px solid rgba(255,91,91,.3);color:#ffb3b3;font-size:13px;
}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">

</div>

<div class="topbar">
  <div class="brandrow">

    </div>
    <button class="refresh-btn" id="refreshBtn" aria-label="Refresh">

<main id="mainContent" style="display:none;">

  <div class="section" id="secGwPoints">

</main>

<div id="errBox"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const APP_VERSION = "2.5.0"; // bump this + add a line to the changelog comment at the top of the file
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSNO0Lp5FBIBKtYQZmzZBPnWGSmXhWq1ixOEICPAsWbpCNbxMoZ-mAqvDkcJQnHx_f7NGxiwk6V9AEO/pub?gid=803347701&single=true&output=csv";
const TOTAL_GAMEWEEKS = 38;
const GW_BLOCK_START_COL = 2; // 0-indexed column C: first GW's "GW Points" cell
const GW_BLOCK_WIDTH = 4;     // GW Points, Total Points, GW Balance, Total Balance
const STATUS_ROW_INDEX = 14;  // 0-indexed row 15
const POOL_ROW_INDEX = 16;    // "Total point pool" row
const META_START_ROW = 19;    // "11,no of players" etc (0-indexed row 20 -> actually adjust below)

const PLAYER_COLORS = [
  "#4fe3a1", "#ffc145", "#7fb2ff", "#ff8fb1", "#c9a6ff",
  "#ff9d5c", "#5cd6ff", "#e0e35c", "#ff6b6b", "#8ce3c4", "#d9a6ff"
];
// paired 1:1 with PLAYER_COLORS by index — same assignment rule, so a
// player's mascot and line color always stay linked to each other
const PLAYER_AVATARS = [
  "🦊", "🐷", "🐺", "🐢", "🐻", "🦓", "🐯", "🦅", "🐶", "🐙", "🦁"
];

let chartGwPointsInst, chartTotalPointsInst, chartBalanceInst;

/* ============================================================
   HELPERS
   ============================================================ */
function gwColStart(gw){ return GW_BLOCK_START_COL + (gw - 1) * GW_BLOCK_WIDTH; }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmtBaht(v){
  const s = Math.abs(v).toLocaleString();
  return (v < 0 ? "-฿" : "฿") + s;
}
function normStatus(raw){
  const s = (raw || "").trim().toUpperCase();
  if (["CONFIRMED","COMPLETED","FINISHED","FINAL","DONE"].includes(s)) return "completed";
  if (["IN PROGRESS","LIVE","ONGOING","IN-PROGRESS"].includes(s)) return "inprogress";
  if (s.includes("ERROR")) return "error"; // e.g. sheet's live-score formula returned "Error Reading API"
  return "notstarted";
}
function statusLabel(s){
  if (s === "completed") return "FULL TIME";
  if (s === "inprogress") return "LIVE";
  if (s === "error") return "SHEET SYNC ERROR";
  return "KICK OFF PENDING";
}
function competitionRank(sortedDescValues){
  // returns rank array (1-indexed, ties share rank, standard "1224" skip)
  const ranks = [];
  let lastVal = null, lastRank = 0;
  sortedDescValues.forEach((v, i) => {
    if (v !== lastVal){ lastRank = i + 1; lastVal = v; }
    ranks.push(lastRank);
  });
  return ranks;
}
function initials(name){
  return name.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

/* ============================================================
   PARSE CSV
   ============================================================ */
function parseSheet(rows){
  // rows: array of arrays (strings), as parsed by PapaParse
  const playerRows = [];
  for (let r = 2; r < rows.length; r++){
    const row = rows[r];
    if (!row || !row[0] || !row[0].trim()) break; // stop at first blank name row
    playerRows.push(row);
  }

  const statusRow = rows[STATUS_ROW_INDEX] || [];
  const poolRow = rows[POOL_ROW_INDEX] || [];

  const gwStatus = [];
  for (let gw = 1; gw <= TOTAL_GAMEWEEKS; gw++){
    const c = gwColStart(gw);
    gwStatus.push(normStatus(statusRow[c + 3]));
  }

  // latest gameweek that is completed or in progress (this is what drives chart/board data)
  let latestGw = 0;
  for (let gw = 1; gw <= TOTAL_GAMEWEEKS; gw++){
    if (gwStatus[gw-1] === "completed" || gwStatus[gw-1] === "inprogress") latestGw = gw;
  }

  // latest gameweek the sheet has *attempted* at all (completed, in progress, or erroring) —
  // lets us tell "season truly hasn't started" apart from "GW1 is stuck on a sheet error"
  let latestAttemptedGw = 0, latestAttemptedStatus = "notstarted";
  for (let gw = 1; gw <= TOTAL_GAMEWEEKS; gw++){
    if (gwStatus[gw-1] !== "notstarted"){ latestAttemptedGw = gw; latestAttemptedStatus = gwStatus[gw-1]; }
  }

  const players = playerRows.map((row, idx) => {
    const name = row[0].trim();
    const gwPoints = [], totalPoints = [], gwBalance = [], totalBalance = [];
    for (let gw = 1; gw <= TOTAL_GAMEWEEKS; gw++){
      const c = gwColStart(gw);
      const played = gwStatus[gw-1] === "completed" || gwStatus[gw-1] === "inprogress";
      gwPoints.push(played ? num(row[c]) : null);
      totalPoints.push(played ? num(row[c+1]) : null);
      gwBalance.push(played ? num(row[c+2]) : null);
      totalBalance.push(played ? num(row[c+3]) : null);
    }
    return {
      name,
      color: PLAYER_COLORS[idx % PLAYER_COLORS.length],
      avatar: PLAYER_AVATARS[idx % PLAYER_AVATARS.length],
      gwPoints, totalPoints, gwBalance, totalBalance
    };
  });

  let poolLatest = 0;
  if (latestGw > 0){
    const c = gwColStart(latestGw);
    poolLatest = num(poolRow[c + 3]);
  }

  // meta rules (no of players / per week / winner prizes / top scorer) - scan for label rows
  const meta = {};
  for (let r = 0; r < rows.length; r++){
    const row = rows[r];
    if (!row) continue;
    const label = (row[1] || "").trim().toLowerCase();
    const value = (row[0] || "").trim();
    if (!value) continue;
    if (label.includes("no of players")) meta.players = value;
    else if (label.includes("per week")) meta.perWeek = value;
    else if (label.includes("weekly winner")) meta.weeklyWinner = value;
    else if (label.includes("second winner")) meta.secondWinner = value;
    else if (label.includes("season top scorer")) meta.topScorer = value;
  }

  return { players, gwStatus, latestGw, latestAttemptedGw, latestAttemptedStatus, poolLatest, meta };
}

/* ============================================================
   RENDER: scoreboard header
   ============================================================ */
function renderHeader(data){
  const { latestGw, latestAttemptedGw, latestAttemptedStatus, gwStatus, poolLatest, meta } = data;
  const displayGw = latestGw > 0 ? latestGw : latestAttemptedGw;
  document.getElementById("gwNum").textContent = `${displayGw || 0}/${TOTAL_GAMEWEEKS}`;

  const st = latestGw > 0 ? gwStatus[latestGw-1] : (latestAttemptedGw > 0 ? latestAttemptedStatus : "notstarted");
  const pill = document.getElementById("statusPill");
  pill.className = "pill " + st;
  document.getElementById("statusText").textContent = displayGw > 0 ? statusLabel(st) : "SEASON NOT STARTED";

  const chips = [];
  if (st === "error"){
    chips.push(`<span class="chip-stat accent-danger">⚠️ GW${displayGw} scores unavailable — sheet's live data source is erroring, check back soon</span>`);
  }
  if (latestGw > 0) chips.push(`<span class="chip-stat accent-gold">💰 GW${latestGw} pool ${fmtBaht(poolLatest)}</span>`);
  if (meta.perWeek) chips.push(`<span class="chip-stat">🎫 Entry ฿${meta.perWeek}/wk</span>`);
  if (meta.weeklyWinner) chips.push(`<span class="chip-stat">🥇 Winner ฿${meta.weeklyWinner}</span>`);
  if (meta.secondWinner) chips.push(`<span class="chip-stat">🥈 Runner-up ฿${meta.secondWinner}</span>`);
  if (meta.topScorer) chips.push(`<span class="chip-stat">⭐ Top scorer ฿${meta.topScorer}</span>`);
  chips.push(`<span class="chip-stat accent-turf">🏁 ${TOTAL_GAMEWEEKS - latestGw} gameweeks to go</span>`);

  document.getElementById("tickerEl").innerHTML = chips.join("");

  document.getElementById("rulesRow").innerHTML = [
    meta.players ? `<span><b>${meta.players}</b> managers</span>` : "",
    meta.perWeek ? `<span><b>฿${meta.perWeek}</b>/week buy-in</span>` : "",
    meta.weeklyWinner ? `<span>🥇 <b>฿${meta.weeklyWinner}</b></span>` : "",
    meta.secondWinner ? `<span>🥈 <b>฿${meta.secondWinner}</b></span>` : "",
    meta.topScorer ? `<span>⭐ <b>฿${meta.topScorer}</b></span>` : "",
  ].filter(Boolean).join("");

  document.getElementById("lastUpdated").textContent = "Last synced " + new Date().toLocaleString([], {hour:'2-digit', minute:'2-digit', month:'short', day:'numeric'});
}

/* ============================================================
   CHART.JS: shared racetrack plugin (lane stripes + finish flag)
   ============================================================ */
const racetrackPlugin = {
  id: "racetrack",
  beforeDraw(chart){
    const { ctx, chartArea, scales } = chart;
    if (!chartArea) return;
    const { left, right, top, bottom } = chartArea;
    // alternating lane bands (horizontal, using y ticks)
    ctx.save();
    const yTicks = scales.y.ticks;
    for (let i = 0; i < yTicks.length - 1; i++){
      if (i % 2 !== 0) continue;
      const y0 = scales.y.getPixelForValue(yTicks[i].value);
      const y1 = scales.y.getPixelForValue(yTicks[i+1] ? yTicks[i+1].value : yTicks[i].value);
      ctx.fillStyle = "rgba(255,255,255,0.018)";
      ctx.fillRect(left, Math.min(y0,y1), right-left, Math.abs(y1-y0));
    }
    ctx.restore();
  },
  afterDraw(chart){
    const { ctx, chartArea, scales } = chart;
    if (!chartArea) return;
    const { top, bottom, right } = chartArea;
    const x = scales.x;
    const finishPx = x.getPixelForValue(x.max);
    // dashed finish line at GW38
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.22)";
    ctx.setLineDash([3,4]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(finishPx, top);
    ctx.lineTo(finishPx, bottom);
    ctx.stroke();
    ctx.setLineDash([]);
    // checkered flag marker
    const fx = Math.min(finishPx, right - 2);
    ctx.font = "13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🏁", fx, top - 4 < 10 ? top + 10 : top - 4);
    ctx.restore();
  }
};
if (window.Chart) Chart.register(racetrackPlugin);

function baseChartOptions(yLabel, latestGw, opts){
  opts = opts || {};
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    layout: { padding: { top: 16, right: 6, left: 2, bottom: 0 } },
    scales: {
      x: {
        type: "linear",
        min: 1, max: TOTAL_GAMEWEEKS,
        ticks: {
          stepSize: opts.xStep || 5,
          color: "#7fa08f",
          font: { size: 10, family: "IBM Plex Mono, monospace" },
          maxRotation: 0,
        },
        grid: { color: "rgba(255,255,255,0.05)", drawTicks:false },
        border: { color: "rgba(255,255,255,0.08)" },
        title: { display:false }
      },
      y: {
        grid: { color: "rgba(255,255,255,0.05)", drawTicks:false },
        border: { display:false },
        ticks: { color: "#7fa08f", font: { size: 10, family: "IBM Plex Mono, monospace" } },
        beginAtZero: opts.beginAtZero !== false
      }
    },
    plugins: {
      legend: { display:false },
      tooltip: {
        backgroundColor: "rgba(5,25,16,0.95)",
        borderColor: "rgba(255,255,255,0.12)",
        borderWidth: 1,
        titleFont: { family:"IBM Plex Mono, monospace", size:11, weight:"700" },
        bodyFont: { family:"IBM Plex Mono, monospace", size:11 },
        padding: 9,
        titleColor: "#ffc145",
        callbacks: {
          title: (items) => "GW " + items[0].parsed.x,
        }
      }
    },
    elements: {
      point: { radius: 0, hitRadius: 8, hoverRadius: 4 },
      line: { borderWidth: 2, tension: 0.28 }
    }
  };
}

function toXY(arr){
  const pts = [];
  for (let i = 0; i < arr.length; i++){
    if (arr[i] === null || arr[i] === undefined) continue;
    pts.push({ x: i+1, y: arr[i] });
  }
  return pts;
}

function endpointLabelsPlugin(getLabel){
  return {
    id: "endpointLabels",
    afterDatasetsDraw(chart){
      const { ctx } = chart;
      chart.data.datasets.forEach((ds, i) => {
        const meta = chart.getDatasetMeta(i);
        if (meta.hidden || !ds.data.length) return;
        const lastPoint = meta.data[meta.data.length - 1];
        if (!lastPoint) return;
        const info = getLabel(ds, i) || {};
        const px = lastPoint.x, py = lastPoint.y;
        // Ring size is about "what you tapped," not "who's winning": if a
        // player is pinned/hovered, only their marker gets big — otherwise
        // fall back to the rank leader. The small rank/crown badge below is
        // unaffected either way, so you can still see who's #1 at a glance.
        const hasSelection = !!chart.$selectedPlayer;
        const big = hasSelection ? (chart.$selectedPlayer === ds.label) : !!info.big;
        const haloR = big ? 12 : 8.5;
        const ringColor = ds.$identityColor || ((ds.$baseColor && ds.$baseColor.startsWith("#")) ? ds.$baseColor : "#ffffff");

        ctx.save();
        ctx.globalAlpha = ds.$faded ? 0.22 : 1;

        // dark halo behind the avatar for contrast against grid lines, ringed
        // in the player's own color so it still ties back to their line
        ctx.beginPath();
        ctx.arc(px, py, haloR, 0, Math.PI*2);
        ctx.fillStyle = "rgba(5,25,16,0.72)";
        ctx.fill();
        if (big){ ctx.shadowColor = ringColor; ctx.shadowBlur = 6; }
        ctx.lineWidth = big ? 2 : 1.3;
        ctx.strokeStyle = ringColor;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // the mascot itself
        ctx.font = `${big ? 17 : 12}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(ds.$avatar || "⚪", px, py + 1);

        if (info.badge){
          ctx.font = "700 9px IBM Plex Mono, monospace";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          const bx = px + haloR + 3, by = py - haloR - 1;
          const tw = ctx.measureText(info.badge).width;
          ctx.fillStyle = info.badgeBg || "rgba(0,0,0,0.6)";
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(bx-3, by-8, tw+6, 16, 8) : ctx.rect(bx-3, by-8, tw+6, 16);
          ctx.fill();
          ctx.fillStyle = info.badgeColor || "#1a1200";
          ctx.fillText(info.badge, bx, by);
        }
        ctx.restore();
      });
    }
  };
}

/* ============================================================
   RENDER: leaderboard rows
   ============================================================ */
function rowClass(rank){
  if (rank === 1) return "top1";
  if (rank === 2) return "top2";
  if (rank === 3) return "top3";
  return "";
}
function medalFor(rank){
  if (rank === 1) return "🥇";
  if (rank === 2) return "🥈";
  if (rank === 3) return "🥉";
  return rank;
}

function selectedMarkerPlugin(){
  return {
    id: "selectedMarker",
    afterDraw(chart){
      const gw = chart.$selectedGw, latest = chart.$latestGw;
      if (!gw || gw === latest) return; // only show when inspecting history, not on the live edge
      const { ctx, chartArea, scales } = chart;
      if (!chartArea) return;
      const x = scales.x.getPixelForValue(gw);
      ctx.save();
      ctx.strokeStyle = "rgba(255,193,69,0.6)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([2,2]);
      ctx.beginPath();
      ctx.moveTo(x, chartArea.top);
      ctx.lineTo(x, chartArea.bottom);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(x, chartArea.top + 4, 3.5, 0, Math.PI*2);
      ctx.fillStyle = "#ffc145";
      ctx.fill();
      ctx.restore();
    }
  };
}

function renderGwNote(elId, gw, latestGw, onJump){
  const el = document.getElementById(elId);
  if (!el) return;
  if (gw === latestGw){
    el.innerHTML = `<span class="hint">Tap the chart for a past gameweek, or a manager below to trace their line</span>`;
  } else {
    el.innerHTML = `<span class="tag">Showing GW ${gw}</span><span class="jump">↺ Jump to latest</span>`;
    const btn = el.querySelector(".jump");
    if (btn) btn.addEventListener("click", onJump);
  }
}

/* ============================================================
   HAPTICS
   Note: the Vibration API has no effect on iOS Safari — Apple doesn't
   expose the Taptic Engine to web content at all (even installed PWAs),
   so this is a no-op there. It does work on Android Chrome.
   ============================================================ */
function hapticTick(){
  try { if (navigator.vibrate) navigator.vibrate(8); } catch(e){}
}

// Fires a haptic tick each time the dragged/hovered gameweek index changes —
// call from a chart's onHover. getChart is a () => chartInstance getter
// (not the instance itself) since this option is set during Chart
// construction, before the outer `chartXInst = new Chart(...)` assignment
// has completed — capturing the instance directly would freeze on undefined.
function gwHoverHaptics(getChart, latestGw){
  return (evt) => {
    const chart = getChart();
    if (!chart || !evt || evt.x == null) return;
    if (chart.$scrubDirection === "vertical") return; // this touch is just scrolling the page, not scrubbing
    const xScale = chart.scales.x;
    let gw = Math.round(xScale.getValueForPixel(evt.x));
    gw = Math.max(1, Math.min(latestGw, gw));
    if (gw !== chart.$hapticGw){
      chart.$hapticGw = gw;
      hapticTick();
    }
  };
}

// Lets a touch gesture over the chart be EITHER a page scroll or a
// gameweek scrub, decided by its first few pixels of movement — instead of
// every touchmove being treated as chart interaction (which is what made a
// vertical swipe-to-scroll also drag the tooltip along for the ride).
//
//   - Mostly vertical  → treated as a normal page scroll. We don't touch it
//     at all, and we disable the tooltip for the rest of this gesture so it
//     doesn't hang around while you're just scrolling past the chart.
//   - Mostly horizontal → treated as a deliberate scrub. Page scroll is
//     blocked for this gesture, the tooltip tracks your finger live (via
//     Chart.js's own hover handling — untouched here), and whichever
//     gameweek it's showing when you lift your finger gets committed.
//   - No real movement (a clean tap) → commits immediately on release,
//     same as it always has.
function attachScrubInteraction(chart, latestGw, commit){
  const canvas = chart.canvas;
  const THRESHOLD = 6; // px of movement before we commit to a direction
  let startX = 0, startY = 0;

  function gwFromClientX(clientX){
    const rect = canvas.getBoundingClientRect();
    const xScale = chart.scales.x;
    let gw = Math.round(xScale.getValueForPixel(clientX - rect.left));
    return Math.max(1, Math.min(latestGw, gw));
  }

  canvas.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    chart.$scrubDirection = null;
    chart.$hapticGw = gwFromClientX(t.clientX); // ready even if this ends up a zero-movement tap
  }, { passive: true });

  canvas.addEventListener("touchmove", (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;

    if (chart.$scrubDirection == null){
      if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return; // too soon to tell
      chart.$scrubDirection = Math.abs(dx) > Math.abs(dy) ? "horizontal" : "vertical";
      if (chart.$scrubDirection === "vertical"){
        chart.options.plugins.tooltip.enabled = false;
        chart.update("none");
      }
    }

    if (chart.$scrubDirection === "horizontal"){
      e.preventDefault();
      chart.$hapticGw = gwFromClientX(t.clientX);
    }
    // vertical: leave it alone — native scroll handles it, nothing to draw
  }, { passive: false });

  canvas.addEventListener("touchend", (e) => {
    if (chart.$scrubDirection === "vertical"){
      chart.options.plugins.tooltip.enabled = true;
      chart.update("none");
    } else {
      // either a clean tap (direction never resolved) or a horizontal scrub
      // — both commit whichever gameweek was last tracked
      e.preventDefault(); // stop the browser's synthetic click from re-firing this
      commit(chart.$hapticGw);
    }
    chart.$scrubDirection = null;
  }, { passive: false });
}

/* ============================================================
   PLAYER HIGHLIGHTING (hover on desktop / tap on mobile)
   ============================================================ */
function fadeColor(color, alpha){
  // handles both "#rrggbb" and "rgba(r,g,b,a)"/"rgb(r,g,b)" base colors
  if (color.startsWith("#")){
    const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }
  const m = color.match(/rgba?\(([^)]+)\)/);
  if (m){
    const parts = m[1].split(",").map(s=>s.trim());
    return `rgba(${parts[0]},${parts[1]},${parts[2]},${alpha})`;
  }
  return color;
}

// Attaches pin/hover state to a chart. getArr(player) returns the per-gameweek
// array to show in the strip; formatChip(value) returns the HTML for one chip.
function setupPlayerHighlighting(chart, players, stripElId, boardElId, getArr, formatChip){
  chart.$selectedPlayer = null;

  function apply(name){
    chart.$selectedPlayer = name;
    chart.data.datasets.forEach(ds => {
      if (!name){
        ds.borderColor = ds.$baseColor;
        ds.borderWidth = ds.$baseWidth;
        ds.order = ds.$baseOrder;
        ds.$faded = false;
      } else if (ds.label === name){
        ds.borderColor = ds.$baseColor;
        ds.borderWidth = Math.max(ds.$baseWidth, 3.2);
        ds.order = 0;
        ds.$faded = false;
      } else {
        ds.borderColor = fadeColor(ds.$baseColor, 0.1);
        ds.borderWidth = 1;
        ds.order = 6;
        ds.$faded = true;
      }
    });
    chart.update("none");
    renderPlayerStrip(stripElId, name, players, getArr, formatChip, chart.$latestGw, () => apply(null));
    // keep the board's "active row" highlight in sync without a full re-render
    // (a full renderBoard() rebuild here would replace the row mid-interaction)
    const boardEl = document.getElementById(boardElId);
    if (boardEl){
      boardEl.querySelectorAll(".row").forEach(rowEl => {
        const nm = rowEl.querySelector(".nm");
        rowEl.classList.toggle("row-active", !!(nm && name && nm.textContent === name));
      });
    }
  }

  return {
    toggle(name){ apply(chart.$selectedPlayer === name ? null : name); },
    clearPinned(){ apply(null); },
    // re-runs the current selection (or "no selection") against whatever
    // $baseColor/$baseWidth/$baseOrder each dataset holds *right now* — call
    // this after updating those for a newly-inspected gameweek, so the
    // selection/fade state stays correct instead of visually reverting to
    // stale colors
    reapply(){ apply(chart.$selectedPlayer); },
    isSelected(name){ return chart.$selectedPlayer === name; }
  };
}

function renderPlayerStrip(elId, name, players, getArr, formatChip, latestGw, onClear){
  const el = document.getElementById(elId);
  if (!el) return;
  const player = name ? players.find(p => p.name === name) : null;
  if (!player || !latestGw){
    el.classList.remove("open");
    el.innerHTML = "";
    return;
  }
  const arr = getArr(player);
  let chips = "";
  for (let gw = 1; gw <= latestGw; gw++){
    const val = arr[gw-1];
    if (val === null || val === undefined) continue;
    chips += `<div class="chip"><span class="chip-gw">GW${gw}</span><span class="chip-val">${formatChip(val)}</span></div>`;
  }
  el.innerHTML = `<div class="strip-head">
      <span class="avatar-badge" style="--ring:${player.color}">${player.avatar}</span>
      <span class="strip-name">${player.name}</span>
      <span class="strip-hint">tap row again to clear</span>
      <button class="strip-clear" id="${elId}-clear">✕</button>
    </div>
    <div class="strip-scroll">${chips}</div>`;
  el.classList.add("open");
  const clearBtn = document.getElementById(elId+"-clear");
  if (clearBtn && onClear) clearBtn.addEventListener("click", onClear);
}

/* ============================================================
   BOARD DATA COMPUTATION (per-gameweek, so history clicks work)
   ============================================================ */
function computeGwPointsBoard(players, gw){
  const idx = gw - 1;
  const raw = players.map(p => ({ name:p.name, color:p.color, avatar:p.avatar, gwPts:p.gwPoints[idx], gwBal:p.gwBalance[idx] }));
  const balSorted = [...raw].sort((a,b) => b.gwBal - a.gwBal);
  const ranks = competitionRank(balSorted.map(x => x.gwBal));
  const rankMap = {};
  balSorted.forEach((x,i) => { rankMap[x.name] = ranks[i]; });
  // display order: sorted by GW points (per spec), rank badge stays balance-based
  const sorted = [...raw].sort((a,b) => b.gwPts - a.gwPts);
  return sorted.map(x => ({
    rank: rankMap[x.name], name:x.name, color:x.color, avatar:x.avatar,
    val:x.gwBal, valFmt:(x.gwBal>0?"+":"")+fmtBaht(x.gwBal),
    sub:x.gwPts+"pt", positive:x.gwBal>0
  }));
}
function computeTotalPointsBoard(players, gw){
  const idx = gw - 1;
  const list = players.map(p => ({ name:p.name, color:p.color, avatar:p.avatar, total:p.totalPoints[idx] }))
    .sort((a,b) => b.total - a.total);
  return list.map((x,i) => ({ rank:i+1, name:x.name, color:x.color, avatar:x.avatar, val:x.total, valFmt:x.total+" pt", sub:"", positive:null }));
}
function computeBalanceBoard(players, gw){
  const idx = gw - 1;
  const list = players.map(p => ({ name:p.name, color:p.color, avatar:p.avatar, bal:p.totalBalance[idx] }))
    .sort((a,b) => b.bal - a.bal);
  return list.map((x,i) => ({ rank:i+1, name:x.name, color:x.color, avatar:x.avatar, val:x.bal, valFmt:fmtBaht(x.bal), sub:"", positive:x.bal>=0 }));
}
function leaderOf(players, key, idx){
  return [...players].sort((a,b) => b[key][idx] - a[key][idx])[0];
}

function emptyBoardMsg(data){
  if (data.latestAttemptedGw > 0 && data.latestAttemptedStatus === "error"){
    return `GW${data.latestAttemptedGw} scores unavailable — the sheet's data source is erroring.`;
  }
  return "Season hasn't kicked off yet.";
}

function computeGwRankMap(players, gw){
  const idx = gw - 1;
  const rankMap = {};
  const balSorted = [...players].map(p=>({name:p.name,gwBal:p.gwBalance[idx]})).sort((a,b)=>b.gwBal-a.gwBal);
  const ranks = competitionRank(balSorted.map(x=>x.gwBal));
  balSorted.forEach((x,i)=>{ rankMap[x.name] = { rank: ranks[i], bal: x.gwBal }; });
  return rankMap;
}

function renderGwPointsSection(data){
  const { players, latestGw } = data;
  if (latestGw === 0){
    document.getElementById("boardGwPoints").innerHTML = `<div class="row"><span class="nm">${emptyBoardMsg(data)}</span></div>`;
    return;
  }
  const idx = latestGw - 1;
  let rankMap = computeGwRankMap(players, latestGw); // reassigned on every refresh() so the endpoint badge always matches the gameweek being inspected, not just the latest one

  const ctx = document.getElementById("chartGwPoints").getContext("2d");
  if (chartGwPointsInst) chartGwPointsInst.destroy();

  const datasets = players.map(p => {
    // always the player's own color, uniform width — matches how the other
    // two charts work. "Positive balance this week" is conveyed only by the
    // endpoint ring/rank badge (still dynamic per inspected gw below), not
    // by changing the line itself.
    const baseColor = p.color;
    const baseWidth = 1.6;
    const baseOrder = 2;
    return {
      label: p.name,
      data: toXY(p.gwPoints),
      borderColor: baseColor,
      backgroundColor: "transparent",
      borderWidth: baseWidth,
      order: baseOrder,
      $baseColor: baseColor, $baseWidth: baseWidth, $baseOrder: baseOrder, $avatar: p.avatar,
      $identityColor: p.color,
    };
  });

  let highlightApi;
  const refresh = (gw) => {
    rankMap = computeGwRankMap(players, gw);
    renderBoard("boardGwPoints", computeGwPointsBoard(players, gw), true, highlightApi);
    renderGwNote("noteGwPoints", gw, latestGw, () => {
      chartGwPointsInst.$selectedGw = latestGw;
      chartGwPointsInst.update("none");
      refresh(latestGw);
    });
    chartGwPointsInst.update("none");
  };
  const commitGwPoints = (gw) => {
    gw = Math.max(1, Math.min(latestGw, gw));
    if (gw === chartGwPointsInst.$selectedGw) return;
    chartGwPointsInst.$selectedGw = gw;
    chartGwPointsInst.update("none");
    refresh(gw);
  };

  chartGwPointsInst = new Chart(ctx, {
    type: "line",
    data: { datasets },
    options: Object.assign(baseChartOptions("pts", latestGw), {
      onClick: (evt) => {
        const xScale = chartGwPointsInst.scales.x;
        commitGwPoints(Math.round(xScale.getValueForPixel(evt.x)));
      },
      onHover: gwHoverHaptics(() => chartGwPointsInst, latestGw),
      plugins: {
        legend: { display:false },
        tooltip: {
          backgroundColor: "rgba(5,25,16,0.95)", borderColor:"rgba(255,255,255,0.12)", borderWidth:1,
          titleColor:"#ffc145", padding:9,
          titleFont:{family:"IBM Plex Mono, monospace", size:11, weight:"700"},
          bodyFont:{family:"IBM Plex Mono, monospace", size:11},
          itemSort: (a,b) => b.parsed.y - a.parsed.y,
          callbacks: {
            title:(items)=>"GW "+items[0].parsed.x,
            label:(item)=> `${item.dataset.label}: ${item.parsed.y} pts`
          }
        }
      }
    }),
    plugins: [
      endpointLabelsPlugin((ds) => {
        const info = rankMap[ds.label];
        if (!info || info.bal <= 0) return { big:false };
        return {
          big:true,
          badge: `#${info.rank}`,
          badgeBg: info.rank===1?"#ffc145":info.rank===2?"#c9d2da":info.rank===3?"#d98c4a":"rgba(0,0,0,.6)",
          badgeColor: info.rank<=3? "#1a1200":"#fff"
        };
      }),
      selectedMarkerPlugin()
    ]
  });
  chartGwPointsInst.$latestGw = latestGw;
  chartGwPointsInst.$selectedGw = latestGw;
  highlightApi = setupPlayerHighlighting(chartGwPointsInst, players, "stripGwPoints", "boardGwPoints", (p) => p.gwPoints, (v) => `${v}pt`);
  attachScrubInteraction(chartGwPointsInst, latestGw, commitGwPoints);

  refresh(latestGw);
}

function renderBoard(elId, items, rankOnlyPositive, highlightApi){
  const el = document.getElementById(elId);
  const showCount = 5;
  function line(x){
    const rankDisplay = rankOnlyPositive ? (x.positive ? medalFor(x.rank) : "–") : medalFor(x.rank);
    const activeCls = (highlightApi && highlightApi.isSelected(x.name)) ? "row-active" : "";
    const cls = [(rankOnlyPositive ? x.positive : true) ? rowClass(x.rank) : "", activeCls].filter(Boolean).join(" ");
    const valClass = x.positive === null ? "" : (x.positive ? "pos" : "neg");
    return `<div class="row ${cls}">
      <span class="rank">${rankDisplay}</span>
      <span class="avatar-badge" style="--ring:${x.color}">${x.avatar}</span>
      <span class="nm">${x.name}</span>
      ${x.sub ? `<span class="sub">${x.sub}</span>` : ""}
      <span class="val ${valClass}">${x.valFmt}</span>
    </div>`;
  }
  const top = items.slice(0, showCount).map(line).join("");
  const rest = items.slice(showCount).map(line).join("");
  el.innerHTML = top + (rest ? `<div id="${elId}-rest" style="display:none">${rest}</div>
    <div class="board-more" id="${elId}-more">Show all ${items.length} managers ▾</div>` : "");
  const moreBtn = document.getElementById(elId+"-more");
  if (moreBtn){
    moreBtn.addEventListener("click", () => {
      const restEl = document.getElementById(elId+"-rest");
      const expanded = restEl.style.display !== "none";
      restEl.style.display = expanded ? "none" : "block";
      moreBtn.textContent = expanded ? `Show all ${items.length} managers ▾` : "Show less ▴";
    });
  }
  if (highlightApi){
    const rowEls = el.querySelectorAll(".row");
    items.forEach((x, i) => {
      const rowEl = rowEls[i];
      if (!rowEl) return;
      rowEl.addEventListener("click", () => highlightApi.toggle(x.name));
    });
  }
}

/* ============================================================
   LOAD + BOOT
   ============================================================ */
async function loadData(){
  const res = await fetch(CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "_ts=" + Date.now());
  if (!res.ok) throw new Error("Network response was not ok (" + res.status + ")");
  const text = await res.text();
  const parsed = Papa.parse(text, { skipEmptyLines: false });
  return parseSheet(parsed.data);
}

// Canvas text doesn't wait for @font-face to finish loading — if a chart
// draws before IBM Plex Mono has arrived, that draw call silently falls back
// to the system font and (unlike normal DOM text) never gets redrawn once
// the real font shows up. Force both weights we use in canvas to load first.
async function ensureFontsReady(){
  try {
    await Promise.all([
      document.fonts.load('400 12px "IBM Plex Mono"'),
      document.fonts.load('700 12px "IBM Plex Mono"'),
    ]);
    await document.fonts.ready;
  } catch(e){ /* Font Loading API unsupported — proceed with whatever's available */ }
}

async function boot(isRefresh){
  const loadingScreen = document.getElementById("loadingScreen");
  const refreshBtn = document.getElementById("refreshBtn");
  const errBox = document.getElementById("errBox");
  const versionTag = document.getElementById("versionTag");
  if (versionTag) versionTag.textContent = "v" + APP_VERSION;
  errBox.innerHTML = "";
  if (isRefresh) refreshBtn.classList.add("spinning");
  try {
    const [data] = await Promise.all([loadData(), ensureFontsReady()]);
    renderHeader(data);
    renderGwPointsSection(data);
    renderTotalPointsSection(data);
    renderBalanceSection(data);
    document.getElementById("mainContent").style.display = "block";
    loadingScreen.classList.add("hide");
  } catch (e){
    console.error(e);
    errBox.innerHTML = `<div class="err-box">⚠️ Couldn't load the latest scores. Check your connection and tap refresh.<br><span style="opacity:.7;font-size:11px">${(e && e.message) || ""}</span></div>`;
    loadingScreen.classList.add("hide");
    document.getElementById("mainContent").style.display = "block";
  } finally {
    if (isRefresh) setTimeout(()=>refreshBtn.classList.remove("spinning"), 400);
  }
}

document.getElementById("refreshBtn").addEventListener("click", () => boot(true));
boot(false);

/* ============================================================
   Service worker — kept registered only so any phone that already
   installed the old caching version gets the cleanup (kill-switch)
   worker delivered and removes its stale cache. See sw.js.
   ============================================================ */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
