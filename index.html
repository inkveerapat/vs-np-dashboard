<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS NP Dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d0d0d'/><polyline points='3,24 9,18 14,20 20,10 27,8' fill='none' stroke='%23c8f542' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/><circle cx='27' cy='8' r='2' fill='%23c8f542'/></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VS NP">
<meta name="theme-color" content="#0d0d0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d; --surface: #161616; --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
    --text: #f0efe8; --text2: #888780; --text3: #555450;
    --accent: #c8f542; --green: #5ce0a8; --red: #f06b6b; --amber: #f0b429;
    --font-sans: 'DM Sans', sans-serif; --font-mono: 'DM Mono', monospace;
    --radius: 8px; --radius-lg: 12px;
  }
  html, body { height: 100%; overflow-x: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

  /* GATE */
  #gate { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  .gate-box { width: 320px; display: flex; flex-direction: column; gap: 20px; }
  .gate-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; }
  .gate-title { font-size: 22px; font-weight: 500; color: var(--text); line-height: 1.2; }
  .gate-version { font-family: var(--font-mono); font-size: 10px; color: var(--text3); margin-top: 6px; letter-spacing: .06em; }
  .gate-input-wrap { position: relative; }
  .gate-input { width: 100%; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px 44px 12px 16px; color: var(--text); font-family: var(--font-mono); font-size: 14px; outline: none; transition: border-color .2s; }
  .gate-input:focus { border-color: var(--accent); }
  .gate-input::placeholder { color: var(--text3); }
  .gate-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text3); font-size: 15px; line-height: 1; padding: 0; }
  .gate-btn { background: var(--accent); color: #0d0d0d; border: none; border-radius: var(--radius); padding: 12px 20px; font-family: var(--font-sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; width: 100%; }
  .gate-btn:hover { opacity: .88; }
  .gate-error { font-size: 12px; color: var(--red); font-family: var(--font-mono); display: none; }
  .gate-error.show { display: block; }

  /* APP */
  #app { display: none; min-height: 100vh; }
  #app.visible { display: block; }
  .topbar { border-bottom: 1px solid var(--border); padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; background: rgba(13,13,13,0.95); backdrop-filter: blur(8px); gap: 8px; }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 1; overflow: hidden; }
  .topbar-name { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--text2); white-space: nowrap; }
  .topbar-sep { color: var(--text3); flex-shrink: 0; }
  .topbar-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .last-updated { font-family: var(--font-mono); font-size: 11px; color: var(--text3); white-space: nowrap; }
  .version-badge { font-family: var(--font-mono); font-size: 10px; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; letter-spacing: .04em; white-space: nowrap; }
  .refresh-btn { background: none; border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text2); font-size: 12px; padding: 5px 10px; cursor: pointer; font-family: var(--font-sans); transition: all .15s; white-space: nowrap; }
  .refresh-btn:hover { color: var(--text); background: var(--surface); }
  .refresh-btn .refresh-label { display: inline; }
  .logout-btn { background: none; border: none; color: var(--text3); font-size: 12px; cursor: pointer; font-family: var(--font-mono); letter-spacing: .04em; padding: 0; transition: color .15s; white-space: nowrap; }
  .logout-btn:hover { color: var(--text2); }
  .main { max-width: 1100px; margin: 0 auto; padding: 36px 32px 64px; width: 100%; }
  .page-header { margin-bottom: 40px; }
  .page-title { font-size: 28px; font-weight: 300; letter-spacing: -.02em; }
  .page-title strong { font-weight: 500; }
  .page-subtitle { font-size: 13px; color: var(--text3); margin-top: 4px; font-family: var(--font-mono); }
  .tabs { display: flex; gap: 4px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
  .tab { font-size: 13px; font-weight: 400; padding: 8px 18px 10px; background: none; border: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; font-family: var(--font-sans); }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

  /* METRIC CARDS */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; }
  .metric-label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); font-family: var(--font-mono); margin-bottom: 6px; }
  .metric-val { font-size: 22px; font-weight: 500; color: var(--text); letter-spacing: -.02em; font-family: var(--font-mono); }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: var(--font-mono); }
  .metric-sub.pos { color: var(--green); }
  .metric-sub.neg { color: var(--red); }

  /* GOAL SECTION */
  .goal-section { margin-bottom: 36px; }
  .goal-section-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 14px; }
  .goal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .goal-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; }
  .goal-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .goal-card-title { font-size: 12px; font-weight: 500; color: var(--text); }
  .goal-card-icon { font-size: 16px; opacity: .6; }
  .goal-card-current { font-family: var(--font-mono); font-size: 18px; font-weight: 500; color: var(--text); margin-bottom: 12px; }
  .goal-bars { display: flex; flex-direction: column; gap: 10px; }
  .goal-bar-row { display: flex; flex-direction: column; gap: 4px; }
  .goal-bar-meta { display: flex; justify-content: space-between; align-items: center; }
  .goal-bar-label { font-family: var(--font-mono); font-size: 10px; color: var(--text3); letter-spacing: .04em; }
  .goal-bar-pct { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
  .goal-bar-track { height: 5px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .goal-bar-fill { height: 100%; border-radius: 99px; transition: width .6s cubic-bezier(.4,0,.2,1); }
  .goal-bar-target { font-family: var(--font-mono); font-size: 10px; color: var(--text3); text-align: right; margin-top: 1px; }
  .goal-card-mom { font-family: var(--font-mono); font-size: 11px; display: block; margin-bottom: 8px; margin-top: -6px; }
  .hh-contrib-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .hh-contrib { display: inline-flex; align-items: center; gap: 5px; }
  .hh-contrib-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .hh-contrib-name { font-family: var(--font-mono); font-size: 10px; color: var(--text3); }
  .hh-contrib-val { font-family: var(--font-mono); font-size: 11px; color: var(--text2); }
  .hh-contrib-pct { font-family: var(--font-mono); font-size: 10px; color: var(--text3); }
  .hh-contrib-divider { color: var(--text3); font-size: 11px; }
  .goal-card-mom.pos { color: var(--green); }
  .goal-card-mom.neg { color: var(--red); }
  .goal-card-mom.flat { color: var(--text3); }
  .goal-card--condo { }
  .condo-detail-row { display: flex; gap: 8px; margin-top: 4px; }
  .condo-detail-item { flex: 1; background: var(--surface2); border-radius: var(--radius); padding: 8px 10px; min-width: 0; }
  .condo-detail-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); display: block; margin-bottom: 3px; }
  .condo-detail-val { font-family: var(--font-mono); font-size: 11px; color: var(--text2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .condo-detail-val.pos { color: var(--green); }
  .condo-detail-val.neg { color: var(--red); }
  .goal-bar-mom { font-family: var(--font-mono); font-size: 10px; }
  .goal-bar-mom.pos { color: var(--green); }
  .goal-bar-mom.neg { color: var(--red); }
  .goal-bar-mom.flat { color: var(--text3); }

  /* LINE CHART */
  .chart-wrap { position: relative; width: 100%; height: clamp(240px, 38vh, 420px); }
  .chart-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--text3); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 18px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); cursor: pointer; padding: 3px 0; transition: color .15s; user-select: none; }
  .legend-item:hover { color: var(--text2); }
  .legend-item.hidden { opacity: .3; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .chart-crosshair { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.12); pointer-events: none; display: none; transform: translateX(-50%); }
  .chart-tooltip { position: absolute; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 12px 16px; font-size: 12px; pointer-events: none; z-index: 20; min-width: 200px; display: none; }
  .tt-month { font-family: var(--font-mono); font-size: 11px; color: var(--text3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; }
  .tt-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 2px 0; color: var(--text2); }
  .tt-row-label { display: flex; align-items: center; gap: 6px; }
  .tt-dot { width: 6px; height: 6px; border-radius: 1px; flex-shrink: 0; }
  .tt-val { font-family: var(--font-mono); color: var(--text); }
  .tt-total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; font-weight: 500; color: var(--text); }

  /* DONUT SECTION */
  .donut-section { margin-top: 48px; }
  .donut-section-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .donut-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .donut-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 20px 18px; }
  .donut-card-title { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 16px; }
  .donut-card-body { display: flex; align-items: center; gap: 18px; }
  .donut-canvas-wrap { position: relative; flex-shrink: 0; width: 100px; height: 100px; }
  .donut-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    max-width: 56px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-align: center; gap: 0;
    overflow: visible;
  }
  .donut-center-total { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.2; white-space: nowrap; }
  .donut-center-label { font-family: var(--font-mono); font-size: 8px; color: var(--text3); margin-top: 1px; line-height: 1.3; white-space: nowrap; display: flex; flex-direction: column; align-items: center; }
  .donut-center-hover-pct { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.2; display: none; }
  .donut-center-hover-val { font-family: var(--font-mono); font-size: 9px; color: var(--text3); margin-top: 2px; word-break: break-all; display: none; }
  .donut-center-hover-name { font-family: var(--font-mono); font-size: 8px; color: var(--text3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; display: none; }
  .donut-leg { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .donut-leg-item { display: flex; flex-direction: column; font-size: 11px; color: var(--text3); cursor: default; transition: color .15s; border-radius: 4px; padding: 2px 2px; margin: 0 -2px; min-width: 0; }
  .donut-leg-item:hover { color: var(--text2); background: rgba(255,255,255,0.04); }
  .donut-leg-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .donut-leg-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
  .donut-leg-pct { font-family: var(--font-mono); font-size: 10px; flex-shrink: 0; min-width: 32px; text-align: right; }
  .donut-leg-main { display: flex; align-items: center; gap: 5px; width: 100%; min-width: 0; }
  .donut-leg-sub { display: flex; justify-content: space-between; align-items: center; padding-left: 12px; margin-top: 1px; min-width: 0; gap: 4px; }
  .donut-leg-mv { font-family: var(--font-mono); font-size: 9px; color: var(--text2); white-space: nowrap; }
  .donut-leg-upl { font-family: var(--font-mono); font-size: 9px; white-space: nowrap; text-align: right; }
  .donut-leg-upl-val { font-size: 8px; opacity: .75; }
  .donut-empty { font-family: var(--font-mono); font-size: 11px; color: var(--text3); text-align: center; padding: 32px 0; }

  /* STATUS */
  .status-bar { margin-top: 32px; padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text3); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .status-dot.loading { background: var(--amber); animation: pulse 1s infinite; }
  .status-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
  .error-box { background: rgba(240,107,107,0.06); border: 1px solid rgba(240,107,107,0.2); border-radius: var(--radius); padding: 16px; font-family: var(--font-mono); font-size: 12px; color: var(--red); display: none; margin-bottom: 20px; }
  .error-box.show { display: block; }

  /* PRIVACY TOGGLE */
  .privacy-btn { background: none; border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text2); font-size: 12px; padding: 5px 12px; cursor: pointer; font-family: var(--font-sans); transition: all .15s; white-space: nowrap; }
  .privacy-btn:hover { color: var(--text); background: var(--surface); }
  .privacy-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(200,245,66,0.06); }

  .num-mask { display: inline-block; background: var(--surface2); color: transparent; border-radius: 4px; user-select: none; min-width: 4em; height: 1em; vertical-align: middle; filter: blur(0); position: relative; }
  .num-mask::after { content: '••••••'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: .75em; letter-spacing: .1em; filter: blur(0); }

  body.privacy .y-axis-blur { filter: blur(6px); pointer-events: none; }

  @media (max-width: 480px) {
    .topbar { padding: 0 14px; height: auto; min-height: 52px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; gap: 6px; }
    .topbar-left { flex: 1 1 100%; justify-content: flex-start; }
    .topbar-right { flex: 1 1 100%; justify-content: flex-end; gap: 6px; }
    .topbar-sep { display: none; }
    .topbar-title { display: none; }
    .last-updated { display: none; }
    .refresh-btn .refresh-label { display: none; }

    .main { padding: 20px 14px 48px; }
    .page-title { font-size: 20px; }
    .page-subtitle { font-size: 11px; }

    .tabs { gap: 0; }
    .tab { flex: 1; text-align: center; padding: 8px 6px 10px; font-size: 12px; }

    .metric-grid { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .metric-card { padding: 12px 12px; }
    .metric-val { font-size: 16px; }
    .metric-label { font-size: 9px; }
    .metric-sub { font-size: 10px; }

    .goal-grid { grid-template-columns: 1fr; gap: 10px; }
    .goal-card { padding: 14px 14px; }
    .goal-card-current { font-size: 15px; }

    .chart-wrap { height: clamp(180px, 32vh, 260px); }
    .legend { gap: 6px 12px; margin-top: 12px; }
    .legend-item { font-size: 10px; }

    .donut-grid { grid-template-columns: 1fr; gap: 12px; }
    .donut-card { padding: 14px; }
    .donut-canvas-wrap { width: 90px !important; height: 90px !important; }
    .donut-center { max-width: 50px; }
    .donut-card-body { gap: 10px; }
    .donut-leg-name { font-size: 9px; }
    .donut-leg-pct { font-size: 9px; min-width: 28px; }

    .chart-tooltip { min-width: 160px; font-size: 11px; padding: 10px 12px; max-width: calc(100vw - 28px); }
    .privacy-btn { font-size: 11px; padding: 4px 8px; }
  }

  @media (min-width: 481px) and (max-width: 768px) {
    .topbar { padding: 0 16px; }
    .last-updated { display: none; }
    .main { padding: 28px 20px 56px; }
    .metric-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .goal-grid { grid-template-columns: 1fr 1fr; }
    .chart-wrap { height: clamp(220px, 35vh, 320px); }
    .donut-grid { grid-template-columns: 1fr; }
    .privacy-btn { font-size: 11px; padding: 5px 8px; }
  }

  /* TIME FILTER */
  .filter-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; color: var(--text3); text-transform: uppercase; white-space: nowrap; }
  .filter-scroll { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-pill {
    font-family: var(--font-mono); font-size: 11px; white-space: nowrap;
    padding: 4px 12px; border-radius: 99px; cursor: pointer; flex-shrink: 0;
    border: 1px solid var(--border2); background: transparent; color: var(--text3);
    transition: all .15s;
  }
  .filter-pill:hover { color: var(--text2); border-color: rgba(255,255,255,0.25); }
  .filter-pill.active { background: var(--accent); color: #0d0d0d; border-color: var(--accent); font-weight: 500; }
  @media (max-width: 480px) {
    .filter-bar { gap: 6px; margin-bottom: 16px; }
    .filter-pill { font-size: 10px; padding: 3px 10px; }
  }

  /* PWA STANDALONE */
  @media (display-mode: standalone) {
    .topbar { padding-top: max(env(safe-area-inset-top), 12px); }
    body { padding-bottom: env(safe-area-inset-bottom); }
  }

  /* RANGE BUTTONS */
  .range-bar { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
  .range-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text3); font-family: var(--font-mono); font-size: 10px; padding: 3px 9px; cursor: pointer; transition: all .15s; letter-spacing: .04em; }
  .range-btn:hover { color: var(--text2); border-color: var(--border2); }
  .range-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(200,245,66,0.06); }
  .install-btn { background: none; border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text2); font-size: 12px; padding: 5px 10px; cursor: pointer; font-family: var(--font-sans); transition: all .15s; white-space: nowrap; display: none; }

<script>
// CONFIG
const VERSION  = 'v5.4';

let privacyMode = false;

const EYE_OPEN   = `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-1px;margin-right:4px;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_CLOSED = `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-1px;margin-right:4px;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

  if (inkData && fangData) renderAll(currentTab);
}

const BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSU57IeIZ_tnLFAgZNYUf9dThcFaEm8suslumtMaOVdUPAksG1XicXIFcmVDHWqdPDt9PKP-TgY8-Is/pub?gid=';

const INK_CSV_URL   = csv(0);

const INK_CONFIG = {

};

// Goals (all in THB)

  fang:      { cash: { st: 500000,    lt: 8000000  }, invest: { st: 15000000, lt: 40000000 } },

const INK_DONUTS = [

  { title:'Mutual fund',          url:csv(1253576610), assetRowStart:3,  assetRowEnd:33, currencyRow:35 },
  { title:'Thai stock portfolio', url:csv(748123998),  assetRowStart:3,  assetRowEnd:21, currencyRow:23 },
  { title:'US stock portfolio',   url:csv(672939154),  assetRowStart:3,  assetRowEnd:21, currencyRow:23 },
  { title:'Provident fund',       url:csv(753946380),  assetRowStart:3,  assetRowEnd:9,  currencyRow:11  },
];

  '#4da8f5','#5ce0a8','#a78bfa','#f0b429','#f472b6','#fb923c',
  '#34d399','#60a5fa','#f87171','#fbbf24','#c084fc','#38bdf8',
  '#a3e635','#e879f9','#4ade80','#fb7185','#818cf8','#facc15',

];

// AUTH
const SK = 'vsnp_auth';
function checkAuth() { return sessionStorage.getItem(SK) === 'true'; }
function unlock() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  sessionStorage.setItem(SK, 'true');
  init();
}
document.getElementById('gate-submit').addEventListener('click', () => {
  if (document.getElementById('pwd-input').value === PASSWORD) { unlock(); }
  else {
    const e = document.getElementById('gate-error');
    e.classList.add('show');

    setTimeout(() => e.classList.remove('show'), 2500);

});
document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('gate-submit').click(); });
let pwdVis = false;
document.getElementById('pwd-toggle').addEventListener('click', () => {
  pwdVis = !pwdVis;
  document.getElementById('pwd-input').type = pwdVis ? 'text' : 'password';
});

  privacyMode = !privacyMode;
  applyPrivacyMode();
});
if (checkAuth()) unlock();

// CSV PARSING
function parseCSV(text) {
  return text.split('\n').map(line => {
    const cols=[]; let cur='', inQ=false;
    for (let i=0;i<line.length;i++) {
      const c=line[i];
      if (c==='"') { inQ=!inQ; }
      else if (c===',' && !inQ) { cols.push(cur.trim()); cur=''; }
      else cur+=c;
    }
    cols.push(cur.trim());
    return cols;
  });
}
function numVal(s) {
  if (!s) return 0;
  const n = parseFloat(String(s).replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? 0 : n;
}
async function fetchCSV(url) {
  const res = await fetch(url + '&_=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return parseCSV(await res.text());
}
function detectCurrency(raw) {
  const s = String(raw||'');
  if (s.includes('$')) return 'USD';
  return 'THB';
}
function fmtCurrency(val, currency) {
  if (currency === 'USD') return '$' + val.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return '\u0e3f' + Math.round(val).toLocaleString('th-TH');
}

// MASTER TRACKER EXTRACT
// Retain the standard reference structure from design specifications.
function extractData(rows, config) {
  const labelRow = rows[config.monthLabelRow] || [];
  const months = [];
  let emptyStreak = 0;
  for (let c=config.dataStartCol; c<500; c++) {
    const lbl = (labelRow[c]||'').trim();
    if (!lbl) { emptyStreak++; if (emptyStreak>10) break; continue; }
    emptyStreak = 0;
    const ll = lbl.toLowerCase();
    if (/^\d{4}/.test(lbl)||ll.includes('market value')||ll.includes('actual')||
        ll.includes('budget')||ll.includes('target')||ll.includes('projected')||
        ll.includes('goal')||ll.includes('percentage')) continue;
    if (!config.componentRows.some(ri => numVal((rows[ri]||[])[c]) > 0)) continue;
    months.push({ col:c, label:lbl });
  }
  if (!months.length) return { months:[], components:[], totals:[], firstLabel:'', lastLabel:'' };
  const components = config.componentRows.map((ri,idx) => ({
    name:  config.componentNames[idx],
    color: config.colors[idx],
    values: months.map(m => numVal((rows[ri]||[])[m.col]))
  }));
  const totals = months.map(m => config.componentRows.reduce((s,ri) => s + numVal((rows[ri]||[])[m.col]), 0));
  const labels = months.map(m => m.label);
  return { months:labels, components, totals, firstLabel:labels[0], lastLabel:labels[labels.length-1] };
}

// DONUT EXTRACT
function detectPortfolioCurrency(rows, config) {
  const cell = ((rows[config.currencyRow] || [])[0] || '').toLowerCase();
  return cell.includes('usd') ? 'USD' : 'THB';
}

function findMarketValueCols(rows, yearRowIdx, monthRowIdx, mvHeaderRowIdx) {
  const headerRow = rows[mvHeaderRowIdx] || [];
  const monthRow  = rows[monthRowIdx]    || [];
  const yearRow   = yearRowIdx !== null ? (rows[yearRowIdx] || []) : [];
  const result = [];
  for (let c = 1; c < headerRow.length; c++) {
    const hdr = (headerRow[c] || '').trim().toLowerCase();
    if (hdr === 'market value') {
      const month = (monthRow[c] || '').trim();
      if (!month) continue;
      let year = yearRowIdx !== null ? (yearRow[c] || '').trim() : '';
      if (!year && yearRowIdx !== null) {
        for (let lc = c - 1; lc >= 1; lc--) {
          const y = (yearRow[lc] || '').trim();
          if (y && /\d{4}/.test(y)) { year = y; break; }
        }
      }
      const label = year ? `${month} ${year}` : month;
      // Find Unrealised P/L (absolute) column — scan nearby columns in the header row.
      // Skip "Unrealised PL%" column (contains '%') and pick the absolute value column.
      let uplCol = null;
      for (let sc = c + 1; sc <= Math.min(c + 6, headerRow.length - 1); sc++) {
        const sh = (headerRow[sc] || '').trim().toLowerCase();
        if (sh.includes('unreali') && sh.includes('p') && !sh.includes('%')) { uplCol = sc; break; }
      }
      result.push({ col: c, monthLabel: label, uplCol });
    }
  }
  return result;
}

function extractAssetsForCol(rows, config, col, currency, uplCol) {
  const assets = [];
  for (let r = config.assetRowStart; r <= Math.min(config.assetRowEnd, rows.length-1); r++) {
    const row  = rows[r] || [];
    const name = (row[0] || '').trim();
    const raw  = (row[col] || '').trim();
    if (!name || !raw) continue;
    const val  = numVal(raw);
    if (val <= 0) continue;
    const upl  = (uplCol !== null && uplCol !== undefined) ? numVal((row[uplCol] || '').trim()) : null;
    assets.push({ name, value: val, currency, upl });
  }
  const total = assets.reduce((s,a) => s+a.value, 0);
  return assets.map(a => ({ ...a, pct: total>0 ? a.value/total*100 : 0 }));
}

function extractDonutAllMonths(rows, config) {
  const currency    = detectPortfolioCurrency(rows, config);
  const yearRowIdx  = config.yearRowIdx  !== undefined ? config.yearRowIdx  : 0;
  const monthRowIdx = config.monthRowIdx !== undefined ? config.monthRowIdx : 1;
  const mvHdrIdx    = config.mvHeaderRowIdx !== undefined ? config.mvHeaderRowIdx : 2;
  const mvCols      = findMarketValueCols(rows, yearRowIdx, monthRowIdx, mvHdrIdx);
  const byMonth  = {};
  const months   = [];
  for (const { col, monthLabel, uplCol } of mvCols) {
    const assets = extractAssetsForCol(rows, config, col, currency, uplCol);
    if (assets.length === 0) continue;
    byMonth[monthLabel] = assets;
    if (!months.includes(monthLabel)) months.push(monthLabel);
  }
  return { months, byMonth, currency };
}

// STATE
let inkData=null, fangData=null, condoData=null;
let inkDonutData=[], fangDonutData=[];
let donutInstances={};
const donutFilterState = { ink: null, fang: null };

const filterState = { ink: -1, fang: -1, household: -1 };

// CONDO LOAN PARSER
// Sheet layout (1-indexed rows as described):
//   Row 1: years  (B1, C1, D1… — may span multiple cols per year)
//   Row 2: months (B2, C2, D2…)
//   Row 3: labels — contains "Paid Principal" and "Outstanding Balance"
//   Row 4: values; col B (index 1) row 4 = full condo cost = 4,052,100
const CONDO_FULL_COST = 4052100; // fixed original cost, col B row 4

function extractCondoData(rows) {
  if (!rows || rows.length < 4) return null;

  // Find label row — the row containing "Paid Principal"
  let labelRowIdx = -1;
  for (let r = 0; r < Math.min(rows.length, 8); r++) {
    const rowStr = rows[r].join(' ').toLowerCase();
    if (rowStr.includes('paid principal')) { labelRowIdx = r; break; }
  }
  if (labelRowIdx < 0 || labelRowIdx + 1 >= rows.length) return null;

  const labelRow = rows[labelRowIdx];
  const valueRow = rows[labelRowIdx + 1]; // data row immediately after labels

  // Year row is labelRowIdx - 2, month row is labelRowIdx - 1
  const yearRow  = rows[Math.max(0, labelRowIdx - 2)];
  const monthRow = rows[Math.max(0, labelRowIdx - 1)];

  // Full cost: col B (index 1) of value row — fallback to constant if missing/zero
  const parsedCost = numVal(valueRow[1]);
  const fullCost   = parsedCost > 0 ? parsedCost : CONDO_FULL_COST;

  // Find Paid Principal and Outstanding Balance column indices
  const paidPrincipalCols = [], outstandingCols = [];
  for (let c = 0; c < labelRow.length; c++) {
    const lbl = String(labelRow[c] || '').trim().toLowerCase();
    if (lbl.includes('paid principal'))      paidPrincipalCols.push(c);
    if (lbl.includes('outstanding balance')) outstandingCols.push(c);
  }
  if (!paidPrincipalCols.length) return null;

  // Build entries — iterate month row, only record where paid principal has a value
  const entries = [];
  let currentYear = '';

  for (let c = 1; c < monthRow.length; c++) {
    // Carry forward year
    if (yearRow[c] && String(yearRow[c]).trim()) currentYear = String(yearRow[c]).trim();

    const mon = String(monthRow[c] || '').trim();
    if (!mon) continue;

    // Only process columns that ARE a paid principal column
    if (!paidPrincipalCols.includes(c)) continue;

    const paidRaw = String(valueRow[c] || '').trim();
    if (!paidRaw) continue; // blank → skip this month

    const paidVal = numVal(paidRaw);

    // Find matching outstanding balance col: prefer immediately adjacent (c+1 or c-1)
    const obCol = outstandingCols.find(oc => oc === c + 1) ??
                  outstandingCols.find(oc => oc === c - 1) ??
                  outstandingCols[0];
    const outstandingVal = obCol !== undefined ? numVal(String(valueRow[obCol] || '')) : 0;

    const yr  = currentYear.slice(-2);
    const mon3 = mon.charAt(0).toUpperCase() + mon.slice(1, 3).toLowerCase();
    const label = `${mon3} '${yr}`;
    entries.push({ label, year: currentYear, month: mon, paid: paidVal, outstanding: outstandingVal });
  }

  if (!entries.length) return null;

  const latest = entries[entries.length - 1];
  return {
    fullCost,
    entries,
    latest: {
      label:       latest.label,
      paid:        latest.paid,
      outstanding: latest.outstanding,
      pctPaid:     fullCost > 0 ? (latest.paid / fullCost * 100) : 0,
    }
  };
}

function sliceData(d, fi) {
  if (fi < 0 || fi >= d.months.length - 1) return d;
  const end = fi + 1;
  return {
    months:     d.months.slice(0, end),
    components: d.components.map(c => ({ ...c, values: c.values.slice(0, end) })),
    totals:     d.totals.slice(0, end),
    firstLabel: d.firstLabel,
    lastLabel:  d.months[fi],
  };
}

function getHouseholdSliced(fi) {
  const inkSliced  = sliceData(inkData,  fi);
  const fangStart  = inkData.months.indexOf(fangData.months[0]);
  const fangEndIdx = fi < 0 ? fangData.months.length - 1
                             : Math.max(-1, fi - fangStart);
  const fangSliced = sliceData(fangData, fangEndIdx);
  return { inkSliced, fangSliced };
}

// LOAD DATA
async function loadData() {
  setStatus('loading','Fetching from Google Sheets\u2026');
  const skelEl = document.getElementById('skeleton-screen');
  const contentEl = document.getElementById('page-content');
  if (skelEl)    skelEl.style.display    = 'block';
  if (contentEl) contentEl.style.display = 'none';
  document.getElementById('chart-loading').style.display = 'flex';
  document.getElementById('error-box').classList.remove('show');
  try {
    const [inkRows, fangRows] = await Promise.all([
      fetchCSV(INK_CSV_URL),
      fetchCSV(FANG_CSV_URL),
    ]);
    inkData  = extractData(inkRows,  INK_CONFIG);
    fangData = extractData(fangRows, FANG_CONFIG);
    // Condo is non-fatal — load separately so failure doesn't break the dashboard
    try {
      const condoRows = await fetchCSV(CONDO_CSV_URL);
      condoData = extractCondoData(condoRows);
    } catch(ce) {
      console.warn('Condo data failed to load:', ce.message);
      condoData = null;
    }
    if (!inkData.months.length || !fangData.months.length)
      throw new Error('No data found \u2014 check sheet is published');

    const [inkDRows, fangDRows] = await Promise.all([
      Promise.all(INK_DONUTS.map(d  => fetchCSV(d.url))),
      Promise.all(FANG_DONUTS.map(d => fetchCSV(d.url))),
    ]);
    inkDonutData  = INK_DONUTS.map((d,i)  => ({ title:d.title, ...extractDonutAllMonths(inkDRows[i],  d) }));
    fangDonutData = FANG_DONUTS.map((d,i) => ({ title:d.title, ...extractDonutAllMonths(fangDRows[i], d) }));
    
    donutFilterState.ink  = null;
    donutFilterState.fang = null;

    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    setStatus('ok', 'Live \u00b7 Google Sheets \u00b7 ' + VERSION + ' \u00b7 Auto-updates on refresh');
    document.getElementById('chart-loading').style.display = 'none';
    if (skelEl)    skelEl.style.display    = 'none';
    if (contentEl) contentEl.style.display = 'block';
    return true;
  } catch(e) {
    setStatus('error','Failed: ' + e.message);
    const eb = document.getElementById('error-box');
    eb.textContent = 'Error: ' + e.message;
    eb.classList.add('show');
    document.getElementById('chart-loading').style.display = 'none';
    if (skelEl)    skelEl.style.display    = 'none';
    if (contentEl) contentEl.style.display = 'block';
    return false;
  }
}
function setStatus(state, msg) {
  document.getElementById('status-dot').className = 'status-dot' + (state==='loading'?' loading':state==='error'?' error':'');
  document.getElementById('status-text').textContent = msg;
}

// FORMAT LOGIC
function fmtM(v) {
  const a = Math.abs(v);
  if (a>=1e6) return '\u0e3f'+(v/1e6).toFixed(2)+'M';
  if (a>=1e3) return '\u0e3f'+(v/1e3).toFixed(0)+'K';
  return '\u0e3f'+Math.round(v).toLocaleString();
}
// Currency-aware abbreviated format — use for donut values
function fmtMC(v, currency) {
  const sym = (currency === 'USD') ? '$' : '\u0e3f';
  const a   = Math.abs(v);
  const sign = v < 0 ? '-' : '';
  if (a >= 1e6) return sign + sym + (a/1e6).toFixed(2) + 'M';
  if (a >= 1e3) return sign + sym + (a/1e3).toFixed(0) + 'K';
  return sign + sym + Math.round(a).toLocaleString();
}
function fmtPct(a,b) {
  if (!b||b===0) return '\u2014';
  const d=(a-b)/b*100;
  return (d>=0?'+':'')+d.toFixed(1)+'%';
}
function hexA(hex,a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// GOALS HELPERS
function getLatestValues(d, config) {
  const idx = d.totals.length - 1;
  const cashIdx = config.cashComponentIdx;
  const cash = d.components[cashIdx].values[idx];
  const invest = d.totals[idx] - cash;
  return { cash, invest };
}

function goalColor(pct) {
  if (pct >= 100) return '#5ce0a8';
  if (pct >= 60)  return '#c8f542';
  if (pct >= 30)  return '#f0b429';
  return '#f06b6b';
}

function goalBarHTML(label, current, target) {
  const pct    = Math.min(current / target * 100, 100);
  const color  = goalColor(pct);
  const pctStr = pct.toFixed(1) + '%';
  return `
    <div class="goal-bar-row">
      <div class="goal-bar-meta">
        <span class="goal-bar-label">${label}</span>
        <span class="goal-bar-pct" style="color:${color}">${pctStr}</span>
      </div>
      <div class="goal-bar-track">
        <div class="goal-bar-fill" style="width:${pct}%;background:${color}"></div>
      </div>
      <div class="goal-bar-footer">
        <span class="goal-bar-target">Target: ${mask(fmtM(target))}</span>
      </div>
    </div>`;
}

// Stacked Ink/Fang variant — used in Household tab only
function goalBarStackedHTML(label, inkVal, fangVal, target) {
  const total   = inkVal + fangVal;
  const pct     = Math.min(total / target * 100, 100);
  const color   = goalColor(pct);
  const pctStr  = pct.toFixed(1) + '%';

  // Ink and Fang segment widths as % of the full track (not just of total)
  const inkPct  = Math.min(inkVal  / target * 100, 100);
  const fangPct = Math.min(fangVal / target * 100, Math.max(0, pct - inkPct));

  return `
    <div class="goal-bar-row">
      <div class="goal-bar-meta">
        <span class="goal-bar-label">${label}</span>
        <span class="goal-bar-pct" style="color:${color}">${pctStr}</span>
      </div>
      <div class="goal-bar-track" style="position:relative;">
        <div style="position:absolute;left:0;top:0;height:100%;width:${inkPct}%;background:#4da8f5;border-radius:99px 0 0 99px;transition:width .6s cubic-bezier(.4,0,.2,1);"></div>
        <div style="position:absolute;left:${inkPct}%;top:0;height:100%;width:${fangPct}%;background:#5ce0a8;border-radius:${inkPct === 0 ? '99px' : '0'} ${inkPct + fangPct >= 99.9 ? '99px' : '0'} ${inkPct + fangPct >= 99.9 ? '99px' : '0'} ${inkPct === 0 ? '99px' : '0'};transition:width .6s cubic-bezier(.4,0,.2,1),left .6s cubic-bezier(.4,0,.2,1);"></div>
      </div>
      <div style="display:flex;justify-content:flex-end;align-items:center;margin-top:3px;">
        <span class="goal-bar-target">Target: ${mask(fmtM(target))}</span>
      </div>
    </div>`;
}

// METRICS
// YTD helper — finds Jan value and computes change to current
function calcYTD(months, totals) {
  const last = totals[totals.length - 1];
  // Find the latest January in the data at or before current point
  let janIdx = -1;
  for (let i = totals.length - 1; i >= 0; i--) {
    if (/^jan/i.test(months[i])) { janIdx = i; break; }
  }
  if (janIdx < 0) return null; // no January in range
  const janVal = totals[janIdx];
  const diff   = last - janVal;
  const pct    = janVal !== 0 ? (diff / Math.abs(janVal) * 100) : 0;
  const year   = months[janIdx].replace(/[^0-9]/g,'').slice(-2);
  return { diff, pct, label: "YTD '" + (year || '?'), janVal };
}

function renderMetrics(tab) {
  const active = getActiveData(tab);
  function pCards(d) {
    const last=d.totals[d.totals.length-1], prev=d.totals[d.totals.length-2]??last, first=d.totals[0];
    const mom=fmtPct(last,prev), peak=Math.max(...d.totals);
    const ytd = calcYTD(d.months, d.totals);
    const ytdVal = ytd
      ? (ytd.diff >= 0 ? '+' : '') + fmtM(ytd.diff) + ' (' + (ytd.pct >= 0 ? '+' : '') + ytd.pct.toFixed(1) + '%)'
      : '—';
    const ytdCls = ytd ? (ytd.diff >= 0 ? 'pos' : 'neg') : '';
    return [
      {label:'Current net worth', val:mask(fmtM(last)),          sub:mom+' MoM',                         cls:parseFloat(mom)>=0?'pos':'neg'},
      {label:'All-time growth',   val:fmtPct(last,first),        sub:'Since '+d.firstLabel,               cls:''},
      {label:'Peak',              val:mask(fmtM(peak)),          sub:d.months[d.totals.indexOf(peak)],    cls:''},
      {label: ytd ? ytd.label : 'YTD', val: ytd ? mask(ytdVal) : '—', sub: ytd ? 'vs '+mask(fmtM(ytd.janVal))+' Jan' : 'No Jan in range', cls: ytdCls},
    ];
  }
  let cards;
  if (tab==='ink')  cards=pCards(active.ink);
  else if (tab==='fang') cards=pCards(active.fang);
  else {
    const inkS=active.ink, fangS=active.fang;
    const iL=inkS.totals[inkS.totals.length-1];
    const fL=fangS.totals.length ? fangS.totals[fangS.totals.length-1] : 0;
    const tot=iL+fL;
    const iP=inkS.totals[inkS.totals.length-2]??iL;
    const fP=fangS.totals.length>1 ? fangS.totals[fangS.totals.length-2] : fL;
    const mom=fmtPct(tot,iP+fP);
    // Household YTD: combine ink + fang totals aligned by month
    const inkJan = calcYTD(inkS.months, inkS.totals);
    const fangStart = inkS.months.indexOf(fangS.months[0]);
    // Find the Jan index in household (ink months)
    let hhJanIdx = -1;
    for (let i = inkS.totals.length - 1; i >= 0; i--) {
      if (/^jan/i.test(inkS.months[i])) { hhJanIdx = i; break; }
    }
    let hhYtd = null;
    if (hhJanIdx >= 0) {
      const inkJanVal  = inkS.totals[hhJanIdx];
      const fangJanIdx = fangStart >= 0 ? hhJanIdx - fangStart : -1;
      const fangJanVal = (fangJanIdx >= 0 && fangJanIdx < fangS.totals.length) ? fangS.totals[fangJanIdx] : 0;
      const janTot = inkJanVal + fangJanVal;
      const diff   = tot - janTot;
      const pct    = janTot !== 0 ? diff / Math.abs(janTot) * 100 : 0;
      const year   = inkS.months[hhJanIdx].replace(/[^0-9]/g,'').slice(-2);
      hhYtd = { diff, pct, label: "YTD '" + (year || '?'), janVal: janTot };
    }
    const hhYtdVal = hhYtd
      ? (hhYtd.diff >= 0 ? '+' : '') + fmtM(hhYtd.diff) + ' (' + (hhYtd.pct >= 0 ? '+' : '') + hhYtd.pct.toFixed(1) + '%)'
      : '—';
    cards=[
      {label:'Household net worth', val:mask(fmtM(tot)),                       sub:mom+' MoM',             cls:parseFloat(mom)>=0?'pos':'neg'},
      {label:"Ink's share",         val:tot>0?(iL/tot*100).toFixed(0)+'%':'—', sub:mask(fmtM(iL)),         cls:''},
      {label:"Fang's share",        val:tot>0?(fL/tot*100).toFixed(0)+'%':'—', sub:mask(fmtM(fL)),         cls:''},
      {label: hhYtd ? hhYtd.label : 'YTD', val: hhYtd ? mask(hhYtdVal) : '—', sub: hhYtd ? 'vs '+mask(fmtM(hhYtd.janVal))+' Jan' : 'No Jan in range', cls: hhYtd ? (hhYtd.diff >= 0 ? 'pos' : 'neg') : ''},
    ];
  }
  document.getElementById('metric-grid').innerHTML = cards.map(c =>
    `<div class="metric-card"><p class="metric-label">${c.label}</p><p class="metric-val">${c.val}</p><p class="metric-sub ${c.cls}">${c.sub}</p></div>`
  ).join('');
}

// LINE CHART
let chartInst = null;
let hiddenSeries = new Set();
let chartRange = 'all'; // 'all' | '12' | '6' | '3'

function setRange(r) {
  chartRange = r;
  document.querySelectorAll('.range-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.range === r);
  });
  renderChart(currentTab);
}

function sliceByRange(months, datasets) {
  if (chartRange === 'all') return { months, datasets };
  const n = parseInt(chartRange);
  const start = Math.max(0, months.length - n);
  const slicedMonths = months.slice(start);
  const slicedDatasets = datasets.map(ds => ({
    ...ds,
    data: ds.data.slice(start),
  }));
  return { months: slicedMonths, datasets: slicedDatasets };
}

function makeGradient(ctx, color, alpha1 = 0.22, alpha2 = 0.0) {
  const grad = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
  grad.addColorStop(0, hexA(color, alpha1));
  grad.addColorStop(1, hexA(color, alpha2));
  return grad;
}

function buildDatasets(tab) {
  const canvas = document.getElementById('main-chart');
  const ctx2d  = canvas ? canvas.getContext('2d') : null;
  const active = getActiveData(tab);

  if (tab === 'ink' || tab === 'fang') {
    const d  = tab === 'ink' ? active.ink : active.fang;
    const ds = d.components.filter(c => !hiddenSeries.has(c.name)).map(c => ({
      label: c.name, data: c.values,
      borderColor: c.color,
      backgroundColor: ctx2d ? makeGradient(ctx2d, c.color, 0.18, 0) : hexA(c.color, 0.12),
      borderWidth: 1.5, fill: 'origin', tension: 0.3,
      pointRadius: 2, pointHoverRadius: 5, pointBackgroundColor: c.color,
      stack: 'stack'
    }));
    // Total line — thicker, white, dashed anchor
    ds.push({
      label: '__total__', data: d.totals,
      borderColor: 'rgba(255,255,255,0.55)',
      backgroundColor: 'transparent',
      borderWidth: 2.5, borderDash: [4, 3], fill: false, tension: 0.3,
      pointRadius: 0, pointHoverRadius: 4,
    });
    return { labels: d.months, datasets: ds };
  } else {
    const inkS = active.ink, fangS = active.fang;
    const im   = inkS.months;
    const fs   = im.indexOf(fangS.months[0]);
    const combined = inkS.totals.map((v, i) => {
      const fi = fs !== -1 ? i - fs : -1;
      return v + (fi >= 0 && fi < fangS.totals.length ? fangS.totals[fi] : 0);
    });
    const fAl = im.map((_, i) => {
      const fi = fs !== -1 ? i - fs : -1;
      return fi >= 0 && fi < fangS.totals.length ? fangS.totals[fi] : null;
    });
    return { labels: im, datasets: [
      // Component lines — thinner
      { label: 'Ink',  data: inkS.totals,
        borderColor: '#4da8f5',
        backgroundColor: ctx2d ? makeGradient(ctx2d, '#4da8f5', 0.14, 0) : hexA('#4da8f5', 0.08),
        borderWidth: 1.5, fill: false, tension: 0.3,
        pointRadius: 2, pointHoverRadius: 5, pointBackgroundColor: '#4da8f5' },
      { label: 'Fang', data: fAl,
        borderColor: '#5ce0a8',
        backgroundColor: ctx2d ? makeGradient(ctx2d, '#5ce0a8', 0.14, 0) : hexA('#5ce0a8', 0.08),
        borderWidth: 1.5, fill: false, tension: 0.3,
        pointRadius: 2, pointHoverRadius: 5, pointBackgroundColor: '#5ce0a8', spanGaps: false },
      // Household total — thicker anchor line
      { label: 'Household total', data: combined,
        borderColor: '#c8f542',
        backgroundColor: ctx2d ? makeGradient(ctx2d, '#c8f542', 0.16, 0) : hexA('#c8f542', 0.06),
        borderWidth: 3, borderDash: [5, 3], fill: false, tension: 0.3,
        pointRadius: 0, pointHoverRadius: 5, pointBackgroundColor: '#c8f542' },
    ]};
  }
}

function renderChart(tab) {
  if (chartInst) { chartInst.destroy(); chartInst=null; }
  const raw = buildDatasets(tab);
  const { months: labels, datasets } = sliceByRange(raw.labels, raw.datasets);
  chartInst = new Chart(document.getElementById('main-chart').getContext('2d'), {
    type:'line', data:{labels,datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false}, tooltip:{enabled:false, external:extTooltip}},
      scales:{
        x:{grid:{color:'rgba(255,255,255,0.04)',drawBorder:false}, ticks:{color:'#555450',font:{family:"'DM Mono',monospace",size:10},maxRotation:45,autoSkip:true,maxTicksLimit:14}, border:{color:'rgba(255,255,255,0.06)'}},
        y:{grid:{color:'rgba(255,255,255,0.04)',drawBorder:false}, ticks:{color:'#555450',font:{family:"'DM Mono',monospace",size:10},callback:v=>mask(fmtM(v))}, border:{color:'rgba(255,255,255,0.06)'}, beginAtZero:true}
      }
    }
  });
}

// CROSSHAIR + CUSTOM TOOLTIP
function extTooltip(ctx) {
  const tt   = document.getElementById('chart-tooltip');
  const xhair = document.getElementById('chart-crosshair');

  if (ctx.tooltip.opacity === 0) {
    tt.style.display    = 'none';
    if (xhair) xhair.style.display = 'none';
    return;
  }
  const t = ctx.tooltip;

  // ── Crosshair ──
  if (xhair) {
    const chartArea = chartInst.chartArea;
    const x = t.caretX;
    // Only show crosshair within chart plot area
    if (x >= chartArea.left && x <= chartArea.right) {
      xhair.style.display = 'block';
      xhair.style.left    = x + 'px';
      xhair.style.top     = chartArea.top + 'px';
      xhair.style.height  = (chartArea.bottom - chartArea.top) + 'px';
    } else {
      xhair.style.display = 'none';
    }
  }

  // ── Tooltip content ──
  const vis   = t.dataPoints.filter(p => p.dataset.label !== '__total__' && p.raw !== null);
  vis.sort((a, b) => b.raw - a.raw);
  const totPt = t.dataPoints.find(p => p.dataset.label === '__total__');
  const hhPt  = t.dataPoints.find(p => p.dataset.label === 'Household total');

  let html = `<div class="tt-month">${t.title[0] || ''}</div>`;
  vis.forEach(p => {
    html += `<div class="tt-row"><span class="tt-row-label"><span class="tt-dot" style="background:${p.dataset.borderColor}"></span>${p.dataset.label}</span><span class="tt-val">${mask(fmtM(p.raw))}</span></div>`;
  });
  if (totPt) html += `<div class="tt-row tt-total"><span>Total</span><span class="tt-val">${mask(fmtM(totPt.raw))}</span></div>`;
  else if (hhPt && hhPt.raw !== null) html += `<div class="tt-row tt-total"><span>Household</span><span class="tt-val">${mask(fmtM(hhPt.raw))}</span></div>`;

  tt.innerHTML = html;
  tt.style.display = 'block';

  // ── Position tooltip: flip to left if too close to right edge ──
  const wr = tt.parentElement.getBoundingClientRect();
  const ttW = 220;
  let l = t.caretX + 18;
  if (l + ttW > wr.width) l = t.caretX - ttW - 10;
  tt.style.left = Math.max(0, l) + 'px';
  tt.style.top  = Math.max(0, t.caretY - 20) + 'px';
}

// DONUT CHARTS LOGIC
function getDonutMonths(tab) {
  const list = tab === 'ink' ? inkDonutData : fangDonutData;
  const monthSet = new Set();
  list.forEach(d => d.months.forEach(m => monthSet.add(m)));
  let refMonths = [];
  list.forEach(d => { if (d.months.length > refMonths.length) refMonths = d.months; });
  const sorted = [...monthSet].sort((a, b) => {
    const ai = refMonths.indexOf(a), bi = refMonths.indexOf(b);
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return 0;
  });
  return sorted;
}

function setDonutSort(tab, mode) {
  donutSortState[tab] = mode;
  renderDonuts(tab);
}

function syncSortPills(tab) {
  const mode = donutSortState[tab] || 'value';
  ['value','uplPct','uplVal'].forEach(m => {
    const el = document.getElementById('sort-' + m);
    if (el) el.classList.toggle('active', m === mode);
  });
}

function applyDonutSort(assets, mode, isCash) {
  const sorted = [...assets];
  if (!isCash && mode === 'uplPct') {
    sorted.sort((a, b) => {
      const pctA = (a.upl != null && (a.value - a.upl) > 0) ? a.upl / (a.value - a.upl) : -Infinity;
      const pctB = (b.upl != null && (b.value - b.upl) > 0) ? b.upl / (b.value - b.upl) : -Infinity;
      return pctB - pctA;
    });
  } else if (!isCash && mode === 'uplVal') {
    sorted.sort((a, b) => (b.upl ?? -Infinity) - (a.upl ?? -Infinity));
  } else {
    sorted.sort((a, b) => b.pct - a.pct); // default: holding value / allocation %
  }
  return sorted;
}

function renderDonutFilter(tab) {
  const scroll = document.getElementById('donut-filter-scroll');
  if (!scroll) return;
  const months = getDonutMonths(tab);
  if (!months.length) { scroll.innerHTML = ''; return; }
  const latest = months[months.length - 1];
  const active = donutFilterState[tab] || latest;
  scroll.innerHTML = [...months].reverse().map(m => {
    const isLatest = m === latest;
    const isActive = m === active;
    return `<button class="filter-pill ${isActive ? 'active' : ''}"
      onclick="selectDonutFilter('${tab}','${m}')">${m}${isLatest ? ' ✦' : ''}</button>`;
  }).join('');
}

function selectDonutFilter(tab, month) {
  donutFilterState[tab] = month;
  renderDonuts(tab);
}

function renderDonuts(tab) {
  const section=document.getElementById('donut-section');
  const grid=document.getElementById('donut-grid');
  Object.values(donutInstances).forEach(c=>c.destroy());
  donutInstances={};
  if (tab==='household') { section.style.display='none'; return; }
  section.style.display='block';

  const list = tab==='ink' ? inkDonutData : fangDonutData;
  const allMonths = getDonutMonths(tab);
  const latest    = allMonths[allMonths.length - 1];
  const activeMonth = donutFilterState[tab] || latest;

  renderDonutFilter(tab);
  syncSortPills(tab);

  const resolvedList = list.map(d => {
    let assets = d.byMonth[activeMonth];
    if (!assets || !assets.length) {
      const available = d.months.filter(m => {
        const ai = allMonths.indexOf(m), ac = allMonths.indexOf(activeMonth);
        return ai <= ac;
      });
      const fallback = available[available.length - 1];
      assets = fallback ? (d.byMonth[fallback] || []) : [];
    }
    assets = applyDonutSort([...assets], donutSortState[tab] || 'value', d.title.toLowerCase().includes('cash'));
    return { title: d.title, assets, currency: d.currency };
  });

  grid.innerHTML = resolvedList.map((d,idx) => {
    if (!d.assets.length) return `<div class="donut-card"><p class="donut-card-title">${d.title}</p><p class="donut-empty">No data for this period</p></div>`;

    const isCash    = d.title.toLowerCase().includes('cash');
    const totalMV   = d.assets.reduce((s,a) => s+a.value, 0);
    const totalUPL  = isCash ? null : d.assets.reduce((s,a) => s+(a.upl ?? 0), 0);
    const totalUPLPct = (!isCash && totalMV > 0) ? (totalUPL / (totalMV - totalUPL) * 100) : null;

    const legItems = d.assets.map((a,ai) => {
      const hasUPL = !isCash && a.upl !== null && a.upl !== undefined;
      const uplPct  = hasUPL && (a.value - a.upl) > 0 ? (a.upl / (a.value - a.upl) * 100) : null;
      const uplCol  = hasUPL ? (a.upl >= 0 ? '#5ce0a8' : '#f06b6b') : '';
      const uplPctStr = uplPct !== null ? `${uplPct >= 0 ? '+' : ''}${uplPct.toFixed(1)}%` : '';
      const uplValStr = hasUPL ? `(${a.upl >= 0 ? '+' : ''}${fmtMC(a.upl, a.currency)})` : '';
      const subRow = hasUPL ? `
        <div class="donut-leg-sub">
          <span class="donut-leg-mv">${mask(fmtMC(a.value, a.currency))}</span>
          <span class="donut-leg-upl" style="color:${uplCol};">${mask(uplPctStr)} <span class="donut-leg-upl-val">${mask(uplValStr)}</span></span>
        </div>` : `
        <div class="donut-leg-sub">
          <span class="donut-leg-mv">${mask(fmtMC(a.value, a.currency))}</span>
        </div>`;
      return `
        <div class="donut-leg-item" data-idx="${ai}"
          onmouseenter="donutLegHover(this,'${tab}',${idx},${ai},true)"
          onmouseleave="donutLegHover(this,'${tab}',${idx},${ai},false)">
          <div class="donut-leg-main">
            <span class="donut-leg-dot" style="background:${PALETTE[ai%PALETTE.length]}"></span>
            <span class="donut-leg-name" title="${a.name}">${a.name}</span>
            <span class="donut-leg-pct">${a.pct.toFixed(1)}%</span>
          </div>
          ${subRow}
        </div>`;
    }).join('');

    // Donut center: total MV + total UPL% (UPL value)
    const centerUPLStr = (!isCash && totalUPLPct !== null)
      ? `${totalUPLPct >= 0 ? '+' : ''}${totalUPLPct.toFixed(1)}%`
      : '';
    const centerUPLVal = (!isCash && totalUPL !== null)
      ? `(${totalUPL >= 0 ? '+' : ''}${fmtMC(totalUPL, d.currency)})`
      : '';

    return `
      <div class="donut-card">
        <p class="donut-card-title">${d.title}</p>
        <div class="donut-card-body">
          <div class="donut-canvas-wrap">
            <canvas id="dc-${tab}-${idx}"></canvas>
            <div class="donut-center" id="dctr-${tab}-${idx}">
              <span class="donut-center-total">${mask(fmtMC(totalMV, d.currency))}</span>
              <span class="donut-center-label" id="dctr-upl-${tab}-${idx}">
                <span style="display:block;color:${centerUPLStr.startsWith('-') ? '#f06b6b' : '#5ce0a8'};font-size:8px;line-height:1.3;white-space:nowrap;">${isCash ? '' : mask(centerUPLStr)}</span>
                <span style="display:block;color:${totalUPL >= 0 ? '#5ce0a8' : '#f06b6b'};font-size:7px;line-height:1.3;white-space:nowrap;">${isCash ? '' : mask(centerUPLVal)}</span>
              </span>
              <span class="donut-center-hover-pct"></span>
              <span class="donut-center-hover-val"></span>
              <span class="donut-center-hover-name"></span>
            </div>
          </div>
          <div class="donut-leg">${legItems}</div>
        </div>
      </div>`;
  }).join('');

  requestAnimationFrame(() => {
    resolvedList.forEach((d, idx) => {
      if (!d.assets.length) return;
      const canvas = document.getElementById(`dc-${tab}-${idx}`);
      const center = document.getElementById(`dctr-${tab}-${idx}`);
      if (!canvas || !center) return;

      // Read actual rendered size from CSS (respects mobile !important overrides)
      const wrap = canvas.parentElement;
      const SZ = wrap.offsetWidth || 100;
      canvas.width  = SZ; canvas.height = SZ;
      canvas.style.width = SZ+'px'; canvas.style.height = SZ+'px';

      const colors   = d.assets.map((_,ai) => PALETTE[ai % PALETTE.length]);
      const isCashCard = d.title.toLowerCase().includes('cash');
      const totalMV   = d.assets.reduce((s,a)=>s+a.value,0);
      const totalStr  = fmtMC(totalMV, d.currency);

      const totalEl = center.querySelector('.donut-center-total');
      const labelEl = center.querySelector('.donut-center-label');
      const hPctEl  = center.querySelector('.donut-center-hover-pct');
      const hValEl  = center.querySelector('.donut-center-hover-val');
      const hNameEl = center.querySelector('.donut-center-hover-name');

      const chart = new Chart(canvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: d.assets.map(a=>a.name),
          datasets: [{ data:d.assets.map(a=>a.pct), backgroundColor:colors, borderColor:'#161616', borderWidth:2, hoverOffset:6 }]
        },
        options: {
          responsive: false, cutout: '68%', animation: { duration:400 },
          plugins: { legend:{display:false}, tooltip:{enabled:false} },
          onHover: (_evt, elements) => {
            if (elements.length > 0) {
              const i = elements[0].index;
              const a = d.assets[i];
              totalEl.style.display = 'none'; labelEl.style.display = 'none';
              hPctEl.style.display = 'block'; hValEl.style.display = 'block'; hNameEl.style.display = 'block';
              hPctEl.textContent  = a.pct.toFixed(1) + '%';
              hValEl.textContent  = mask(fmtMC(a.value, a.currency));
              hNameEl.textContent = a.name;
            } else {
              totalEl.style.display = 'block'; totalEl.textContent = mask(fmtMC(totalMV, d.currency));
              labelEl.style.display = 'block';
              hPctEl.style.display = 'none'; hValEl.style.display = 'none'; hNameEl.style.display = 'none';
            }
          }
        }
      });
      donutInstances[`dc-${tab}-${idx}`] = chart;
    });
  });
}

// ENHANCEMENT: Removed any layout/view scroll jumping triggers when filters are adjusted
function renderFilter(tab) {
  const scroll = document.getElementById('filter-scroll');
  let months;
  if (tab === 'household') {
    months = inkData.months;
  } else {
    months = tab === 'ink' ? inkData.months : fangData.months;
  }

  const currentFi = filterState[tab];
  const activeIdx = currentFi < 0 ? months.length - 1 : currentFi;

  scroll.innerHTML = months.slice().reverse().map((lbl, revIdx) => {
    const fi = months.length - 1 - revIdx;
    const isActive = fi === activeIdx;
    const isLatest = fi === months.length - 1;
    const display  = isLatest ? lbl + ' ✦' : lbl;
    return `<button class="filter-pill ${isActive ? 'active' : ''}"
      onclick="selectFilter('${tab}', ${fi})">${display}</button>`;
  }).join('');
}

function selectFilter(tab, fi) {
  const months = tab === 'household' ? inkData.months
               : tab === 'ink'       ? inkData.months
               :                       fangData.months;
  filterState[tab] = (fi >= months.length - 1) ? -1 : fi;

  // ── Sync asset allocation filter (one-way: net worth → donut only) ──────
  if (tab === 'ink' || tab === 'fang') {
    const resolvedIdx = filterState[tab] < 0 ? months.length - 1 : filterState[tab];
    const donutMonths = getDonutMonths(tab);

    if (donutMonths.length === 0) {
      // No donut data yet — nothing to sync
    } else if (resolvedIdx >= months.length - 1) {
      // Net worth is at latest → donut goes to latest too
      donutFilterState[tab] = null;
    } else {
      // Net worth is at a historical point.
      // Strategy: find the latest donut month whose label appears at or before
      // the selected net worth month. We normalise both sides to lowercase+trimmed
      // for comparison since label formats may differ slightly between sheets.
      const selectedLabel = months[resolvedIdx].trim().toLowerCase();

      // Build a normalised version of all net worth month labels so we can
      // find the position of each donut month within the net worth timeline.
      const normNetWorth = months.map(m => m.trim().toLowerCase());

      // For each donut month, find its position in the net worth months array.
      // If the donut month label doesn't appear there (different format), we
      // fall back to a positional approach: pick the donut month whose index
      // (as a proportion of all donut months) is closest to the net worth position.
      const nwPos = resolvedIdx; // 0 = oldest, months.length-1 = newest

      let bestDonutMonth = null;
      let bestDonutIdx   = -1;

      for (let di = 0; di < donutMonths.length; di++) {
        const dm    = donutMonths[di];
        const dmNorm = dm.trim().toLowerCase();
        // Try exact label match first
        const exactPos = normNetWorth.indexOf(dmNorm);
        if (exactPos !== -1) {
          // This donut month has an exact match in the net worth timeline
          if (exactPos <= nwPos) {
            bestDonutMonth = dm;
            bestDonutIdx   = di;
          }
        } else {
          // No exact match: use proportional position
          // Donut proportion: di / (donutMonths.length - 1)
          // Net worth proportion: nwPos / (months.length - 1)
          const donutProp = donutMonths.length > 1 ? di / (donutMonths.length - 1) : 1;
          const nwProp    = months.length > 1     ? nwPos / (months.length - 1)    : 1;
          if (donutProp <= nwProp + 0.001) {
            // This donut month is at or before the selected net worth point
            bestDonutMonth = dm;
            bestDonutIdx   = di;
          }
        }
      }

      if (bestDonutMonth === null) {
        // Selected point is before any donut data — use oldest donut month
        bestDonutMonth = donutMonths[0];
        bestDonutIdx   = 0;
      }

      const isDonutLatest = bestDonutIdx === donutMonths.length - 1;
      donutFilterState[tab] = isDonutLatest ? null : bestDonutMonth;
    }
  }

  renderAll(tab);
}

function getActiveData(tab) {
  const fi = filterState[tab];
  if (tab === 'ink') {
    return { ink: sliceData(inkData, fi), fang: null };
  } else if (tab === 'fang') {
    return { ink: null, fang: sliceData(fangData, fi) };
  } else {
    const { inkSliced, fangSliced } = getHouseholdSliced(fi);
    return { ink: inkSliced, fang: fangSliced };
  }
}

// DONUT LEGEND HOVER — highlights the matching slice and shows value
function donutLegHover(el, tab, cardIdx, assetIdx, entering) {
  const chartKey = `dc-${tab}-${cardIdx}`;
  const chart = donutInstances[chartKey];
  const centerId = `dctr-${tab}-${cardIdx}`;
  const center = document.getElementById(centerId);

  if (chart) {
    if (entering) {
      // Highlight just this slice in Chart.js
      chart.setDatasetVisibility(0, true);
      chart.data.datasets[0].backgroundColor = chart.data.datasets[0].backgroundColor.map(
        (c, i) => i === assetIdx ? c : c + '33'
      );
      chart.update('none');
    } else {
      // Restore all slice colours
      chart.data.datasets[0].backgroundColor = chart.data.datasets[0].backgroundColor.map(c =>
        c.endsWith('33') ? c.slice(0, -2) : c
      );
      chart.update('none');
    }
  }

  // Also update the donut center text to mirror the hover state
  if (center) {
    const totalEl = center.querySelector('.donut-center-total');
    const labelEl = center.querySelector('.donut-center-label');
    const hPctEl  = center.querySelector('.donut-center-hover-pct');
    const hValEl  = center.querySelector('.donut-center-hover-val');
    const hNameEl = center.querySelector('.donut-center-hover-name');
    if (!totalEl) return;

    const list = tab === 'ink' ? inkDonutData : fangDonutData;
    const allM  = getDonutMonths(tab);
    const latestM = allM[allM.length - 1];
    const activeM = donutFilterState[tab] || latestM;
    const d = list[cardIdx];
    let assets = d ? (d.byMonth[activeM] || []) : [];
    assets = [...assets].sort((a,b) => b.pct - a.pct);
    const a = assets[assetIdx];

    if (entering && a) {
      totalEl.style.display = 'none'; labelEl.style.display = 'none';
      hPctEl.style.display = 'block'; hValEl.style.display = 'block'; hNameEl.style.display = 'block';
      hPctEl.textContent  = a.pct.toFixed(1) + '%';
      hValEl.textContent  = mask(fmtMC(a.value, a.currency));
      hNameEl.textContent = a.name;
    } else {
      const totalMV2  = assets.reduce((s,x)=>s+x.value,0);
      const currency2 = d ? d.currency : 'THB';
      totalEl.style.display = 'block'; totalEl.textContent = mask(fmtMC(totalMV2, currency2));
      labelEl.style.display = 'block';
      hPctEl.style.display = 'none'; hValEl.style.display = 'none'; hNameEl.style.display = 'none';
    }
  }
}

// Load html2canvas dynamically
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) { res(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

    if (cards) {
      donutSection = `

  // ── 3. Metric values (mirrors renderMetrics exactly) ──
  let metricRows = [];
  if (tab === 'ink') {
    const d = active.ink;
    const last = d.totals[d.totals.length-1], prev = d.totals[d.totals.length-2] ?? last, first = d.totals[0];

    const fL = fangS.totals.length ? fangS.totals[fangS.totals.length-1] : 0;
