  let legendHTML = '';
  if (tab === 'household') {
    legendHTML = [{n:'Ink',c:'#4da8f5'},{n:'Fang',c:'#5ce0a8'},{n:'Household total',c:'#c8f542'}]
      .map(i=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#888780;margin-right:14px;"><span style="width:8px;height:8px;border-radius:2px;background:${i.c};flex-shrink:0;display:inline-block;"></span>${i.n}</span>`).join('');
  } else {
    const d = tab === 'ink' ? inkData : fangData;
    legendHTML = d.components.map(c =>
      `<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#888780;margin-right:14px;"><span style="width:8px;height:8px;border-radius:2px;background:${c.color};flex-shrink:0;display:inline-block;"></span>${c.name}</span>`
    ).join('');
  }

  const chartRangeLabel = chartRange === 'all' ? 'All time' : chartRange + ' months';
  const chartSection = chartDataUrl ? `
    <div style="margin-bottom:24px;">
      <p style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#555450;margin-bottom:12px;">Net Worth Over Time · ${chartRangeLabel}</p>
      <div style="background:#161616;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:16px;">
        <img src="${chartDataUrl}" style="width:100%;display:block;border-radius:6px;" />
        <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 0;">${legendHTML}</div>
      </div>
    </div>` : '';

  // ── 2. Capture live donut canvases ──
  let donutSection = '';
  if (tab !== 'household') {
    const list = tab === 'ink' ? inkDonutData : fangDonutData;
    const allM = getDonutMonths(tab);
    const latest = allM[allM.length - 1];
    const activeMonth = donutFilterState[tab] || latest;

    const cards = list.map((d, idx) => {
      // Get assets for this card (same fallback logic as renderDonuts)
      let assets = d.byMonth[activeMonth];
      if (!assets || !assets.length) {
        const available = d.months.filter(m => {
          const ai = allM.indexOf(m), ac = allM.indexOf(activeMonth);
          return ai <= ac;
        });
        const fallback = available[available.length - 1];
        assets = fallback ? (d.byMonth[fallback] || []) : [];
      }
      if (!assets.length) return '';
      assets = [...assets].sort((a, b) => b.pct - a.pct);
      const totalVal = assets.reduce((s, a) => s + a.value, 0);

      // Capture the live donut canvas
      const donutCanvas = document.getElementById(`dc-${tab}-${idx}`);
      const donutDataUrl = donutCanvas ? captureCanvas(donutCanvas) : null;

      const donutImg = donutDataUrl
        ? `<img src="${donutDataUrl}" style="width:90px;height:90px;flex-shrink:0;" />`
        : `<div style="width:90px;height:90px;flex-shrink:0;background:#1e1e1e;border-radius:50%;"></div>`;

      const legRows = assets.map((a, ai) => `
        <div style="display:flex;align-items:center;gap:6px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
          <span style="width:7px;height:7px;border-radius:50%;background:${PALETTE[ai % PALETTE.length]};flex-shrink:0;display:inline-block;"></span>
          <span style="flex:1;font-size:10px;color:#888780;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.name}</span>
          <span style="font-size:10px;font-family:'DM Mono',monospace;color:#c8f542;margin-left:4px;">${a.pct.toFixed(1)}%</span>
          <span style="font-size:10px;font-family:'DM Mono',monospace;color:#555450;margin-left:8px;">${fmtC(a.value, d.currency)}</span>
        </div>`).join('');

      return `
        <div style="background:#1e1e1e;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:14px 16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <p style="font-size:12px;font-weight:500;color:#f0efe8;margin:0;">${d.title}</p>
            <p style="font-size:11px;font-family:'DM Mono',monospace;color:#888780;margin:0;">${fmtC(totalVal, d.currency)}</p>
          </div>
          <div style="display:flex;gap:14px;align-items:flex-start;">
            ${donutImg}
            <div style="flex:1;min-width:0;">${legRows}</div>
          </div>
        </div>`;
    }).filter(Boolean).join('');

    if (cards) {
      donutSection = `
        <div style="margin-bottom:24px;">
          <p style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#555450;margin-bottom:14px;">Asset Allocation · ${activeMonth}</p>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;">${cards}</div>
        </div>`;
    }
  }

  // ── 3. Metric values (mirrors renderMetrics exactly) ──
  let metricRows = [];
  if (tab === 'ink') {
    const d = active.ink;
    const last = d.totals[d.totals.length-1], prev = d.totals[d.totals.length-2] ?? last, first = d.totals[0];
    const peak = Math.max(...d.totals);
    const mom  = fmtPct(last, prev);
    const ytd  = calcYTD(d.months, d.totals);
    const ytdVal = ytd ? (ytd.diff >= 0 ? '+' : '') + fmtM(ytd.diff) + ' (' + (ytd.pct >= 0 ? '+' : '') + ytd.pct.toFixed(1) + '%)' : '—';
    metricRows = [
      { label: 'Current Net Worth', val: fmt(last),            sub: mom + ' MoM',                           pos: parseFloat(mom) >= 0 },
      { label: 'All-time Growth',   val: fmtPct(last, first),  sub: 'Since ' + d.firstLabel,                pos: null },
      { label: 'Peak',              val: fmt(peak),            sub: d.months[d.totals.indexOf(peak)],       pos: null },
      { label: ytd ? ytd.label : 'YTD', val: ytd ? (maskVals ? '••••••' : ytdVal) : '—',
        sub: ytd ? 'vs ' + fmt(ytd.janVal) + ' Jan' : 'No Jan in range',                                   pos: ytd ? ytd.diff >= 0 : null },
    ];
  } else if (tab === 'fang') {
    const d = active.fang;
    const last = d.totals[d.totals.length-1], prev = d.totals[d.totals.length-2] ?? last, first = d.totals[0];
    const peak = Math.max(...d.totals);
    const mom  = fmtPct(last, prev);
    const ytd  = calcYTD(d.months, d.totals);
    const ytdVal = ytd ? (ytd.diff >= 0 ? '+' : '') + fmtM(ytd.diff) + ' (' + (ytd.pct >= 0 ? '+' : '') + ytd.pct.toFixed(1) + '%)' : '—';
    metricRows = [
      { label: 'Current Net Worth', val: fmt(last),            sub: mom + ' MoM',                           pos: parseFloat(mom) >= 0 },
      { label: 'All-time Growth',   val: fmtPct(last, first),  sub: 'Since ' + d.firstLabel,                pos: null },
      { label: 'Peak',              val: fmt(peak),            sub: d.months[d.totals.indexOf(peak)],       pos: null },
      { label: ytd ? ytd.label : 'YTD', val: ytd ? (maskVals ? '••••••' : ytdVal) : '—',
        sub: ytd ? 'vs ' + fmt(ytd.janVal) + ' Jan' : 'No Jan in range',                                   pos: ytd ? ytd.diff >= 0 : null },
    ];
  } else {
    const inkS = active.ink, fangS = active.fang;
    const iL = inkS.totals[inkS.totals.length-1];
    const fL = fangS.totals.length ? fangS.totals[fangS.totals.length-1] : 0;
    const tot = iL + fL;
    const iP = inkS.totals[inkS.totals.length-2] ?? iL;
    const fP = fangS.totals.length > 1 ? fangS.totals[fangS.totals.length-2] : fL;
    const mom = fmtPct(tot, iP + fP);
    // Household YTD (same logic as renderMetrics)
    let hhJanIdx = -1;
    for (let i = inkS.totals.length - 1; i >= 0; i--) {
      if (/^jan/i.test(inkS.months[i])) { hhJanIdx = i; break; }
    }
    let hhYtd = null;
    if (hhJanIdx >= 0) {
      const fangStart  = inkS.months.indexOf(fangS.months[0]);
      const inkJanVal  = inkS.totals[hhJanIdx];
      const fangJanIdx = fangStart >= 0 ? hhJanIdx - fangStart : -1;
      const fangJanVal = (fangJanIdx >= 0 && fangJanIdx < fangS.totals.length) ? fangS.totals[fangJanIdx] : 0;
      const janTot = inkJanVal + fangJanVal;
      const diff   = tot - janTot;
      const pct    = janTot !== 0 ? diff / Math.abs(janTot) * 100 : 0;
      const year   = inkS.months[hhJanIdx].replace(/[^0-9]/g, '').slice(-2);
      hhYtd = { diff, pct, label: "YTD '" + (year || '?'), janVal: janTot };
    }
    const hhYtdVal = hhYtd
      ? (hhYtd.diff >= 0 ? '+' : '') + fmtM(hhYtd.diff) + ' (' + (hhYtd.pct >= 0 ? '+' : '') + hhYtd.pct.toFixed(1) + '%)'
      : '—';
    metricRows = [
      { label: 'Household Net Worth', val: fmt(tot),                          sub: mom + ' MoM',           pos: parseFloat(mom) >= 0 },
      { label: "Ink's Share",         val: tot > 0 ? (iL/tot*100).toFixed(0) + '%' : '—', sub: fmt(iL),  pos: null },
      { label: "Fang's Share",        val: tot > 0 ? (fL/tot*100).toFixed(0) + '%' : '—', sub: fmt(fL),  pos: null },
      { label: hhYtd ? hhYtd.label : 'YTD', val: hhYtd ? (maskVals ? '••••••' : hhYtdVal) : '—',
        sub: hhYtd ? 'vs ' + fmt(hhYtd.janVal) + ' Jan' : 'No Jan in range',                              pos: hhYtd ? hhYtd.diff >= 0 : null },
    ];
  }

  // ── 4. Goal values + prev month for MoM ──
  let cashVal = 0, investVal = 0, goals;
  let prevCash = 0, prevInvest = 0;
  let inkCash = 0, fangCash = 0, inkInvest = 0, fangInvest = 0; // household only

  if (tab === 'ink') {
    const v = getLatestValues(active.ink, INK_CONFIG);
    cashVal = v.cash; investVal = v.invest; goals = GOALS.ink;
    const fi = filterState[tab];
    const idx = fi < 0 ? inkData.totals.length - 1 : fi;
    if (idx > 0) {
      const pv = getLatestValues(sliceData(inkData, idx - 1), INK_CONFIG);
      prevCash = pv.cash; prevInvest = pv.invest;
    } else { prevCash = cashVal; prevInvest = investVal; }
  } else if (tab === 'fang') {
    const v = getLatestValues(active.fang, FANG_CONFIG);
    cashVal = v.cash; investVal = v.invest; goals = GOALS.fang;
    const fi = filterState[tab];
    const idx = fi < 0 ? fangData.totals.length - 1 : fi;
    if (idx > 0) {
      const pv = getLatestValues(sliceData(fangData, idx - 1), FANG_CONFIG);
      prevCash = pv.cash; prevInvest = pv.invest;
    } else { prevCash = cashVal; prevInvest = investVal; }
  } else {
    const vi = getLatestValues(active.ink, INK_CONFIG);
    const vf = getLatestValues(fangData, FANG_CONFIG);
    inkCash = vi.cash; fangCash = vf.cash;
    inkInvest = vi.invest; fangInvest = vf.invest;
    cashVal = inkCash + fangCash; investVal = inkInvest + fangInvest;
    goals = GOALS.household;
    const inkFi = filterState[tab];
    const inkIdx = inkFi < 0 ? inkData.totals.length - 1 : inkFi;
    if (inkIdx > 0) {
      const pvi = getLatestValues(sliceData(inkData, inkIdx - 1), INK_CONFIG);
      const fangStart = inkData.months.indexOf(fangData.months[0]);
      const fangIdx = Math.max(-1, inkIdx - 1 - fangStart);
      const pfSlice = sliceData(fangData, fangIdx);
      const pvf = pfSlice.totals.length ? getLatestValues(pfSlice, FANG_CONFIG) : { cash: 0, invest: 0 };
      prevCash = pvi.cash + pvf.cash; prevInvest = pvi.invest + pvf.invest;
    } else { prevCash = cashVal; prevInvest = investVal; }
  }


  function goalBar(label, cur, target) {
    const pct = Math.min(cur / target * 100, 100);
    const col = goalColor(pct);
    return `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
          <span style="font-size:11px;color:#888780;font-family:'DM Mono',monospace;">${label}</span>
          <span style="font-size:11px;font-family:'DM Mono',monospace;color:${col};">${pct.toFixed(1)}%</span>
        </div>
        <div style="height:5px;background:#222;border-radius:99px;overflow:hidden;">
          <div style="width:${pct}%;height:100%;background:${col};border-radius:99px;"></div>
        </div>
        <div style="text-align:right;font-size:10px;color:#555450;font-family:'DM Mono',monospace;margin-top:2px;">Target: ${maskVals ? '••••' : fmtM(target)}</div>
      </div>`;
  }

  function goalBarStacked(label, inkV, fangV, target) {
    const total = inkV + fangV;
    const pct = Math.min(total / target * 100, 100);
    const col = goalColor(pct);
    const inkPct  = Math.min(inkV  / target * 100, 100);
    const fangPct = Math.min(fangV / target * 100, Math.max(0, pct - inkPct));
    const inkShare  = total > 0 ? (inkV  / total * 100).toFixed(0) : 0;
    const fangShare = total > 0 ? (fangV / total * 100).toFixed(0) : 0;
    return `
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
          <span style="font-size:11px;color:#888780;font-family:'DM Mono',monospace;">${label}</span>
          <span style="font-size:11px;font-family:'DM Mono',monospace;color:${col};">${pct.toFixed(1)}%</span>
        </div>
        <div style="height:5px;background:#222;border-radius:99px;overflow:hidden;position:relative;">
          <div style="position:absolute;left:0;top:0;height:100%;width:${inkPct}%;background:#4da8f5;border-radius:99px 0 0 99px;"></div>
          <div style="position:absolute;left:${inkPct}%;top:0;height:100%;width:${fangPct}%;background:#5ce0a8;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:3px;">
          <div style="display:flex;gap:8px;">
            <span style="font-size:9px;font-family:'DM Mono',monospace;color:#4da8f5;display:flex;align-items:center;gap:3px;"><span style="width:5px;height:5px;border-radius:50%;background:#4da8f5;display:inline-block;"></span>Ink ${inkShare}%</span>
            <span style="font-size:9px;font-family:'DM Mono',monospace;color:#5ce0a8;display:flex;align-items:center;gap:3px;"><span style="width:5px;height:5px;border-radius:50%;background:#5ce0a8;display:inline-block;"></span>Fang ${fangShare}%</span>
          </div>
          <span style="font-size:10px;color:#555450;font-family:'DM Mono',monospace;">Target: ${maskVals ? '••••' : fmtM(target)}</span>
        </div>
      </div>`;
  }

  function exportMomLine(cur, prev) {
    const diff = cur - prev;
    if (diff === 0) return `<p style="font-family:'DM Mono',monospace;font-size:11px;color:#555450;margin-bottom:12px;">No change MoM</p>`;
    const col = diff > 0 ? '#5ce0a8' : '#f06b6b';
    return `<p style="font-family:'DM Mono',monospace;font-size:11px;color:${col};margin-bottom:12px;">${diff > 0 ? '+' : ''}${maskVals ? '••••' : fmtM(diff)} MoM</p>`;
  }

  // MoM strings
  const cashMoM   = exportMomLine(cashVal,   prevCash);
  const investMoM = exportMomLine(investVal, prevInvest);

  // Household contribution rows
  function exportContribRow(inkVal, fangVal) {
    if (tab !== 'household') return '';
    const total = inkVal + fangVal;
    const inkPct  = total > 0 ? (inkVal  / total * 100).toFixed(0) : 0;
    const fangPct = total > 0 ? (fangVal / total * 100).toFixed(0) : 0;
    return `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <span style="display:inline-flex;align-items:center;gap:5px;">
          <span style="width:6px;height:6px;border-radius:50%;background:#4da8f5;display:inline-block;flex-shrink:0;"></span>
          <span style="font-family:'DM Mono',monospace;font-size:10px;color:#888780;">Ink</span>
          <span style="font-family:'DM Mono',monospace;font-size:11px;color:#c8d4e0;">${fmt(inkVal)}</span>
          <span style="font-family:'DM Mono',monospace;font-size:10px;color:#555450;">${inkPct}%</span>
        </span>
        <span style="color:#555450;font-size:11px;">·</span>
        <span style="display:inline-flex;align-items:center;gap:5px;">
          <span style="width:6px;height:6px;border-radius:50%;background:#5ce0a8;display:inline-block;flex-shrink:0;"></span>
          <span style="font-family:'DM Mono',monospace;font-size:10px;color:#888780;">Fang</span>
          <span style="font-family:'DM Mono',monospace;font-size:11px;color:#c8d4e0;">${fmt(fangVal)}</span>
          <span style="font-family:'DM Mono',monospace;font-size:10px;color:#555450;">${fangPct}%</span>
        </span>
      </div>`;
  }

  // ── 5. Assemble card ──
  const now = new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  const card = document.createElement('div');
  card.style.cssText = `width:800px;background:#0d0d0d;color:#f0efe8;font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.6;padding:36px;box-sizing:border-box;`;

  card.innerHTML = `
    <!-- Header -->
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,0.07);">
      <div>
        <p style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;color:#555450;text-transform:uppercase;margin-bottom:4px;">VS NP · Net Worth Dashboard</p>
        <h1 style="font-size:22px;font-weight:300;letter-spacing:-.02em;margin:0;">${tabLabel} <strong style="font-weight:500;">Summary</strong></h1>
        <p style="font-family:'DM Mono',monospace;font-size:11px;color:#888780;margin-top:4px;">Viewing: ${viewingLabel}</p>
      </div>
      <div style="text-align:right;">
        <span style="font-family:'DM Mono',monospace;font-size:10px;color:#555450;background:#161616;border:1px solid rgba(255,255,255,0.07);border-radius:4px;padding:3px 8px;">v4.0</span>
        <p style="font-family:'DM Mono',monospace;font-size:10px;color:#555450;margin-top:6px;">Exported ${now}</p>
      </div>
    </div>

    <!-- Metrics -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;">
      ${metricRows.map(c => `
        <div style="background:#161616;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:14px 16px;">
          <p style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#555450;font-family:'DM Mono',monospace;margin-bottom:5px;">${c.label}</p>
          <p style="font-size:19px;font-weight:500;color:#f0efe8;font-family:'DM Mono',monospace;letter-spacing:-.02em;margin-bottom:2px;">${c.val}</p>
          <p style="font-size:10px;font-family:'DM Mono',monospace;color:${c.pos === true ? '#5ce0a8' : c.pos === false ? '#f06b6b' : '#555450'};">${c.sub}</p>
        </div>`).join('')}
    </div>

    <!-- Goals -->
    <div style="margin-bottom:24px;">
      <p style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#555450;margin-bottom:14px;">Goal Progress</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div style="background:#161616;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:16px 18px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
            <span style="font-size:12px;font-weight:500;">Cash</span>
            <span style="font-size:16px;font-family:'DM Mono',monospace;font-weight:500;">${fmt(cashVal)}</span>
          </div>
          ${cashMoM}
          ${exportContribRow(inkCash, fangCash)}
          ${tab === 'household' ? goalBarStacked('Short-term', inkCash, fangCash, goals.cash.st) : goalBar('Short-term', cashVal, goals.cash.st)}
          ${tab === 'household' ? goalBarStacked('Long-term',  inkCash, fangCash, goals.cash.lt) : goalBar('Long-term',  cashVal, goals.cash.lt)}
        </div>
        <div style="background:#161616;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:16px 18px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
            <span style="font-size:12px;font-weight:500;">Investible Assets</span>
            <span style="font-size:16px;font-family:'DM Mono',monospace;font-weight:500;">${fmt(investVal)}</span>
          </div>
          ${investMoM}
          ${exportContribRow(inkInvest, fangInvest)}
          ${tab === 'household' ? goalBarStacked('Short-term', inkInvest, fangInvest, goals.invest.st) : goalBar('Short-term', investVal, goals.invest.st)}
          ${tab === 'household' ? goalBarStacked('Long-term',  inkInvest, fangInvest, goals.invest.lt) : goalBar('Long-term',  investVal, goals.invest.lt)}
        </div>
      </div>
    </div>

    <!-- Chart -->
    ${chartSection}

    <!-- Donuts -->
    ${donutSection}

    <!-- Footer -->
    <div style="margin-top:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.07);display:flex;justify-content:space-between;align-items:center;">
      <p style="font-family:'DM Mono',monospace;font-size:10px;color:#555450;">VS NP Dashboard · v4.0${maskVals ? ' · Values hidden' : ''}</p>
      <p style="font-family:'DM Mono',monospace;font-size:10px;color:#555450;">${now}</p>
    </div>`;

  return card;
}

// ── Run export ──
async function runExport() {
  const goBtn = document.getElementById('export-go-btn');
  const prog  = document.getElementById('export-progress');
  if (!goBtn || !prog) return;

  goBtn.disabled = true;
  goBtn.textContent = 'Preparing…';
  prog.textContent = 'Loading export library…';

  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');

    prog.textContent = 'Capturing charts…';
    const maskVals = document.getElementById('export-mask-cb')?.checked ?? privacyMode;

    // If privacy export differs from current mode, we need to briefly
    // toggle privacy, re-render metrics, then restore — for the text values.
    // Charts are captured from live canvas so they always reflect current state.
    // We handle masking purely in buildSummaryCard via the maskVals flag.
    const card = buildSummaryCard(currentTab, maskVals);

    // Mount off-screen — must be in DOM for html2canvas
    card.style.position = 'fixed';
    card.style.top = '-9999px';
    card.style.left = '-9999px';
    document.body.appendChild(card);

    prog.textContent = 'Rendering…';
    // Give browser a frame to lay out the card
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 80)));

    const scale = exportFmt === 'pdf' ? 2 : 2.5;
    const canvas = await html2canvas(card, {
      backgroundColor: '#0d0d0d',
      scale,
      useCORS: true,
      allowTaint: true,
      logging: false,
      imageTimeout: 0,
    });

    document.body.removeChild(card);

    const tabSlug = currentTab;
    const fi = filterState[currentTab];
    const months = currentTab === 'household' ? inkData.months
                 : currentTab === 'ink'       ? inkData.months : fangData.months;
    const viewSlug = (fi < 0 ? months[months.length-1] : months[fi]).replace(/\s+/g,'-').toLowerCase();
    const filename = `vsnp-${tabSlug}-${viewSlug}`;

    if (exportFmt === 'jpg') {
      prog.textContent = 'Saving JPG…';
      const dataUrl = canvas.toDataURL('image/jpeg', 0.93);
      const a = document.createElement('a');
      a.href = dataUrl; a.download = filename + '.jpg'; a.click();
      prog.textContent = '✓ Downloaded!';
    } else {
      prog.textContent = 'Loading PDF library…';
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      prog.textContent = 'Saving PDF…';
      const { jsPDF } = window.jspdf;
      const pdfW = 794;
      const pdfH = Math.round(canvas.height / canvas.width * pdfW);
      const pdf = new jsPDF({ orientation: pdfH > pdfW ? 'p' : 'l', unit: 'px', format: [pdfW, pdfH] });
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pdfW, pdfH);
      pdf.save(filename + '.pdf');
      prog.textContent = '✓ Downloaded!';
    }

    goBtn.textContent = 'Done ✓';
    setTimeout(closeExportModal, 1200);
  } catch(err) {
    prog.textContent = '⚠ Export failed: ' + err.message;
    goBtn.disabled = false;
    goBtn.textContent = 'Retry';
    console.error('Export error:', err);
  }
}

// ─── KEYBOARD SHORTCUTS ────────────────────────────────────────────────────────
// ← / → step through months on the active tab
// ─── ORIENTATION / RESIZE FIX ────────────────────────────────────────────────
// Chart.js responsive resize sometimes drops datasets (especially the total
// line) after orientation change. Force a full redraw with a small delay so
// the browser has finished reflowing before we rebuild the canvas.
let _resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    if (inkData && fangData) {
      renderLegend(currentTab);
      renderChart(currentTab);
    }
  }, 120);
});


document.getElementById('export-btn').addEventListener('click', () => {
  if (inkData && fangData) openExportModal();
});

async function init() {
  const ok = await loadData();
  if (ok) renderAll('ink');
}

// ─── PWA INSTALL PROMPT ───────────────────────────────────────────────────────
let _installPrompt = null;
const installBtn = document.getElementById('install-btn');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installPrompt = e;
  installBtn.style.display = 'block'; // show button only when prompt is available
});

installBtn.addEventListener('click', async () => {
  if (!_installPrompt) return;
  _installPrompt.prompt();
  const { outcome } = await _installPrompt.userChoice;
  _installPrompt = null;
  installBtn.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
  _installPrompt = null;
});

// ─── PWA SERVICE WORKER ───────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'vsnp-v4.0';
const PRECACHE = [
  'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js',
  'https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400;500&display=swap',
];

self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE).then(c => c.addAll(PRECACHE).catch(() => {}))
  );
  self.skipWaiting();
});

self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    )
  );
  self.clients.claim();
});

self.addEventListener('fetch', e => {
  // Cache-first for CDN assets, network-first for everything else
  const url = e.request.url;
  const isCDN = url.includes('cdn.jsdelivr') || url.includes('fonts.googleapis') ||
                url.includes('fonts.gstatic') || url.includes('cdnjs.cloudflare');
  if (isCDN) {
    e.respondWith(
      caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {
        const clone = res.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
        return res;
      }))
    );
  }
  // Google Sheets data — always network, never cache
});
`;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl, { scope: './' })
    .catch(() => {}); // silently fail if blocked (e.g. cross-origin iframe)
}
</script>
