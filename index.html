<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS NP Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d; --surface: #161616; --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
    --text: #f0efe8; --text2: #888780; --text3: #555450;
    --accent: #c8f542; --green: #5ce0a8; --red: #f06b6b; --amber: #f0b429;
    --font-sans: 'DM Sans', sans-serif; --font-mono: 'DM Mono', monospace;
    --radius: 8px; --radius-lg: 12px;
  }
  html, body { height: 100%; overflow-x: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

  /* GATE */
  #gate { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  .gate-box { width: 320px; display: flex; flex-direction: column; gap: 20px; }
  .gate-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; }
  .gate-title { font-size: 22px; font-weight: 500; color: var(--text); line-height: 1.2; }
  .gate-version { font-family: var(--font-mono); font-size: 10px; color: var(--text3); margin-top: 6px; letter-spacing: .06em; }
  .gate-input-wrap { position: relative; }
  .gate-input { width: 100%; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px 44px 12px 16px; color: var(--text); font-family: var(--font-mono); font-size: 14px; outline: none; transition: border-color .2s; }
  .gate-input:focus { border-color: var(--accent); }
  .gate-input::placeholder { color: var(--text3); }
  .gate-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text3); font-size: 15px; line-height: 1; padding: 0; }
  .gate-btn { background: var(--accent); color: #0d0d0d; border: none; border-radius: var(--radius); padding: 12px 20px; font-family: var(--font-sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; width: 100%; }
  .gate-btn:hover { opacity: .88; }
  .gate-error { font-size: 12px; color: var(--red); font-family: var(--font-mono); display: none; }
  .gate-error.show { display: block; }

  /* APP */
  #app { display: none; min-height: 100vh; }
  #app.visible { display: block; }
  .topbar { border-bottom: 1px solid var(--border); padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; background: rgba(13,13,13,0.95); backdrop-filter: blur(8px); gap: 8px; }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 1; overflow: hidden; }
  .topbar-name { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--text2); white-space: nowrap; }
  .topbar-sep { color: var(--text3); flex-shrink: 0; }
  .topbar-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .last-updated { font-family: var(--font-mono); font-size: 11px; color: var(--text3); white-space: nowrap; }
  .version-badge { font-family: var(--font-mono); font-size: 10px; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; letter-spacing: .04em; white-space: nowrap; }
  .refresh-btn { background: none; border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text2); font-size: 12px; padding: 5px 10px; cursor: pointer; font-family: var(--font-sans); transition: all .15s; white-space: nowrap; }
  .refresh-btn:hover { color: var(--text); background: var(--surface); }
  .refresh-btn .refresh-label { display: inline; }
  
  /* EXPORT COMPONENT CONTROLS */
  .export-container { position: relative; display: inline-block; }
  .export-btn { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text); font-size: 12px; padding: 5px 12px; cursor: pointer; font-family: var(--font-sans); transition: all .15s; display: flex; align-items: center; gap: 4px; }
  .export-btn:hover { background: var(--surface); border-color: var(--accent); }
  .export-dropdown { display: none; position: absolute; right: 0; top: 100%; margin-top: 4px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); min-width: 170px; z-index: 50; box-shadow: 0 4px 20px rgba(0,0,0,0.5); overflow: hidden; }
  .export-dropdown.show { display: block; }
  .export-group-title { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; color: var(--text3); padding: 6px 12px 2px; letter-spacing: .05em; }
  .export-item { width: 100%; background: none; border: none; text-align: left; padding: 6px 14px; font-size: 12px; color: var(--text2); cursor: pointer; font-family: var(--font-sans); display: block; transition: all .12s; }
  .export-item:hover { background: var(--surface); color: var(--accent); }
  
  .logout-btn { background: none; border: none; color: var(--text3); font-size: 12px; cursor: pointer; font-family: var(--font-mono); letter-spacing: .04em; padding: 0; transition: color .15s; white-space: nowrap; }
  .logout-btn:hover { color: var(--text2); }
  .main { max-width: 1100px; margin: 0 auto; padding: 36px 32px 64px; width: 100%; }
  .page-header { margin-bottom: 40px; }
  .page-title { font-size: 28px; font-weight: 300; letter-spacing: -.02em; }
  .page-title strong { font-weight: 500; }
  .page-subtitle { font-size: 13px; color: var(--text3); margin-top: 4px; font-family: var(--font-mono); }
  .tabs { display: flex; gap: 4px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
  .tab { font-size: 13px; font-weight: 400; padding: 8px 18px 10px; background: none; border: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; font-family: var(--font-sans); }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

  /* METRIC CARDS */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; }
  .metric-label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); font-family: var(--font-mono); margin-bottom: 6px; }
  .metric-val { font-size: 22px; font-weight: 500; color: var(--text); letter-spacing: -.02em; font-family: var(--font-mono); }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: var(--font-mono); }
  .metric-sub.pos { color: var(--green); }
  .metric-sub.neg { color: var(--red); }

  /* GOAL SECTION */
  .goal-section { margin-bottom: 36px; }
  .goal-section-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 14px; }
  .goal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .goal-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; }
  .goal-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .goal-card-title { font-size: 12px; font-weight: 500; color: var(--text); }
  .goal-card-icon { font-size: 16px; opacity: .6; }
  .goal-card-current { font-family: var(--font-mono); font-size: 18px; font-weight: 500; color: var(--text); margin-bottom: 12px; }
  .goal-bars { display: flex; flex-direction: column; gap: 10px; }
  .goal-bar-row { display: flex; flex-direction: column; gap: 4px; }
  .goal-bar-meta { display: flex; justify-content: space-between; align-items: center; }
  .goal-bar-label { font-family: var(--font-mono); font-size: 10px; color: var(--text3); letter-spacing: .04em; }
  .goal-bar-pct { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
  .goal-bar-track { height: 5px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .goal-bar-fill { height: 100%; border-radius: 99px; transition: width .6s cubic-bezier(.4,0,.2,1); }
  .goal-bar-target { font-family: var(--font-mono); font-size: 10px; color: var(--text3); text-align: right; margin-top: 1px; }
  .goal-bar-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1px; }
  .goal-bar-mom { font-family: var(--font-mono); font-size: 10px; }
  .goal-bar-mom.pos { color: var(--green); }
  .goal-bar-mom.neg { color: var(--red); }
  .goal-bar-mom.flat { color: var(--text3); }

  /* LINE CHART */
  .chart-wrap { position: relative; width: 100%; height: 340px; }
  .chart-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--text3); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 18px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); cursor: pointer; padding: 3px 0; transition: color .15s; user-select: none; }
  .legend-item:hover { color: var(--text2); }
  .legend-item.hidden { opacity: .3; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .chart-tooltip { position: absolute; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 12px 16px; font-size: 12px; pointer-events: none; z-index: 20; min-width: 200px; display: none; }
  .tt-month { font-family: var(--font-mono); font-size: 11px; color: var(--text3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; }
  .tt-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 2px 0; color: var(--text2); }
  .tt-row-label { display: flex; align-items: center; gap: 6px; }
  .tt-dot { width: 6px; height: 6px; border-radius: 1px; flex-shrink: 0; }
  .tt-val { font-family: var(--font-mono); color: var(--text); }
  .tt-total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; font-weight: 500; color: var(--text); }

  /* DONUT SECTION */
  .donut-section { margin-top: 48px; }
  .donut-section-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .donut-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .donut-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 20px 18px; }
  .donut-card-title { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 16px; }
  .donut-card-body { display: flex; align-items: center; gap: 18px; }
  .donut-canvas-wrap { position: relative; flex-shrink: 0; }
  .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60%; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; }
  .donut-center-total { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--text); line-height: 1.3; word-break: break-all; }
  .donut-center-label { font-family: var(--font-mono); font-size: 8px; color: var(--text3); margin-top: 2px; }
  .donut-center-hover-pct { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.2; display: none; }
  .donut-center-hover-val { font-family: var(--font-mono); font-size: 9px; color: var(--text3); margin-top: 2px; word-break: break-all; display: none; }
  .donut-center-hover-name { font-family: var(--font-mono); font-size: 8px; color: var(--text3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; display: none; }
  .donut-leg { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .donut-leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); cursor: default; transition: color .15s; border-radius: 4px; padding: 1px 3px; margin: 0 -3px; }
  .donut-leg-item:hover { color: var(--text2); background: rgba(255,255,255,0.04); }
  .donut-leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .donut-leg-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
  .donut-leg-pct { font-family: var(--font-mono); font-size: 10px; flex-shrink: 0; }
  .donut-leg-val { font-family: var(--font-mono); font-size: 9px; color: var(--text3); flex-shrink: 0; opacity: 0; transition: opacity .15s; margin-left: 2px; }
  .donut-leg-item:hover .donut-leg-val { opacity: 1; }
  .donut-empty { font-family: var(--font-mono); font-size: 11px; color: var(--text3); text-align: center; padding: 32px 0; }

  /* STATUS */
  .status-bar { margin-top: 32px; padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text3); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .status-dot.loading { background: var(--amber); animation: pulse 1s infinite; }
  .status-dot.error { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
  .error-box { background: rgba(240,107,107,0.06); border: 1px solid rgba(240,107,107,0.2); border-radius: var(--radius); padding: 16px; font-family: var(--font-mono); font-size: 12px; color: var(--red); display: none; margin-bottom: 20px; }
  .error-box.show { display: block; }

  /* PRIVACY TOGGLE */
  .privacy-btn { background: none; border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text2); font-size: 12px; padding: 5px 12px; cursor: pointer; font-family: var(--font-sans); transition: all .15s; white-space: nowrap; }
  .privacy-btn:hover { color: var(--text); background: var(--surface); }
  .privacy-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(200,245,66,0.06); }

  .num-mask { display: inline-block; background: var(--surface2); color: transparent; border-radius: 4px; user-select: none; min-width: 4em; height: 1em; vertical-align: middle; filter: blur(0); position: relative; }
  .num-mask::after { content: '••••••'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: .75em; letter-spacing: .1em; filter: blur(0); }

  body.privacy .y-axis-blur { filter: blur(6px); pointer-events: none; }

  @media (max-width: 480px) {
    .topbar { padding: 0 14px; height: auto; min-height: 52px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; gap: 6px; }
    .topbar-left { flex: 1 1 100%; justify-content: flex-start; }
    .topbar-right { flex: 1 1 100%; justify-content: flex-end; gap: 6px; }
    .topbar-sep { display: none; }
    .topbar-title { display: none; }
    .version-badge { display: none; }
    .last-updated { display: none; }
    .refresh-btn .refresh-label { display: none; }

    .main { padding: 20px 14px 48px; }
    .page-title { font-size: 20px; }
    .page-subtitle { font-size: 11px; }

    .tabs { gap: 0; }
    .tab { flex: 1; text-align: center; padding: 8px 6px 10px; font-size: 12px; }

    .metric-grid { grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .metric-card { padding: 12px 12px; }
    .metric-val { font-size: 16px; }
    .metric-label { font-size: 9px; }
    .metric-sub { font-size: 10px; }

    .goal-grid { grid-template-columns: 1fr; gap: 10px; }
    .goal-card { padding: 14px 14px; }
    .goal-card-current { font-size: 15px; }

    .chart-wrap { height: 220px; }
    .legend { gap: 6px 12px; margin-top: 12px; }
    .legend-item { font-size: 10px; }

    .donut-grid { grid-template-columns: 1fr; gap: 12px; }
    .donut-card { padding: 14px; }
    .donut-canvas-wrap { width: 110px; height: 110px; }
    .donut-card-body { gap: 12px; }

    .chart-tooltip { min-width: 160px; font-size: 11px; padding: 10px 12px; max-width: calc(100vw - 28px); }
    .privacy-btn { font-size: 11px; padding: 4px 8px; }
  }

  @media (min-width: 481px) and (max-width: 768px) {
    .topbar { padding: 0 16px; }
    .version-badge { display: none; }
    .last-updated { display: none; }
    .main { padding: 28px 20px 56px; }
    .metric-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .goal-grid { grid-template-columns: 1fr 1fr; }
    .chart-wrap { height: 260px; }
    .donut-grid { grid-template-columns: 1fr; }
    .privacy-btn { font-size: 11px; padding: 5px 8px; }
  }

  /* TIME FILTER */
  .filter-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; color: var(--text3); text-transform: uppercase; white-space: nowrap; }
  .filter-scroll { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-pill {
    font-family: var(--font-mono); font-size: 11px; white-space: nowrap;
    padding: 4px 12px; border-radius: 99px; cursor: pointer; flex-shrink: 0;
    border: 1px solid var(--border2); background: transparent; color: var(--text3);
    transition: all .15s;
  }
  .filter-pill:hover { color: var(--text2); border-color: rgba(255,255,255,0.25); }
  .filter-pill.active { background: var(--accent); color: #0d0d0d; border-color: var(--accent); font-weight: 500; }
  @media (max-width: 480px) {
    .filter-bar { gap: 6px; margin-bottom: 16px; }
    .filter-pill { font-size: 10px; padding: 3px 10px; }
  }

  /* SKELETON / SHIMMER */
  @keyframes shimmer {
    0%   { background-position: -600px 0; }
    100% { background-position:  600px 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, #222 50%, var(--surface) 75%);
    background-size: 1200px 100%;
    animation: shimmer 1.4s infinite linear;
    border-radius: var(--radius);
  }
  .skeleton-screen { padding: 0; }
  .skel-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .skel-card { flex: 1; height: 78px; border-radius: var(--radius-lg); }
  .skel-bar  { height: 10px; border-radius: 99px; margin-bottom: 8px; }
  .skel-bar.wide  { width: 80%; }
  .skel-bar.mid   { width: 55%; }
  .skel-bar.short { width: 35%; }
  .skel-chart { width: 100%; height: 280px; border-radius: var(--radius-lg); margin-top: 16px; margin-bottom: 20px; }
  #skeleton-screen { display: none; padding: 0; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div>
      <p class="gate-label">Protected</p>
      <h1 class="gate-title">VS NP<br>Dashboard</h1>
      <p class="gate-version">v2.6</p>
    </div>
    <div>
      <div class="gate-input-wrap">
        <input class="gate-input" type="password" id="pwd-input" placeholder="Enter password" autocomplete="current-password">
        <button class="gate-toggle" id="pwd-toggle" type="button">&#128065;</button>
      </div>
      <p class="gate-error" id="gate-error">Incorrect password</p>
    </div>
    <button class="gate-btn" id="gate-submit">Unlock &rarr;</button>
  </div>
</div>

<div id="app">
  <nav class="topbar">
    <div class="topbar-left">
      <span class="topbar-name">VS NP</span>
      <span class="topbar-sep">&middot;</span>
      <span class="topbar-title">Net Worth Dashboard</span>
    </div>
    <div class="topbar-right">
      <span class="version-badge">v2.6</span>
      <span class="last-updated" id="last-updated">&mdash;</span>
      <button class="refresh-btn" id="refresh-btn">&#8635;<span class="refresh-label">&nbsp;Refresh</span></button>
      <button class="privacy-btn" id="privacy-btn" title="Hide financial values">&#128065; Hide</button>
      
      <div class="export-container">
        <button class="export-btn" id="export-trigger-btn">
          <span>&#128190;</span><span>Export Summary</span>
        </button>
        <div class="export-dropdown" id="export-dropdown-menu">
          <p class="export-group-title">Ink Portfolio</p>
          <button class="export-item" onclick="executeSummaryExport('ink', 'jpg')">Ink Summary (.JPG)</button>
          <button class="export-item" onclick="executeSummaryExport('ink', 'pdf')">Ink Summary (.PDF)</button>
          
          <p class="export-group-title">Fang Portfolio</p>
          <button class="export-item" onclick="executeSummaryExport('fang', 'jpg')">Fang Summary (.JPG)</button>
          <button class="export-item" onclick="executeSummaryExport('fang', 'pdf')">Fang Summary (.PDF)</button>
          
          <p class="export-group-title">Household Total</p>

// CSV PARSING
function parseCSV(text) {
  return text.split('\n').map(line => {
    const cols=[]; let cur='', inQ=false;
    for (let i=0;i<line.length;i++) {
      const c=line[i];
      if (c==='"') { inQ=!inQ; }
      else if (c===',' && !inQ) { cols.push(cur.trim()); cur=''; }
      else cur+=c;
    }
    cols.push(cur.trim());
    return cols;
  });
}
function numVal(s) {
  if (!s) return 0;
  const n = parseFloat(String(s).replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? 0 : n;
}
async function fetchCSV(url) {
  const res = await fetch(url + '&_=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return parseCSV(await res.text());
}
function detectCurrency(raw) {
  const s = String(raw||'');
  if (s.includes('$')) return 'USD';
  return 'THB';
}
function fmtCurrency(val, currency) {
  if (currency === 'USD') return '$' + val.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return '฿' + Math.round(val).toLocaleString('th-TH');
}

function extractData(rows, config) {
  const labelRow = rows[config.monthLabelRow] || [];
  const months = [];
  let emptyStreak = 0;
  for (let c=config.dataStartCol; c<500; c++) {
    const lbl = (labelRow[c]||'').trim();
    if (!lbl) {
      emptyStreak++;
      if (emptyStreak>10) break;
      continue;
    }
    emptyStreak = 0;
    const ll = lbl.toLowerCase();
    if (/^\d{4}/.test(lbl)||ll.includes('market value')||ll.includes('actual')||
        ll.includes('budget')||ll.includes('target')||ll.includes('projected')||
        ll.includes('goal')||ll.includes('percentage')) continue;
    if (!config.componentRows.some(ri => numVal((rows[ri]||[])[c]) > 0)) continue;
    months.push({ col:c, label:lbl });
  }
  if (!months.length) return null;
  const components = config.componentRows.map((ri,idx) => ({
    name: config.componentNames[idx],
    color: config.colors[idx],
    values: months.map(m => numVal((rows[ri]||[])[m.col]))
  }));
  const totals = months.map(m => config.componentRows.reduce((s,ri) => s + numVal((rows[ri]||[])[m.col]), 0));
  const labels = months.map(m => m.label);
  return { months:labels, components, totals };
}

function computeHousehold(ink, fang) {
  if (!ink || !fang) return null;
  const allM = Array.from(new Set([...ink.months, ...fang.months])).sort();
  const components = [
    { name: 'Ink Total', color: '#c8f542', values: [] },
    { name: 'Fang Total', color: '#5ce0a8', values: [] }
  ];
  const totals = [];
  allM.forEach(m => {
    const iIdx = ink.months.indexOf(m);
    const fIdx = fang.months.indexOf(m);
    const iVal = iIdx>-1 ? ink.totals[iIdx] : (totals[totals.length-1]?ink.totals[ink.totals.length-1]:0);
    const fVal = fIdx>-1 ? fang.totals[fIdx] : (totals[totals.length-1]?fang.totals[fang.totals.length-1]:0);
    components[0].values.push(iVal);
    components[1].values.push(fVal);
    totals.push(iVal + fVal);
  });
  return { months: allM, components, totals };
}

// DATA LOADING
async function loadData() {
  try {
    setStatus('Updating indices...', true);
    const [inkRaw, fangRaw] = await Promise.all([
      fetchCSV(INK_CSV_URL),
      fetchCSV(FANG_CSV_URL)
    ]);
    inkData = extractData(inkRaw, INK_CONFIG);
    fangData = extractData(fangRaw, FANG_CONFIG);
    householdData = computeHousehold(inkData, fangData);
    
    if (inkData) activeMonthIdx = inkData.months.length - 1;
    
    setStatus('Ready');
    document.getElementById('skeleton-screen').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';
    
    // Non-blocking background parsing for allocation tables
    loadAllocationDonuts();
    renderAll(currentTab);
    return true;
  } catch(e) {
    console.error(e);
    setStatus('Sync failure', false, true);
    document.getElementById('error-box').textContent = 'Sync connection breakdown: ' + e.message;
    document.getElementById('error-box').classList.add('show');
    return false;
  }
}

async function loadAllocationDonuts() {
  const fetchSingle = async (item) => {
    try {
      const csvData = await fetchCSV(item.url);
      const rowLabels = csvData[0] || [];
      const mvRowIdx = csvData.findIndex(r => String(r[0]).toLowerCase().includes('market value thb'));
      if (mvRowIdx === -1) return null;
      
      const monthsFound = [];
      for (let c=1; c<rowLabels.length; c++) {
        if (rowLabels[c] && rowLabels[c].trim()) monthsFound.push({ label: rowLabels[c].trim(), col: c });
      }
      
      const byMonth = {};
      monthsFound.forEach(m => {
        const assets = [];
        for (let r=item.assetRowStart; r<=item.assetRowEnd; r++) {
          if (!csvData[r]) continue;
          const name = (csvData[r][0] || '').trim();
          const val = numVal(csvData[r][m.col]);
          if (name && val > 0) {
            assets.push({ name, value: val, currency: detectCurrency(csvData[item.currencyRow]?.[m.col]) });
          }
        }
        const sum = assets.reduce((s,x)=>s+x.value,0);
        if (sum > 0) {
          assets.forEach(x => x.pct = (x.value/sum)*100);
          byMonth[m.label] = assets;
        }
      });
      return { title: item.title, byMonth };
    } catch(err) { return null; }
  };
  
  const inkRes = await Promise.all(INK_DONUTS.map(fetchSingle));
  inkDonutData = inkRes.filter(x => x !== null);
  const fangRes = await Promise.all(FANG_DONUTS.map(fetchSingle));
  fangDonutData = fangRes.filter(x => x !== null);
  
  if (inkDonutData.length || fangDonutData.length) {
    document.getElementById('donut-section').style.display = 'block';
    renderDonutFilter(currentTab);
    renderDonuts(currentTab);
  }
}

function setStatus(text, loading=false, error=false) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot' + (loading?' loading':'') + (error?' error':'');
  document.getElementById('status-text').textContent = text;
}

// RENDER PIPELINE
function renderAll(tab) {
  renderFilterBar(tab);
  renderMetrics(tab);
  renderGoals(tab);
  renderMainChart(tab);
  renderDonutFilter(tab);
  renderDonuts(tab);
  
  const dataset = tab==='ink' ? inkData : (tab==='fang'?fangData:householdData);
  if (dataset) {
    document.getElementById('data-range').textContent = 'Time-Series Sequence: ' + dataset.months[0] + ' \u2192 ' + dataset.months[dataset.months.length-1];
    document.getElementById('last-updated').textContent = 'As of ' + dataset.months[dataset.months.length-1];
  }
}

function renderFilterBar(tab) {
  const dataset = tab==='ink' ? inkData : (tab==='fang'?fangData:householdData);
  const wrap = document.getElementById('filter-scroll');
  wrap.innerHTML = '';
  if (!dataset) return;
  dataset.months.forEach((m, idx) => {
    const pill = document.createElement('button');
    pill.className = 'filter-pill' + (idx === activeMonthIdx ? ' active':'');
    pill.textContent = m;
    pill.addEventListener('click', () => {
      activeMonthIdx = idx;
      renderAll(tab);
    });
    wrap.appendChild(pill);
  });
}

function renderMetrics(tab) {
  const dataset = tab==='ink' ? inkData : (tab==='fang'?fangData:householdData);
  const grid = document.getElementById('metric-grid');
  grid.innerHTML = '';
  if (!dataset || activeMonthIdx === null || activeMonthIdx >= dataset.months.length) return;
  
  const total = dataset.totals[activeMonthIdx];
  let deltaStr = '\u2014';
  let deltaClass = 'metric-sub';
  if (activeMonthIdx > 0) {
    const prev = dataset.totals[activeMonthIdx-1];
    const diff = total - prev;
    const pct = (diff/prev)*100;
    deltaStr = (diff>=0?'+': '') + Math.round(pct).toLocaleString() + '% MoM';
    deltaClass = 'metric-sub' + (diff>=0?' pos':' neg');
  }
  
  // Total Card
  grid.appendChild(createMetricCard('Net Worth Total', fmtCurrency(total, 'THB'), deltaStr, deltaClass));
  
  if (tab !== 'household') {
    const config = tab === 'ink' ? INK_CONFIG : FANG_CONFIG;
    const cashVal = dataset.components[config.cashComponentIdx].values[activeMonthIdx];
    const investVal = total - cashVal;
    grid.appendChild(createMetricCard('Liquid Cash Capital', fmtCurrency(cashVal, 'THB'), 'Safety Reserves'));
    grid.appendChild(createMetricCard('Market Investment Base', fmtCurrency(investVal, 'THB'), 'Risk Portfolio'));
  } else {
    const inkVal = inkData ? inkData.totals[inkData.months.indexOf(dataset.months[activeMonthIdx])] || 0 : 0;
    const fangVal = fangData ? fangData.totals[fangData.months.indexOf(dataset.months[activeMonthIdx])] || 0 : 0;
    grid.appendChild(createMetricCard('Ink Allocation Share', fmtCurrency(inkVal, 'THB'), ((inkVal/total)*100).toFixed(1) + '% Contribution'));
    grid.appendChild(createMetricCard('Fang Allocation Share', fmtCurrency(fangVal, 'THB'), ((fangVal/total)*100).toFixed(1) + '% Contribution'));
  }
}

function createMetricCard(lbl, val, sub, subClass='metric-sub') {
  const div = document.createElement('div');
  div.className = 'metric-card';
  div.innerHTML = `<p class="metric-label">${lbl}</p><p class="metric-val">${mask(val)}</p><p class="${subClass}">${sub}</p>`;
  return div;
}

function renderGoals(tab) {
  const dataset = tab==='ink' ? inkData : (tab==='fang'?fangData:householdData);
  const grid = document.getElementById('goal-grid');
  grid.innerHTML = '';
  if (!dataset || activeMonthIdx === null) return;
  
  const total = dataset.totals[activeMonthIdx];
  const config = tab==='ink'? INK_CONFIG : FANG_CONFIG;
  const cashVal = tab==='household' ? (inkData.components[INK_CONFIG.cashComponentIdx].values[inkData.months.indexOf(dataset.months[activeMonthIdx])]||0)+(fangData.components[FANG_CONFIG.cashComponentIdx].values[fangData.months.indexOf(dataset.months[activeMonthIdx])]||0) : dataset.components[config.cashComponentIdx].values[activeMonthIdx];
  const investVal = total - cashVal;
  
  const g = GOALS[tab];
  grid.appendChild(createGoalCard('Liquidity Cash Target Tracker', cashVal, g.cash.st, g.cash.lt));
  grid.appendChild(createGoalCard('Long Term Wealth Target Tracker', investVal, g.invest.st, g.invest.lt));
}

function createGoalCard(title, val, st, lt) {
  const div = document.createElement('div');
  div.className = 'goal-card';
  const stPct = Math.min((val/st)*100, 100);
  const ltPct = Math.min((val/lt)*100, 100);
  
  div.innerHTML = `
    <div class="goal-card-header"><span class="goal-card-title">${title}</span></div>
    <div class="goal-card-current">${mask(fmtCurrency(val, 'THB'))}</div>
    <div class="goal-bars">
      <div class="goal-bar-row">
        <div class="goal-bar-meta"><span class="goal-bar-label">Short-Term Baseline Target</span><span class="goal-bar-pct">${stPct.toFixed(1)}%</span></div>
        <div class="goal-track-wrap"><div class="goal-bar-track"><div class="goal-bar-fill" style="width:${stPct}%; background:${stPct>=100?'var(--green)':'var(--accent)'}"></div></div></div>
        <p class="goal-bar-target">Target Milestone: ${fmtCurrency(st, 'THB')}</p>
      </div>
      <div class="goal-bar-row">
        <div class="goal-bar-meta"><span class="goal-bar-label">Long-Term Wealth Horizon</span><span class="goal-bar-pct">${ltPct.toFixed(1)}%</span></div>
        <div class="goal-track-wrap"><div class="goal-bar-track"><div class="goal-bar-fill" style="width:${ltPct}%; background:${ltPct>=100?'var(--green)':'#3b82f6'}"></div></div></div>
        <p class="goal-bar-target">Target Milestone: ${fmtCurrency(lt, 'THB')}</p>
      </div>
    </div>
  `;
  return div;
}

// CHART ENGINE
let chartInstance = null;
function renderMainChart(tab) {
  const dataset = tab==='ink' ? inkData : (tab==='fang'?fangData:householdData);
  const ctx = document.getElementById('main-chart').getContext('2d');
  document.getElementById('chart-loading').style.display = 'none';
  if (!dataset) return;
  
  if (chartInstance) chartInstance.destroy();
  
  const ds = dataset.components.map(c => ({
    label: c.name,
    data: c.values,
    borderColor: c.color,
    backgroundColor: c.color + '15',
    borderWidth: 2,
    pointRadius: 3,
    pointHoverRadius: 6,
    fill: true,
    tension: 0.15
  }));
  
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: dataset.months, datasets: ds },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#888780', font: { family: 'DM Mono', size: 10 } } },
        y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { callback: (v)=> privacyMode ? '•••' : v.toLocaleString(), color: '#888780', font: { family: 'DM Mono', size: 10 } } }
      }
    }
  });
  renderLegend(tab);
}

function renderLegend(tab) {
  const dataset = tab==='ink' ? inkData : (tab==='fang'?fangData:householdData);
  const leg = document.getElementById('legend');
  leg.innerHTML = '';
  if (!dataset || !chartInstance) return;
  
  dataset.components.forEach((c, idx) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${c.color}"></span><span>${c.name}</span>`;
    item.addEventListener('click', () => {
      const meta = chartInstance.getDatasetMeta(idx);
      meta.hidden = meta.hidden === null ? !chartInstance.data.datasets[idx].hidden : null;
      item.classList.toggle('hidden', meta.hidden);
      chartInstance.update();
    });
    leg.appendChild(item);
  });
}

// ALLOCATION DONUTS ENGINE
function getDonutMonths(tab) {
  const list = tab==='ink' ? inkDonutData : fangDonutData;
  if (!list.length) return [];
  const set = new Set();
  list.forEach(item => { Object.keys(item.byMonth).forEach(m => set.add(m)); });
  return Array.from(set).sort();
}

function renderDonutFilter(tab) {
  const scroll = document.getElementById('donut-filter-scroll');
  scroll.innerHTML = '';
  if (tab === 'household') {
    document.getElementById('donut-section').style.display = 'none';
    return;
  }
  const months = getDonutMonths(tab);
  if (!months.length) {
    document.getElementById('donut-section').style.display = 'none';
    return;
  }
  document.getElementById('donut-section').style.display = 'block';
  const latest = months[months.length - 1];
  if (!donutFilterState[tab]) donutFilterState[tab] = latest;
  
  months.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'filter-pill' + (donutFilterState[tab] === m ? ' active' : '');
    btn.textContent = m;
    btn.addEventListener('click', () => {
      donutFilterState[tab] = m;
      renderDonutFilter(tab);
      renderDonuts(tab);
    });
    scroll.appendChild(btn);
  });
}

function renderDonuts(tab) {
  const grid = document.getElementById('donut-grid');
  grid.innerHTML = '';
  if (tab === 'household') return;
  
  const list = tab==='ink' ? inkDonutData : fangDonutData;
  const activeMonth = donutFilterState[tab];
  if (!list.length || !activeMonth) {
    grid.innerHTML = '<div class="donut-empty">No item breakdowns parsed yet</div>';
    return;
  }
  
  list.forEach((dataItem, cIdx) => {
    const assets = dataItem.byMonth[activeMonth] || [];
    if (!assets.length) return;
    
    const card = document.createElement('div');
    card.className = 'donut-card';
    
    const title = document.createElement('p');
    title.className = 'donut-card-title';
    title.textContent = dataItem.title;
    card.appendChild(title);
    
    const body = document.createElement('div');
    body.className = 'donut-card-body';
    
    const canvasWrap = document.createElement('div');
    canvasWrap.className = 'donut-canvas-wrap';
    canvasWrap.style.width = '120px'; canvasWrap.style.height = '120px';
    
    const canvas = document.createElement('canvas');
    canvas.width = 120; canvas.height = 120;
    canvasWrap.appendChild(canvas);
    
    const center = document.createElement('div');
    center.className = 'donut-center';
    const totalVal = assets.reduce((s,x)=>s+x.value,0);
    
    center.innerHTML = `
      <span class="donut-center-total" id="d-total-${cIdx}-${tab}">${mask(fmtCurrency(totalVal, assets[0].currency))}</span>
      <span class="donut-center-label" id="d-label-${cIdx}-${tab}">Total</span>
      <span class="donut-center-hover-pct" id="d-hpct-${cIdx}-${tab}"></span>
      <span class="donut-center-hover-val" id="d-hval-${cIdx}-${tab}"></span>
      <span class="donut-center-hover-name" id="d-hname-${cIdx}-${tab}"></span>
    `;
    canvasWrap.appendChild(center);
    body.appendChild(canvasWrap);
    
    const leg = document.createElement('div');
    leg.className = 'donut-leg';
    
    // Sort assets by size descending
    const sortedAssets = [...assets].sort((a,b)=>b.pct - a.pct);
    const chartColors = sortedAssets.map((_,i) => PALETTE[i % PALETTE.length]);
    
    sortedAssets.forEach((a, aIdx) => {
      const col = chartColors[aIdx];
      const item = document.createElement('div');
      item.className = 'donut-leg-item';
      item.innerHTML = `
        <span class="donut-leg-dot" style="background:${col}"></span>
        <span class="donut-leg-name">${a.name}</span>
        <span class="donut-leg-pct">${a.pct.toFixed(1)}%</span>
        <span class="donut-leg-val">${mask(fmtCurrency(a.value, a.currency))}</span>
      `;
      
      item.addEventListener('mouseenter', () => toggleDonutCenterHover(tab, cIdx, aIdx, true));
      item.addEventListener('mouseleave', () => toggleDonutCenterHover(tab, cIdx, aIdx, false));
      leg.appendChild(item);
    });
    
    body.appendChild(leg);
    card.appendChild(body);
    grid.appendChild(card);
    
    // Instantiate background chart architecture wrapper configuration context
    new Chart(canvas.getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: sortedAssets.map(x=>x.name),
        datasets: [{
          data: sortedAssets.map(x=>x.value),
          backgroundColor: chartColors,
          borderWidth: 0,
          hoverOffset: 2
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        cutout: '76%'
      }
    });
  });
}

function toggleDonutCenterHover(tab, cardIdx, assetIdx, entering) {
  const totalEl = document.getElementById(`d-total-${cardIdx}-${tab}`);
  const labelEl = document.getElementById(`d-label-${cardIdx}-${tab}`);
  const hPctEl  = document.getElementById(`d-hpct-${cardIdx}-${tab}`);
  const hValEl  = document.getElementById(`d-hval-${cardIdx}-${tab}`);
  const hNameEl = document.getElementById(`d-hname-${cardIdx}-${tab}`);
  
  if (totalEl && labelEl && hPctEl && hValEl && hNameEl) {
    const list = tab==='ink' ? inkDonutData : fangDonutData;
    const activeM = donutFilterState[tab];
    const d = list[cardIdx];
    let assets = d ? (d.byMonth[activeM] || []) : [];
    assets = [...assets].sort((a,b) => b.pct - a.pct);
    const a = assets[assetIdx];
    
    if (entering && a) {
      totalEl.style.display = 'none'; labelEl.style.display = 'none';
      hPctEl.style.display = 'block'; hValEl.style.display = 'block'; hNameEl.style.display = 'block';
      hPctEl.textContent  = a.pct.toFixed(1) + '%';
      hValEl.textContent  = mask(fmtCurrency(a.value, a.currency));
      hNameEl.textContent = a.name;
    } else {
      const totalVal = assets.reduce((s,x)=>s+x.value,0);
      totalEl.style.display = 'block'; totalEl.textContent = mask(fmtCurrency(totalVal, assets[0]?.currency || 'THB'));
      labelEl.style.display = 'block';
      hPctEl.style.display = 'none'; hValEl.style.display = 'none'; hNameEl.style.display = 'none';
    }
  }
}

// TAB MANAGEMENT NAVIGATION
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', e => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    e.target.classList.add('active');
    currentTab = e.target.getAttribute('data-tab');
    if (currentTab === 'household') {
      if (inkData) activeMonthIdx = householdData.months.indexOf(inkData.months[inkData.months.length-1]);
    } else {
      const d = currentTab === 'ink' ? inkData : fangData;
      if (d) activeMonthIdx = d.months.length - 1;
    }
    renderAll(currentTab);
  });
});

document.getElementById('refresh-btn').addEventListener('click', () => loadData());

function init() {
  applyPrivacyMode();
  loadData();
}

// ═══════════════════════════════════════════════════════════════════
// CLientside SUMMARY EXPORT SYSTEM (v2.6 ADDITION)
// ═══════════════════════════════════════════════════════════════════
async function executeSummaryExport(targetTab, outputFormat) {
  setStatus('Compiling summary snapshot...', true);
  
  // Choose standard base dataset targets context
  let sourceDataset = inkData;
  let titleHeader = "INK PORTFOLIO SUMMARY";
  let donorAllocation = inkDonutData;
  let donutMonth = donutFilterState['ink'];
  
  if (targetTab === 'fang') {
    sourceDataset = fangData;
    titleHeader = "FANG PORTFOLIO SUMMARY";
    donorAllocation = fangDonutData;
    donutMonth = donutFilterState['fang'];
  } else if (targetTab === 'household') {
    sourceDataset = householdData;
    titleHeader = "HOUSEHOLD COMBINED TOTAL NET WORTH SUMMARY";
    donorAllocation = null;
  }
  
  if (!sourceDataset || activeMonthIdx === null) {
    alert("Data context is currently empty or loading. Try again shortly.");
    setStatus('Ready');
    return;
  }
  
  const selectedMonth = sourceDataset.months[activeMonthIdx];
  const totalNetWorth = sourceDataset.totals[activeMonthIdx];
  
  // Construct clean container styled with high contrast theme for beautiful mobile rendering
  const exportFrame = document.createElement('div');
  exportFrame.style.position = 'absolute';
  exportFrame.style.left = '-9999px';
  exportFrame.style.top = '-9999px';
  exportFrame.style.width = '420px'; // Structured exactly for sharp clear mobile viewport tracking
  exportFrame.style.backgroundColor = '#0d0d0d';
  exportFrame.style.color = '#f0efe8';
  exportFrame.style.fontFamily = "'DM Sans', sans-serif";
  exportFrame.style.padding = '24px';
  exportFrame.style.boxSizing = 'border-box';
  
  // Header Blocks
  let frameHtml = `
    <div style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 14px; margin-bottom: 20px;">
      <p style="font-family:'DM Mono', monospace; font-size:10px; color:#888780; margin:0; letter-spacing:0.1em; text-transform:uppercase;">Financial Report</p>
      <h2 style="font-size:20px; font-weight:500; margin:4px 0 2px 0; color:#c8f542; letter-spacing:-0.01em;">${titleHeader}</h2>
      <p style="font-family:'DM Mono', monospace; font-size:11px; color:#555450; margin:0;">Sequence Scope Cycle: ${selectedMonth} &middot; v2.6</p>
    </div>
    
    <div style="background: #161616; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 18px; margin-bottom: 18px; text-align:center;">
      <p style="font-family:'DM Mono', monospace; font-size:9px; color:#888780; text-transform:uppercase; margin:0 0 4px 0; letter-spacing:0.08em;">Aggregated Net Worth Value</p>
      <p style="font-family:'DM Mono', monospace; font-size:26px; font-weight:500; color:#f0efe8; margin:0; letter-spacing:-0.02em;">${fmtCurrency(totalNetWorth, 'THB')}</p>
    </div>
    
    <div style="margin-bottom: 20px;">
      <p style="font-family:'DM Mono', monospace; font-size:10px; color:#888780; text-transform:uppercase; margin:0 0 10px 0; letter-spacing:0.06em;">Asset Streams Matrix</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
  `;
  
  sourceDataset.components.forEach(comp => {
    const assetVal = comp.values[activeMonthIdx] || 0;
    const proportionPct = totalNetWorth > 0 ? ((assetVal / totalNetWorth) * 100).toFixed(1) : 0;
    frameHtml += `
      <div style="display:flex; align-items:center; justify-content:space-between; background:#161616; padding:10px 12px; border-radius:6px; border-left:3px solid ${comp.color};">
        <span style="font-size:13px; color:#f0efe8; font-weight:400;">${comp.name}</span>
        <div style="text-align:right; font-family:'DM Mono', monospace;">
          <span style="font-size:13px; color:#f0efe8; font-weight:500; display:block;">${fmtCurrency(assetVal, 'THB')}</span>
          <span style="font-size:10px; color:#888780;">${proportionPct}% allocation</span>
        </div>
      </div>
    `;
  });
  
  frameHtml += `</div></div>`;
  
  // If donuts asset sub-allocations are live parsed, extract and display deep sub-allocations nested inside summaries cleanly
  if (donorAllocation && donorAllocation.length && donutMonth) {
    frameHtml += `
      <div style="margin-bottom: 12px; border-top:1px solid rgba(255,255,255,0.06); padding-top:16px;">
        <p style="font-family:'DM Mono', monospace; font-size:10px; color:#888780; text-transform:uppercase; margin:0 0 10px 0; letter-spacing:0.06em;">Sub-Asset Allocation Splits (${donutMonth})</p>
    `;
    
    donorAllocation.forEach(subItem => {
      const tokens = subItem.byMonth[donutMonth] || [];
      if (!tokens.length) return;
      
      frameHtml += `
        <div style="margin-bottom:14px; background:#1e1e1e; padding:10px; border-radius:6px;">
          <p style="font-size:11px; font-weight:500; color:#c8f542; margin:0 0 6px 0; font-family:'DM Mono', monospace;">&raquo; ${subItem.title}</p>
          <div style="display:flex; flex-direction:column; gap:4px;">
      `;
      
      const limitedSorted = [...tokens].sort((a,b)=>b.pct-a.pct);
      limitedSorted.forEach(t => {
        frameHtml += `
          <div style="display:flex; justify-content:space-between; font-size:11px; font-family:'DM Mono', monospace; color:#888780;">
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:240px;">${t.name}</span>
            <span style="color:#f0efe8; flex-shrink:0;">${t.pct.toFixed(1)}% (${fmtCurrency(t.value, t.currency)})</span>
          </div>
        `;
      });
      
      frameHtml += `</div></div>`;
    });
    frameHtml += `</div>`;
  }
  
  // Footer branding
  frameHtml += `
    <div style="text-align:center; border-top:1px solid rgba(255,255,255,0.06); padding-top:12px; margin-top:20px;">
      <p style="font-family:'DM Mono', monospace; font-size:9px; color:#555450; margin:0; letter-spacing:0.04em;">VS NP METRIC INTELLIGENCE NETWORTH DASHBOARD BUILD ENGINE</p>
    </div>
  `;
  
  exportFrame.innerHTML = frameHtml;
  document.body.appendChild(exportFrame);
  
  try {
    // Render clean viewport utilizing standard resolution scales
    const options = {
      scale: 2, // High DPI density output for dynamic razor-sharp renders
      useCORS: true,
      backgroundColor: '#0d0d0d',
      logging: false
    };
    
    const canvas = await html2canvas(exportFrame, options);
    const fileNameString = `${targetTab}_summary_${selectedMonth.replace(/[^a-zA-Z0-9]/g, '_')}`;
    
    if (outputFormat === 'jpg' || outputFormat === 'jpeg') {
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const link = document.createElement('a');
      link.download = `${fileNameString}.jpg`;
      link.href = imgData;
      link.click();
    } else if (outputFormat === 'pdf') {
      const { jsPDF } = window.jspdf;
      const imgWidth = canvas.width;
      const imgHeight = canvas.height;
      
      // Calculate optimized dimensional layout targets mapping clean parameters
      const pdfWidth = 210; // Standard A4 base
      const pdfHeight = (imgHeight * pdfWidth) / imgWidth;
      
      const pdf = new jsPDF('p', 'mm', [pdfWidth, pdfHeight]);
      const imgData = canvas.toDataURL('image/jpeg', 1.0);
      
      pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
      pdf.save(`${fileNameString}.pdf`);
    }
  } catch (err) {
    console.error("Export pipeline failure details:", err);
    alert("Export generation pipeline encounter. Details: " + err.message);
  } finally {
    document.body.removeChild(exportFrame);
    setStatus('Ready');
  }
}
</script>
