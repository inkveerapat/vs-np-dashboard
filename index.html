<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS NP Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d; --surface: #161616; --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
    --text: #f0efe8; --text2: #888780; --text3: #555450;
    --accent: #c8f542; --ink: #4da8f5; --fang: #5ce0a8; --combined: #c8f542;
    --font-sans: 'DM Sans', sans-serif; --font-mono: 'DM Mono', monospace;
    --radius: 8px; --radius-lg: 12px;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

  /* GATE */
  #gate { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  .gate-box { width: 320px; display: flex; flex-direction: column; gap: 20px; }
  .gate-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; color: var(--text3); text-transform: uppercase; }
  .gate-title { font-size: 22px; font-weight: 500; color: var(--text); line-height: 1.2; }
  .gate-input-wrap { position: relative; }
  .gate-input { width: 100%; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 12px 44px 12px 16px; color: var(--text); font-family: var(--font-mono); font-size: 14px; outline: none; transition: border-color .2s; }
  .gate-input:focus { border-color: var(--accent); }
  .gate-input::placeholder { color: var(--text3); }
  .gate-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text3); font-size: 18px; line-height: 1; padding: 0; }
  .gate-btn { background: var(--accent); color: #0d0d0d; border: none; border-radius: var(--radius); padding: 12px 20px; font-family: var(--font-sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; width: 100%; }
  .gate-btn:hover { opacity: .88; }
  .gate-error { font-size: 12px; color: #f06b6b; font-family: var(--font-mono); display: none; }
  .gate-error.show { display: block; }

  /* APP */
  #app { display: none; min-height: 100vh; }
  #app.visible { display: block; }
  .topbar { border-bottom: 1px solid var(--border); padding: 0 32px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; background: rgba(13,13,13,0.92); backdrop-filter: blur(8px); }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-name { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--text2); }
  .topbar-sep { color: var(--text3); }
  .topbar-title { font-size: 13px; font-weight: 500; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .last-updated { font-family: var(--font-mono); font-size: 11px; color: var(--text3); }
  .version-badge { font-family: var(--font-mono); font-size: 10px; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; letter-spacing: .04em; }
  .refresh-btn { background: none; border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text2); font-size: 12px; padding: 5px 12px; cursor: pointer; font-family: var(--font-sans); transition: all .15s; }
  .refresh-btn:hover { color: var(--text); background: var(--surface); }
  .logout-btn { background: none; border: none; color: var(--text3); font-size: 12px; cursor: pointer; font-family: var(--font-mono); letter-spacing: .04em; padding: 0; transition: color .15s; }
  .logout-btn:hover { color: var(--text2); }
  .main { max-width: 1100px; margin: 0 auto; padding: 36px 32px 64px; }
  .page-header { margin-bottom: 40px; }
  .page-title { font-size: 28px; font-weight: 300; letter-spacing: -.02em; }
  .page-title strong { font-weight: 500; }
  .page-subtitle { font-size: 13px; color: var(--text3); margin-top: 4px; font-family: var(--font-mono); }
  .tabs { display: flex; gap: 4px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
  .tab { font-size: 13px; font-weight: 400; padding: 8px 18px 10px; background: none; border: none; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; font-family: var(--font-sans); }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 32px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; }
  .metric-label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); font-family: var(--font-mono); margin-bottom: 6px; }
  .metric-val { font-size: 22px; font-weight: 500; color: var(--text); letter-spacing: -.02em; font-family: var(--font-mono); }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: var(--font-mono); }
  .metric-sub.pos { color: #5ce0a8; }
  .metric-sub.neg { color: #f06b6b; }
  .chart-wrap { position: relative; width: 100%; height: 340px; }
  .chart-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--text3); letter-spacing: .06em; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 18px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); cursor: pointer; padding: 3px 0; transition: color .15s; user-select: none; }
  .legend-item:hover { color: var(--text2); }
  .legend-item.hidden { opacity: .3; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .chart-tooltip { position: absolute; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 12px 16px; font-size: 12px; pointer-events: none; z-index: 20; min-width: 200px; display: none; }
  .tt-month { font-family: var(--font-mono); font-size: 11px; color: var(--text3); letter-spacing: .06em; margin-bottom: 8px; text-transform: uppercase; }
  .tt-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 2px 0; color: var(--text2); }
  .tt-row-label { display: flex; align-items: center; gap: 6px; }
  .tt-dot { width: 6px; height: 6px; border-radius: 1px; flex-shrink: 0; }
  .tt-val { font-family: var(--font-mono); color: var(--text); }
  .tt-total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; font-weight: 500; color: var(--text); }
  .status-bar { margin-top: 32px; padding: 10px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text3); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #5ce0a8; flex-shrink: 0; }
  .status-dot.loading { background: #f0b429; }
  .status-dot.error { background: #f06b6b; }
  .error-box { background: rgba(240,107,107,0.06); border: 1px solid rgba(240,107,107,0.2); border-radius: var(--radius); padding: 16px; font-family: var(--font-mono); font-size: 12px; color: #f06b6b; display: none; margin-bottom: 20px; }
  .error-box.show { display: block; }
  @media (max-width: 600px) { .topbar { padding: 0 16px; } .main { padding: 24px 16px 48px; } .tab { padding: 8px 12px 10px; font-size: 12px; } .metric-val { font-size: 18px; } }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div>
      <p class="gate-label">Protected</p>
      <h1 class="gate-title">VS NP<br>Dashboard</h1>
    </div>
    <div>
      <div class="gate-input-wrap">
        <input class="gate-input" type="password" id="pwd-input" placeholder="Enter password" autocomplete="current-password">
        <button class="gate-toggle" id="pwd-toggle" type="button">⌥</button>
      </div>
      <p class="gate-error" id="gate-error">Incorrect password</p>
    </div>
    <button class="gate-btn" id="gate-submit">Unlock →</button>
  </div>
</div>

<div id="app">
  <nav class="topbar">
    <div class="topbar-left">
      <span class="topbar-name">VS NP</span>
      <span class="topbar-sep">·</span>
      <span class="topbar-title">Net Worth Dashboard</span>
    </div>
    <div class="topbar-right">
      <span class="version-badge">v1.3</span>
      <span class="last-updated" id="last-updated">—</span>
      <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
      <button class="logout-btn" id="logout-btn">lock</button>
    </div>
  </nav>

  <main class="main">
    <div class="page-header">
      <h1 class="page-title">Net Worth <strong>Overview</strong></h1>
      <p class="page-subtitle" id="data-range">Loading data…</p>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="ink">Ink</button>
      <button class="tab" data-tab="fang">Fang</button>
      <button class="tab" data-tab="household">Household</button>
    </div>

    <div id="metric-grid" class="metric-grid"></div>
    <div class="error-box" id="error-box">Failed to load data. Check that your Google Sheet is published to the web.</div>

    <div style="position:relative;">
      <div class="chart-wrap">
        <canvas id="main-chart"></canvas>
        <div class="chart-loading" id="chart-loading">Loading…</div>
      </div>
      <div class="chart-tooltip" id="chart-tooltip"></div>
    </div>
    <div class="legend" id="legend"></div>

    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Fetching data from Google Sheets…</span>
    </div>
  </main>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const VERSION  = 'v1.3';
const PASSWORD = 'vsnp2026';

const INK_CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSU57IeIZ_tnLFAgZNYUf9dThcFaEm8suslumtMaOVdUPAksG1XicXIFcmVDHWqdPDt9PKP-TgY8-Is/pub?gid=0&single=true&output=csv';
const FANG_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSU57IeIZ_tnLFAgZNYUf9dThcFaEm8suslumtMaOVdUPAksG1XicXIFcmVDHWqdPDt9PKP-TgY8-Is/pub?gid=576373003&single=true&output=csv';

// ROW INDICES (0-based after CSV parse)
// Ink sheet: Row 1 (idx 0) = blank, Row 2 (idx 1) = year headers ("2024 Actual" etc),
//            Row 3 (idx 2) = month labels ("Mar 2024", "April 2024" …)
//            Rows 4-9 (idx 3-8) = component values
// Fang sheet: similar structure — month labels in row 2 (idx 1), data rows 4-8 (idx 3-7)

const INK_CONFIG = {
  monthLabelRow: 0,           // Row 0 (0-based): "Mar 2024", "Apr 2024" ... "Apr-2026"
  componentRows: [3,4,5,6,7,8], // Rows 3-8: Cash, Dividend, Growth, Tax-saving, Crypto, PVD
  dataStartCol: 1,            // Col B (0-based)
  componentNames: ['Cash','Dividend portfolio','Growth portfolio','Tax-saving portfolio','Crypto','Provident fund'],
  colors: ['#4da8f5','#5ce0a8','#a78bfa','#f0b429','#f472b6','#fb923c'],
};

const FANG_CONFIG = {
  monthLabelRow: 0,           // Row 0 (0-based): "Jul-2025", "Aug 2025" ... "Apr-2026"
  componentRows: [3,4,5,6,7], // Rows 3-7: Cash, Mutual fund, Thai stock, US stock, PVD
  dataStartCol: 1,
  componentNames: ['Cash portfolio','Mutual fund','Thai stocks','US stocks','Provident fund'],
  colors: ['#4da8f5','#5ce0a8','#a78bfa','#f0b429','#fb923c'],
};

// ── AUTH ────────────────────────────────────────────────────────────────────
const SESSION_KEY = 'vsnp_auth';
function checkAuth() { return sessionStorage.getItem(SESSION_KEY) === 'true'; }
function unlock() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  sessionStorage.setItem(SESSION_KEY, 'true');
  init();
}
document.getElementById('gate-submit').addEventListener('click', () => {
  if (document.getElementById('pwd-input').value === PASSWORD) { unlock(); }
  else {
    const err = document.getElementById('gate-error');
    err.classList.add('show');
    document.getElementById('pwd-input').value = '';
    setTimeout(() => err.classList.remove('show'), 2500);
  }
});
document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('gate-submit').click(); });
let pwdVisible = false;
document.getElementById('pwd-toggle').addEventListener('click', () => {
  pwdVisible = !pwdVisible;
  document.getElementById('pwd-input').type = pwdVisible ? 'text' : 'password';
});
document.getElementById('logout-btn').addEventListener('click', () => { sessionStorage.removeItem(SESSION_KEY); location.reload(); });
if (checkAuth()) unlock();

// ── CSV PARSE ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  return text.split('\n').map(line => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cols.push(cur.trim());
    return cols;
  });
}

function numVal(s) {
  if (!s) return 0;
  const n = parseFloat(String(s).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}

// ── EXTRACT DATA ─────────────────────────────────────────────────────────────
// Strategy:
// 1. Scan ALL columns from dataStartCol rightward (no fixed end)
// 2. A column is "valid data" if its month label row has a non-empty string AND
//    at least one component row has a non-zero value in that column
// 3. Stop scanning once we hit 10 consecutive empty-label columns (end of data)
function extractData(rows, config) {
  const labelRow = rows[config.monthLabelRow] || [];
  const months = [];
  let emptyStreak = 0;

  for (let c = config.dataStartCol; c < 500; c++) {
    const lbl = (labelRow[c] || '').trim();

    // Count consecutive blank label columns — stop after 10
    if (!lbl) { emptyStreak++; if (emptyStreak > 10) break; continue; }
    emptyStreak = 0;

    // Skip non-month labels (year group headers, budget cols, etc)
    // Valid month labels look like "Mar 2024", "Apr-2026", "Jul-2025"
    // Invalid: "2024 Actual", "Market value", "2026 Projected", "Budget"
    const lblLower = lbl.toLowerCase();
    const isYearHeader = /^\d{4}/.test(lbl);          // starts with 4-digit year
    const isMarketValue = lblLower.includes('market value');
    const isBudgetTarget = lblLower.includes('budget') || lblLower.includes('target') ||
                           lblLower.includes('projected') || lblLower.includes('goal') ||
                           lblLower.includes('percentage') || lblLower.includes('actual');
    if (isYearHeader || isMarketValue || isBudgetTarget) continue;

    // Check at least one component row has a real value here
    const hasValue = config.componentRows.some(ri => {
      const v = numVal((rows[ri] || [])[c]);
      return v > 0;
    });
    if (!hasValue) continue;

    months.push({ col: c, label: lbl });
  }

  if (months.length === 0) return { months: [], components: [], totals: [], firstLabel: '', lastLabel: '' };

  const components = config.componentRows.map((ri, idx) => ({
    name: config.componentNames[idx],
    color: config.colors[idx],
    values: months.map(m => numVal((rows[ri] || [])[m.col]))
  }));

  // Total = sum of component rows for each month (not relying on a "total" row)
  const totals = months.map(m =>
    config.componentRows.reduce((sum, ri) => sum + numVal((rows[ri] || [])[m.col]), 0)
  );

  const labels = months.map(m => m.label);
  return { months: labels, components, totals, firstLabel: labels[0], lastLabel: labels[labels.length - 1] };
}

// ── FETCH ─────────────────────────────────────────────────────────────────────
let inkData = null, fangData = null;

async function fetchSheet(url) {
  const res = await fetch(url + '&_=' + Date.now()); // cache-bust
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return parseCSV(await res.text());
}

async function loadData() {
  setStatus('loading', 'Fetching from Google Sheets…');
  document.getElementById('chart-loading').style.display = 'flex';
  document.getElementById('error-box').classList.remove('show');
  try {
    const [inkRows, fangRows] = await Promise.all([fetchSheet(INK_CSV_URL), fetchSheet(FANG_CSV_URL)]);
    inkData  = extractData(inkRows,  INK_CONFIG);
    fangData = extractData(fangRows, FANG_CONFIG);

    if (inkData.months.length === 0 || fangData.months.length === 0) {
      throw new Error('No data found — check row/column config');
    }

    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    setStatus('ok', 'Live · Google Sheets · v1.3 · Auto-updates on refresh');
    document.getElementById('chart-loading').style.display = 'none';
    return true;
  } catch(e) {
    setStatus('error', 'Failed to load: ' + e.message);
    document.getElementById('error-box').textContent = 'Error: ' + e.message;
    document.getElementById('error-box').classList.add('show');
    document.getElementById('chart-loading').style.display = 'none';
    return false;
  }
}

function setStatus(state, msg) {
  document.getElementById('status-dot').className = 'status-dot' + (state === 'loading' ? ' loading' : state === 'error' ? ' error' : '');
  document.getElementById('status-text').textContent = msg;
}

// ── FORMAT ───────────────────────────────────────────────────────────────────
function fmtM(v) {
  const abs = Math.abs(v);
  if (abs >= 1e6) return '฿' + (v/1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return '฿' + (v/1e3).toFixed(0) + 'K';
  return '฿' + Math.round(v).toLocaleString();
}
function fmtPct(a, b) {
  if (!b || b === 0) return '—';
  const d = (a - b) / b * 100;
  return (d >= 0 ? '+' : '') + d.toFixed(1) + '%';
}
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── METRICS ───────────────────────────────────────────────────────────────────
function renderMetrics(tab) {
  const grid = document.getElementById('metric-grid');
  let cards = [];

  function personalCards(d) {
    const last  = d.totals[d.totals.length - 1];
    const prev  = d.totals[d.totals.length - 2] ?? last;
    const first = d.totals[0];
    const mom   = fmtPct(last, prev);
    const peakVal = Math.max(...d.totals);
    const peakLbl = d.months[d.totals.indexOf(peakVal)];
    return [
      { label: 'Current net worth', val: fmtM(last),          sub: mom + ' MoM',                       subClass: parseFloat(mom) >= 0 ? 'pos' : 'neg' },
      { label: 'All-time growth',   val: fmtPct(last, first), sub: 'Since ' + d.firstLabel,             subClass: '' },
      { label: 'Peak',              val: fmtM(peakVal),       sub: peakLbl,                             subClass: '' },
      { label: 'Months tracked',    val: d.months.length,     sub: d.firstLabel + ' → ' + d.lastLabel, subClass: '' },
    ];
  }

  if (tab === 'ink')  cards = personalCards(inkData);
  else if (tab === 'fang') cards = personalCards(fangData);
  else {
    const inkLast  = inkData.totals[inkData.totals.length - 1];
    const fangLast = fangData.totals[fangData.totals.length - 1];
    const total    = inkLast + fangLast;
    const inkPrev  = inkData.totals[inkData.totals.length - 2] ?? inkLast;
    const fangPrev = fangData.totals[fangData.totals.length - 2] ?? fangLast;
    const mom = fmtPct(total, inkPrev + fangPrev);
    cards = [
      { label: 'Household net worth', val: fmtM(total),                           sub: mom + ' MoM',          subClass: parseFloat(mom) >= 0 ? 'pos' : 'neg' },
      { label: "Ink's share",         val: (inkLast/total*100).toFixed(0) + '%',  sub: fmtM(inkLast),         subClass: '' },
      { label: "Fang's share",        val: (fangLast/total*100).toFixed(0) + '%', sub: fmtM(fangLast),        subClass: '' },
      { label: 'Data since',          val: inkData.firstLabel,                    sub: 'Ink started first',   subClass: '' },
    ];
  }

  grid.innerHTML = cards.map(c => `
    <div class="metric-card">
      <p class="metric-label">${c.label}</p>
      <p class="metric-val">${c.val}</p>
      <p class="metric-sub ${c.subClass}">${c.sub}</p>
    </div>`).join('');
}

// ── DATA RANGE ────────────────────────────────────────────────────────────────
function renderDataRange(tab) {
  const el = document.getElementById('data-range');
  if (tab === 'ink')
    el.textContent = `${inkData.firstLabel} → ${inkData.lastLabel} · ${inkData.months.length} months`;
  else if (tab === 'fang')
    el.textContent = `${fangData.firstLabel} → ${fangData.lastLabel} · ${fangData.months.length} months`;
  else
    el.textContent = `Ink from ${inkData.firstLabel} · Fang from ${fangData.firstLabel}`;
}

// ── CHART ─────────────────────────────────────────────────────────────────────
let chartInstance = null;
let hiddenSeries = new Set();

function buildDatasets(tab) {
  if (tab === 'ink' || tab === 'fang') {
    const d = tab === 'ink' ? inkData : fangData;
    const datasets = d.components
      .filter(c => !hiddenSeries.has(c.name))
      .map(c => ({
        label: c.name, data: c.values,
        borderColor: c.color, backgroundColor: hexAlpha(c.color, 0.15),
        borderWidth: 1.5, fill: 'origin', tension: 0.4,
        pointRadius: 2, pointHoverRadius: 5, pointBackgroundColor: c.color, stack: 'stack'
      }));
    datasets.push({
      label: '__total__', data: d.totals,
      borderColor: 'rgba(255,255,255,0.35)', backgroundColor: 'transparent',
      borderWidth: 1.5, borderDash: [4,3], fill: false, tension: 0.4,
      pointRadius: 0, pointHoverRadius: 4, stack: undefined
    });
    return { labels: d.months, datasets };
  } else {
    // Household: align Fang's shorter timeline onto Ink's longer one
    const inkMonths  = inkData.months;
    const fangStart  = inkMonths.indexOf(fangData.months[0]);
    const combined   = inkData.totals.map((v, i) => {
      const fi = fangStart !== -1 ? i - fangStart : -1;
      return v + (fi >= 0 && fi < fangData.totals.length ? fangData.totals[fi] : 0);
    });
    const fangAligned = inkMonths.map((_, i) => {
      const fi = fangStart !== -1 ? i - fangStart : -1;
      return fi >= 0 && fi < fangData.totals.length ? fangData.totals[fi] : null;
    });
    return {
      labels: inkMonths,
      datasets: [
        { label: 'Ink',  data: inkData.totals,  borderColor: '#4da8f5', backgroundColor: hexAlpha('#4da8f5',0.08), borderWidth: 2, fill: false, tension: 0.4, pointRadius: 2, pointHoverRadius: 5, pointBackgroundColor: '#4da8f5' },
        { label: 'Fang', data: fangAligned, borderColor: '#5ce0a8', backgroundColor: hexAlpha('#5ce0a8',0.08), borderWidth: 2, fill: false, tension: 0.4, pointRadius: 2, pointHoverRadius: 5, pointBackgroundColor: '#5ce0a8', spanGaps: false },
        { label: 'Household total', data: combined, borderColor: '#c8f542', backgroundColor: hexAlpha('#c8f542',0.06), borderWidth: 2, borderDash: [5,3], fill: false, tension: 0.4, pointRadius: 0, pointHoverRadius: 5, pointBackgroundColor: '#c8f542' }
      ]
    };
  }
}

function renderChart(tab) {
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const { labels, datasets } = buildDatasets(tab);
  const ctx = document.getElementById('main-chart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'line', data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: externalTooltip }
      },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false }, ticks: { color: '#555450', font: { family: "'DM Mono', monospace", size: 10 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 14 }, border: { color: 'rgba(255,255,255,0.06)' } },
        y: { grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false }, ticks: { color: '#555450', font: { family: "'DM Mono', monospace", size: 10 }, callback: v => fmtM(v) }, border: { color: 'rgba(255,255,255,0.06)' }, beginAtZero: true }
      }
    }
  });
}

function externalTooltip(context) {
  const tt = document.getElementById('chart-tooltip');
  if (context.tooltip.opacity === 0) { tt.style.display = 'none'; return; }
  const t = context.tooltip;
  const visiblePts = t.dataPoints.filter(p => p.dataset.label !== '__total__' && p.raw !== null && p.raw !== undefined);
  const totalPt    = t.dataPoints.find(p => p.dataset.label === '__total__');
  const hhPt       = t.dataPoints.find(p => p.dataset.label === 'Household total');
  let html = `<div class="tt-month">${t.title[0] || ''}</div>`;
  visiblePts.forEach(p => {
    html += `<div class="tt-row"><span class="tt-row-label"><span class="tt-dot" style="background:${p.dataset.borderColor}"></span>${p.dataset.label}</span><span class="tt-val">${fmtM(p.raw)}</span></div>`;
  });
  if (totalPt) html += `<div class="tt-row tt-total"><span>Total</span><span class="tt-val">${fmtM(totalPt.raw)}</span></div>`;
  else if (hhPt && hhPt.raw !== null) html += `<div class="tt-row tt-total"><span>Household</span><span class="tt-val">${fmtM(hhPt.raw)}</span></div>`;
  tt.innerHTML = html;
  tt.style.display = 'block';
  const wrapRect = tt.parentElement.getBoundingClientRect();
  let left = t.caretX + 18;
  if (left + 220 > wrapRect.width) left = t.caretX - 230;
  tt.style.left = Math.max(0, left) + 'px';
  tt.style.top  = Math.max(0, t.caretY - 20) + 'px';
}

// ── LEGEND ────────────────────────────────────────────────────────────────────
function renderLegend(tab) {
  const leg = document.getElementById('legend');
  if (tab === 'household') {
    leg.innerHTML = [{name:'Ink',color:'#4da8f5'},{name:'Fang',color:'#5ce0a8'},{name:'Household total',color:'#c8f542'}]
      .map(i => `<span class="legend-item"><span class="legend-dot" style="background:${i.color}"></span>${i.name}</span>`).join('');
    return;
  }
  const d = tab === 'ink' ? inkData : fangData;
  leg.innerHTML = d.components.map(c =>
    `<span class="legend-item ${hiddenSeries.has(c.name)?'hidden':''}" onclick="toggleSeries('${c.name}')">
      <span class="legend-dot" style="background:${c.color}"></span>${c.name}
    </span>`).join('');
}

function toggleSeries(name) {
  if (hiddenSeries.has(name)) hiddenSeries.delete(name); else hiddenSeries.add(name);
  renderLegend(currentTab); renderChart(currentTab);
}

// ── TABS ──────────────────────────────────────────────────────────────────────
let currentTab = 'ink';
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    hiddenSeries.clear();
    renderAll(currentTab);
  });
});

function renderAll(tab) {
  renderMetrics(tab);
  renderLegend(tab);
  renderChart(tab);
  renderDataRange(tab);
}

document.getElementById('refresh-btn').addEventListener('click', async () => {
  const ok = await loadData();
  if (ok) renderAll(currentTab);
});

async function init() {
  const ok = await loadData();
  if (ok) renderAll('ink');
}
</script>
</body>
</html>
